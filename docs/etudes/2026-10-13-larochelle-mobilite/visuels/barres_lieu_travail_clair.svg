<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 362" width="600" height="362" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter La Rochelle, travailler ici ou dans une commune voisine</title>
<desc id="d">Graphique en deux barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à La Rochelle, 44 % de ceux qui travaillent à La Rochelle vont travailler principalement en voiture, contre 72 % de ceux qui travaillent à Aytré, Lagord, Périgny ou Puilboreau. Deux groupes distincts ; l&#x27;écart décrit des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
<style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap");</style>
<rect width="600" height="362" fill="#ffffff"/>
<line x1="24.0" y1="270.0" x2="24.0" y2="278.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="24.0" y="294.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">0 %</text>
<line x1="144.5" y1="270.0" x2="144.5" y2="278.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="144.5" y="294.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">25 %</text>
<line x1="265.0" y1="270.0" x2="265.0" y2="278.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="265.0" y="294.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">50 %</text>
<line x1="385.5" y1="270.0" x2="385.5" y2="278.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="385.5" y="294.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">75 %</text>
<line x1="506.0" y1="270.0" x2="506.0" y2="278.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="506.0" y="294.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">100 %</text>
<text x="24.0" y="40.0" font-size="22" font-weight="700" fill="#1a1d28" text-anchor="start">Habiter La Rochelle, travailler ici ou dans</text>
<text x="24.0" y="67.0" font-size="22" font-weight="700" fill="#1a1d28" text-anchor="start">une commune voisine</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#3d4456" text-anchor="start">Part utilisant principalement la voiture pour aller travailler, parmi</text>
<text x="24.0" y="109.0" font-size="14" font-weight="400" fill="#3d4456" text-anchor="start">les actifs résidant à La Rochelle, en 2022.</text>
<text x="24.0" y="150.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à La Rochelle</text>
<rect x="24" y="160.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="160.0" x2="144.5" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="160.0" x2="265.0" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="160.0" x2="385.5" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="160.0" x2="506.0" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="160.0" width="212.6" height="30" rx="4" fill="#1c5cab"><title>Travaille à La Rochelle : 44.1 %</title></rect>
<text x="246.6" y="181.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">44 %</text>
<text x="24.0" y="228.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à Aytré, Lagord, Périgny ou Puilboreau</text>
<rect x="24" y="238.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="238.0" x2="144.5" y2="268.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="238.0" x2="265.0" y2="268.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="238.0" x2="385.5" y2="268.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="238.0" x2="506.0" y2="268.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="238.0" width="348.5" height="30" rx="4" fill="#1c5cab"><title>Travaille à Aytré, Lagord, Périgny ou Puilboreau : 72.3 %</title></rect>
<text x="382.5" y="259.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">72 %</text>
<text x="24.0" y="322.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">Deux groupes distincts de résidents ; l&#x27;écart décrit des pratiques. Source : INSEE,</text>
<text x="24.0" y="339.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">recensement 2022.</text>
</svg>
