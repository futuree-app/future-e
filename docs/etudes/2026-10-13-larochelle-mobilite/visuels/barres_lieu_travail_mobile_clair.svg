<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter La Rochelle, travailler ici ou dans une commune voisine</title>
<desc id="d">Graphique en deux barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à La Rochelle, 44 % de ceux qui travaillent à La Rochelle vont travailler principalement en voiture, contre 72 % de ceux qui travaillent à Aytré, Lagord, Périgny ou Puilboreau. Deux groupes distincts ; l&#x27;écart décrit des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
<style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap");</style>
<rect width="640" height="590" fill="#ffffff"/>
<line x1="24.0" y1="434.8" x2="24.0" y2="442.8" stroke="#d9d6cf" stroke-width="1"/>
<text x="24.0" y="468.7" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">0 %</text>
<line x1="146.6" y1="434.8" x2="146.6" y2="442.8" stroke="#d9d6cf" stroke-width="1"/>
<text x="146.6" y="468.7" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">25 %</text>
<line x1="269.2" y1="434.8" x2="269.2" y2="442.8" stroke="#d9d6cf" stroke-width="1"/>
<text x="269.2" y="468.7" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">50 %</text>
<line x1="391.9" y1="434.8" x2="391.9" y2="442.8" stroke="#d9d6cf" stroke-width="1"/>
<text x="391.9" y="468.7" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">75 %</text>
<line x1="514.5" y1="434.8" x2="514.5" y2="442.8" stroke="#d9d6cf" stroke-width="1"/>
<text x="514.5" y="468.7" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">100 %</text>
<text x="24.0" y="58.0" font-size="32" font-weight="700" fill="#1a1d28" text-anchor="start">Habiter La Rochelle, travailler</text>
<text x="24.0" y="97.2" font-size="32" font-weight="700" fill="#1a1d28" text-anchor="start">ici ou dans une commune voisine</text>
<text x="24.0" y="132.3" font-size="20" font-weight="400" fill="#3d4456" text-anchor="start">Part utilisant principalement la voiture pour aller</text>
<text x="24.0" y="159.9" font-size="20" font-weight="400" fill="#3d4456" text-anchor="start">travailler, parmi les actifs résidant à La Rochelle.</text>
<text x="24.0" y="219.3" font-size="22" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à La Rochelle</text>
<rect x="24" y="250.9" width="490.5" height="44" rx="4" fill="#eef1f6"/>
<line x1="146.6" y1="250.9" x2="146.6" y2="294.9" stroke="#d9d6cf" stroke-width="1"/>
<line x1="269.2" y1="250.9" x2="269.2" y2="294.9" stroke="#d9d6cf" stroke-width="1"/>
<line x1="391.9" y1="250.9" x2="391.9" y2="294.9" stroke="#d9d6cf" stroke-width="1"/>
<line x1="514.5" y1="250.9" x2="514.5" y2="294.9" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="250.9" width="216.3" height="44" rx="4" fill="#1c5cab"><title>Travaille à La Rochelle : 44.1 %</title></rect>
<text x="250.3" y="282.5" font-size="29" font-weight="700" fill="#1a1d28" text-anchor="start">44 %</text>
<text x="24.0" y="329.7" font-size="22" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à Aytré, Lagord, Périgny ou</text>
<text x="24.0" y="357.2" font-size="22" font-weight="600" fill="#1a1d28" text-anchor="start">Puilboreau</text>
<rect x="24" y="388.8" width="490.5" height="44" rx="4" fill="#eef1f6"/>
<line x1="146.6" y1="388.8" x2="146.6" y2="432.8" stroke="#d9d6cf" stroke-width="1"/>
<line x1="269.2" y1="388.8" x2="269.2" y2="432.8" stroke="#d9d6cf" stroke-width="1"/>
<line x1="391.9" y1="388.8" x2="391.9" y2="432.8" stroke="#d9d6cf" stroke-width="1"/>
<line x1="514.5" y1="388.8" x2="514.5" y2="432.8" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="388.8" width="354.6" height="44" rx="4" fill="#1c5cab"><title>Travaille à Aytré, Lagord, Périgny ou Puilboreau : 72.3 %</title></rect>
<text x="388.6" y="420.4" font-size="29" font-weight="700" fill="#1a1d28" text-anchor="start">72 %</text>
<text x="24.0" y="509.3" font-size="18" font-weight="400" fill="#5b6373" text-anchor="start">Deux groupes distincts de résidents. Cet écart décrit des</text>
<text x="24.0" y="533.9" font-size="18" font-weight="400" fill="#5b6373" text-anchor="start">pratiques ; il ne mesure pas l&#x27;effet causal du lieu de</text>
<text x="24.0" y="558.6" font-size="18" font-weight="400" fill="#5b6373" text-anchor="start">travail. Source : INSEE, recensement 2022.</text>
</svg>
