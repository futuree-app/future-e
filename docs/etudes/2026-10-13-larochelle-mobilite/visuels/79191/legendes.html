<figure class="fig-carte">
  <picture>
    <source media="(max-width: 640px)" srcset="carte_iris_79191_mobile_sombre.png">
    <img src="carte_iris_79191_sombre.png" width="1000"
         alt="Carte de Niort découpée en 22 secteurs statistiques (IRIS) d'habitat, colorés selon la part des actifs qui vont travailler principalement en voiture en 2022 (cinq classes de bleu, de 45 à 95 %). La part la plus basse est d'environ 49 % (Centre), la plus élevée d'environ 87 % (Surimeau-Antes Cholette). 4 secteurs d'activité exclus. Source : INSEE, recensement 2022.">
  </picture>
  <figcaption>
    Noms de secteurs de l'INSEE, qui ne sont pas toujours ceux des quartiers. Estimations par sondage&nbsp;: les petits
    écarts entre secteurs ne doivent pas être surinterprétés.
  </figcaption>
</figure>

<figure class="fig-barres">
  <picture>
    <source media="(max-width: 640px)" srcset="barres_lieu_travail_79191_mobile_sombre.png">
    <img src="barres_lieu_travail_79191_sombre.png" width="600"
         alt="Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Niort, part qui va travailler principalement en voiture : travaillant à Niort, 65 % ; travaillant à Chauray, Aiffres ou Bessines, 85 % ; travaillant ailleurs (hors de Niort, Chauray, Aiffres et Bessines), 87 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.">
  </picture>
  <figcaption>
    Actifs occupés de 15&nbsp;ans ou plus. Source&nbsp;: INSEE, recensement de la population 2022, fichier détail des
    mobilités professionnelles.
  </figcaption>
</figure>
