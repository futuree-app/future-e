<!-- Légendes HTML des visuels de l'article mobilité La Rochelle (v3).
     La carte des secteurs illustre la section des quartiers. Le graphique 44 % / 72 % et la carte de situation des
     communes forment un seul bloc : côte à côte sur grand écran, l'un sous l'autre sur mobile (cf. README).
     Le choix du fichier clair ou sombre suit le thème du site. -->

<figure class="fig-carte">
  <picture>
    <source media="(max-width: 640px)" srcset="carte_iris_17300_mobile_sombre.png">
    <img src="carte_iris_17300_sombre.png" width="1000"
         alt="Carte de La Rochelle découpée en 30 secteurs statistiques (IRIS) d'habitat, colorés selon la part des actifs qui vont travailler principalement en voiture en 2022 (cinq classes de bleu, de 25 à 75 %). Les secteurs du centre ont les parts les plus basses (environ 27 % pour Centre Préfecture) ; les plus élevées dépassent 65 % (jusqu'à environ 71 % pour Villeneuve des Salines Ouest). Un secteur d'activité est exclu. Source : INSEE, recensement 2022.">
  </picture>
  <figcaption>
    Noms de secteurs de l'INSEE, qui ne sont pas toujours ceux des quartiers. Estimations par sondage&nbsp;: les petits
    écarts entre secteurs ne doivent pas être surinterprétés.
  </figcaption>
</figure>

<div class="bloc-communes">
  <figure class="fig-barres">
    <picture>
      <source media="(max-width: 640px)" srcset="barres_lieu_travail_mobile_sombre.png">
      <img src="barres_lieu_travail_sombre.png" width="600"
           alt="Graphique en deux barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à La Rochelle en 2022, 44 % de ceux qui travaillent à La Rochelle vont travailler principalement en voiture, contre 72 % de ceux qui travaillent à Aytré, Lagord, Périgny ou Puilboreau. Deux groupes distincts de résidents. Source : INSEE, recensement 2022.">
    </picture>
  </figure>
  <figure class="fig-communes">
    <picture>
      <source media="(max-width: 640px)" srcset="carte_communes_17300_mobile_sombre.png">
      <img src="carte_communes_17300_sombre.png" width="300"
           alt="Carte de situation : La Rochelle et les communes limitrophes Aytré, Lagord, Périgny et Puilboreau, nommées sur leurs contours. Aucune donnée n'y est représentée. Contours IGN.">
    </picture>
  </figure>
  <p class="legende-bloc">
    Actifs occupés de 15&nbsp;ans ou plus. Source&nbsp;: INSEE, recensement de la population 2022, fichier détail des
    mobilités professionnelles.
  </p>
</div>
