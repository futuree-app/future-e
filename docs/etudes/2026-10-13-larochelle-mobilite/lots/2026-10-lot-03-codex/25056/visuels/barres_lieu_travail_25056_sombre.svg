<text x="416.7" y="348.6" font-size="20" font-weight="700" fill="#f6f4ef" text-anchor="start">79 %</text>
<text x="24.0" y="411.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="start">Groupes distincts de résidents ; les écarts décrivent des pratiques. Source : INSEE,</text>
<text x="24.0" y="428.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="start">recensement 2022.</text>
