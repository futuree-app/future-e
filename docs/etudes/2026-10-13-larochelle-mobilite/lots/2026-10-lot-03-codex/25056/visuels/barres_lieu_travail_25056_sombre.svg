<text x="24.0" y="383.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">0 %</text>
<line x1="144.5" y1="359.0" x2="144.5" y2="367.0" stroke="#2a3246" stroke-width="1"/>
<text x="144.5" y="383.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">25 %</text>
<line x1="265.0" y1="359.0" x2="265.0" y2="367.0" stroke="#2a3246" stroke-width="1"/>
<text x="265.0" y="383.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">50 %</text>
<line x1="385.5" y1="359.0" x2="385.5" y2="367.0" stroke="#2a3246" stroke-width="1"/>
<text x="385.5" y="383.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">75 %</text>
<line x1="506.0" y1="359.0" x2="506.0" y2="367.0" stroke="#2a3246" stroke-width="1"/>
<text x="506.0" y="383.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">100 %</text>
<text x="24.0" y="40.0" font-size="22" font-weight="700" fill="#f6f4ef" text-anchor="start">Habiter Besançon, travailler ici ou ailleurs</text>
<text x="24.0" y="63.0" font-size="14" font-weight="400" fill="#c6cfdb" text-anchor="start">Part utilisant principalement la voiture pour aller travailler, parmi</text>
<text x="24.0" y="82.0" font-size="14" font-weight="400" fill="#c6cfdb" text-anchor="start">les actifs résidant à Besançon, en 2022.</text>
<text x="24.0" y="123.0" font-size="15" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Besançon</text>
