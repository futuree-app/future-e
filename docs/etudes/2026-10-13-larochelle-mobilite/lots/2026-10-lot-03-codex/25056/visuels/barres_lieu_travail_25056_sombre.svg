<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 451" width="600" height="451" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Besançon, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Besançon, part qui va travailler principalement en voiture : travaillant à Besançon, 49 % ; travaillant à Thise, École-Valentin, Miserey-Salines, Avanne-Aveney, Pirey ou Châtillon-le-Duc, 83 % ; travaillant ailleurs (hors de Besançon, Thise, École-Valentin, Miserey-Salines, Avanne-Aveney, Pirey et Châtillon-le-Duc), 79 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
<style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap");</style>
<rect width="600" height="451" fill="#0d1322"/>
