<text x="24.0" y="159.9" font-size="20" font-weight="400" fill="#c6cfdb" text-anchor="start">travailler, parmi les actifs résidant à Besançon, en</text>
<text x="24.0" y="187.4" font-size="20" font-weight="400" fill="#c6cfdb" text-anchor="start">2022.</text>
<text x="24.0" y="246.9" font-size="22" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Besançon</text>
