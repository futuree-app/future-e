<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 451" width="600" height="451" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Brest, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Brest, part qui va travailler principalement en voiture : travaillant à Brest, 56 % ; travaillant à Guipavas, Plouzané, Plougastel-Daoulas, Le Relecq-Kerhuon, Gouesnou ou Bohars, 80 % ; travaillant ailleurs (hors de Brest, Guipavas, Plouzané, Plougastel-Daoulas, Le Relecq-Kerhuon, Gouesnou et Bohars), 80 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
