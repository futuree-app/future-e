<title id="t">Aller travailler en voiture, secteur par secteur</title>
<desc id="d">Carte de Levallois-Perret découpée en 24 secteurs statistiques (IRIS) d&#x27;habitat, colorés selon la part des actifs qui vont travailler principalement en voiture en 2022 (cinq classes de bleu, de 10 à 60 %). La part la plus basse est d&#x27;environ 14 % (Eiffel 3), la plus élevée d&#x27;environ 42 % (Villiers-Cerdan). Source : INSEE, recensement 2022.</desc>
