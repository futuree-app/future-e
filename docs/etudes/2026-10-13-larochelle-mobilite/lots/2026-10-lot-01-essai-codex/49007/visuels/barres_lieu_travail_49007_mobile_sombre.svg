<line x1="514.5" y1="626.3" x2="514.5" y2="670.3" stroke="#2a3246" stroke-width="1"/>
<rect x="24" y="626.3" width="360.0" height="44" rx="4" fill="#5598e7"><title>Travaille ailleurs (hors de Angers, Trélazé, Avrillé, Les Ponts-de-Cé, Saint-Barthélemy-d&#x27;Anjou, Verrières-en-Anjou et Bouchemaine) : 73.4 %</title></rect>
