<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1308" width="640" height="1308" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Aller travailler en voiture, secteur par secteur</title>
<desc id="d">Carte de Clichy découpée en 22 secteurs statistiques (IRIS) d&#x27;habitat, colorés selon la part des actifs qui vont travailler principalement en voiture en 2022 (cinq classes de bleu, de 5 à 55 %). La part la plus basse est d&#x27;environ 8 % (Maison du Peuple), la plus élevée d&#x27;environ 24 % (Bateliers). Source : INSEE, recensement 2022.</desc>
