<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 478" width="600" height="478" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Saint-Nazaire, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Saint-Nazaire, part qui va travailler principalement en voiture : travaillant à Saint-Nazaire, 64 % ; travaillant à La Baule-Escoublac, Guérande, Saint-Brevin-les-Pins, Pornichet, Donges ou Trignac, 89 % ; travaillant ailleurs (hors de Saint-Nazaire, La Baule-Escoublac, Guérande, Saint-Brevin-les-Pins, Pornichet, Donges et Trignac), 85 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
