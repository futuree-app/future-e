<rect x="24" y="289.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="289.0" x2="144.5" y2="319.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="289.0" x2="265.0" y2="319.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="289.0" x2="385.5" y2="319.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="289.0" x2="506.0" y2="319.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="289.0" width="403.0" height="30" rx="4" fill="#1c5cab"><title>Travaille ailleurs (hors de Vannes, Saint-Avé, Séné et Plescop) : 83.6 %</title></rect>
<text x="437.0" y="310.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">84 %</text>
<text x="24.0" y="373.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">Groupes distincts de résidents ; les écarts décrivent des pratiques. Source : INSEE,</text>
<text x="24.0" y="390.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">recensement 2022.</text>
</svg>
