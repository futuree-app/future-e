<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 692" width="640" height="692" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Vannes, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Vannes, part qui va travailler principalement en voiture : travaillant à Vannes, 59 % ; travaillant à Saint-Avé, Séné ou Plescop, 85 % ; travaillant ailleurs (hors de Vannes, Saint-Avé, Séné et Plescop), 84 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
<style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap");</style>
<rect width="640" height="692" fill="#0d1322"/>
<line x1="24.0" y1="562.1" x2="24.0" y2="570.1" stroke="#2a3246" stroke-width="1"/>
<text x="24.0" y="596.0" font-size="17" font-weight="400" fill="#9ba3b4" text-anchor="middle">0 %</text>
<line x1="146.6" y1="562.1" x2="146.6" y2="570.1" stroke="#2a3246" stroke-width="1"/>
<text x="146.6" y="596.0" font-size="17" font-weight="400" fill="#9ba3b4" text-anchor="middle">25 %</text>
<line x1="269.2" y1="562.1" x2="269.2" y2="570.1" stroke="#2a3246" stroke-width="1"/>
<text x="269.2" y="596.0" font-size="17" font-weight="400" fill="#9ba3b4" text-anchor="middle">50 %</text>
<line x1="391.9" y1="562.1" x2="391.9" y2="570.1" stroke="#2a3246" stroke-width="1"/>
<text x="391.9" y="596.0" font-size="17" font-weight="400" fill="#9ba3b4" text-anchor="middle">75 %</text>
<line x1="514.5" y1="562.1" x2="514.5" y2="570.1" stroke="#2a3246" stroke-width="1"/>
<text x="514.5" y="596.0" font-size="17" font-weight="400" fill="#9ba3b4" text-anchor="middle">100 %</text>
<text x="24.0" y="58.0" font-size="32" font-weight="700" fill="#f6f4ef" text-anchor="start">Habiter Vannes, travailler ici ou</text>
<text x="24.0" y="97.2" font-size="32" font-weight="700" fill="#f6f4ef" text-anchor="start">ailleurs</text>
<text x="24.0" y="132.3" font-size="20" font-weight="400" fill="#c6cfdb" text-anchor="start">Part utilisant principalement la voiture pour aller</text>
<text x="24.0" y="159.9" font-size="20" font-weight="400" fill="#c6cfdb" text-anchor="start">travailler, parmi les actifs résidant à Vannes, en</text>
<text x="24.0" y="187.4" font-size="20" font-weight="400" fill="#c6cfdb" text-anchor="start">2022.</text>
<text x="24.0" y="246.9" font-size="22" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Vannes</text>
<rect x="24" y="261.4" width="490.5" height="44" rx="4" fill="#1a2236"/>
<line x1="146.6" y1="261.4" x2="146.6" y2="305.4" stroke="#2a3246" stroke-width="1"/>
<line x1="269.2" y1="261.4" x2="269.2" y2="305.4" stroke="#2a3246" stroke-width="1"/>
<line x1="391.9" y1="261.4" x2="391.9" y2="305.4" stroke="#2a3246" stroke-width="1"/>
<line x1="514.5" y1="261.4" x2="514.5" y2="305.4" stroke="#2a3246" stroke-width="1"/>
<rect x="24" y="261.4" width="287.4" height="44" rx="4" fill="#5598e7"><title>Travaille à Vannes : 58.6 %</title></rect>
<text x="321.4" y="293.0" font-size="29" font-weight="700" fill="#f6f4ef" text-anchor="start">59 %</text>
<text x="24.0" y="360.5" font-size="22" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Saint-Avé, Séné ou Plescop</text>
<rect x="24" y="375.0" width="490.5" height="44" rx="4" fill="#1a2236"/>
<line x1="146.6" y1="375.0" x2="146.6" y2="419.0" stroke="#2a3246" stroke-width="1"/>
<line x1="269.2" y1="375.0" x2="269.2" y2="419.0" stroke="#2a3246" stroke-width="1"/>
<line x1="391.9" y1="375.0" x2="391.9" y2="419.0" stroke="#2a3246" stroke-width="1"/>
<line x1="514.5" y1="375.0" x2="514.5" y2="419.0" stroke="#2a3246" stroke-width="1"/>
<rect x="24" y="375.0" width="417.4" height="44" rx="4" fill="#5598e7"><title>Travaille à Saint-Avé, Séné ou Plescop : 85.1 %</title></rect>
<text x="451.4" y="406.6" font-size="29" font-weight="700" fill="#f6f4ef" text-anchor="start">85 %</text>
<text x="24.0" y="474.1" font-size="22" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille ailleurs (hors de Vannes,</text>
<text x="24.0" y="501.6" font-size="22" font-weight="600" fill="#f6f4ef" text-anchor="start">Saint-Avé, Séné et Plescop)</text>
<rect x="24" y="516.1" width="490.5" height="44" rx="4" fill="#1a2236"/>
<line x1="146.6" y1="516.1" x2="146.6" y2="560.1" stroke="#2a3246" stroke-width="1"/>
<line x1="269.2" y1="516.1" x2="269.2" y2="560.1" stroke="#2a3246" stroke-width="1"/>
<line x1="391.9" y1="516.1" x2="391.9" y2="560.1" stroke="#2a3246" stroke-width="1"/>
<line x1="514.5" y1="516.1" x2="514.5" y2="560.1" stroke="#2a3246" stroke-width="1"/>
<rect x="24" y="516.1" width="410.1" height="44" rx="4" fill="#5598e7"><title>Travaille ailleurs (hors de Vannes, Saint-Avé, Séné et Plescop) : 83.6 %</title></rect>
<text x="444.1" y="547.8" font-size="29" font-weight="700" fill="#f6f4ef" text-anchor="start">84 %</text>
<text x="24.0" y="636.6" font-size="18" font-weight="400" fill="#9ba3b4" text-anchor="start">Groupes distincts de résidents ; les écarts décrivent des</text>
<text x="24.0" y="661.3" font-size="18" font-weight="400" fill="#9ba3b4" text-anchor="start">pratiques. Source : INSEE, recensement 2022.</text>
</svg>
