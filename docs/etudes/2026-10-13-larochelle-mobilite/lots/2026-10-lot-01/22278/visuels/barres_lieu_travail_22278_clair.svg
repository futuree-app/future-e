<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 478" width="600" height="478" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Saint-Brieuc, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Saint-Brieuc, part qui va travailler principalement en voiture : travaillant à Saint-Brieuc, 56 % ; travaillant à Plérin, Ploufragan, Trégueux, Langueux, Yffiniac ou Trémuson, 81 % ; travaillant ailleurs (hors de Saint-Brieuc, Plérin, Ploufragan, Trégueux, Langueux, Yffiniac et Trémuson), 82 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
<style>@import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap");</style>
<rect width="600" height="478" fill="#ffffff"/>
<line x1="24.0" y1="386.0" x2="24.0" y2="394.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="24.0" y="410.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">0 %</text>
<line x1="144.5" y1="386.0" x2="144.5" y2="394.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="144.5" y="410.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">25 %</text>
<line x1="265.0" y1="386.0" x2="265.0" y2="394.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="265.0" y="410.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">50 %</text>
<line x1="385.5" y1="386.0" x2="385.5" y2="394.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="385.5" y="410.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">75 %</text>
<line x1="506.0" y1="386.0" x2="506.0" y2="394.0" stroke="#d9d6cf" stroke-width="1"/>
<text x="506.0" y="410.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="middle">100 %</text>
<text x="24.0" y="40.0" font-size="22" font-weight="700" fill="#1a1d28" text-anchor="start">Habiter Saint-Brieuc, travailler ici ou</text>
<text x="24.0" y="67.0" font-size="22" font-weight="700" fill="#1a1d28" text-anchor="start">ailleurs</text>
<text x="24.0" y="90.0" font-size="14" font-weight="400" fill="#3d4456" text-anchor="start">Part utilisant principalement la voiture pour aller travailler, parmi</text>
<text x="24.0" y="109.0" font-size="14" font-weight="400" fill="#3d4456" text-anchor="start">les actifs résidant à Saint-Brieuc, en 2022.</text>
<text x="24.0" y="150.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à Saint-Brieuc</text>
<rect x="24" y="160.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="160.0" x2="144.5" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="160.0" x2="265.0" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="160.0" x2="385.5" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="160.0" x2="506.0" y2="190.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="160.0" width="268.5" height="30" rx="4" fill="#1c5cab"><title>Travaille à Saint-Brieuc : 55.7 %</title></rect>
<text x="302.5" y="181.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">56 %</text>
<text x="24.0" y="228.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à Plérin, Ploufragan, Trégueux, Langueux, Yffiniac ou</text>
<text x="24.0" y="247.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Trémuson</text>
<rect x="24" y="257.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="257.0" x2="144.5" y2="287.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="257.0" x2="265.0" y2="287.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="257.0" x2="385.5" y2="287.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="257.0" x2="506.0" y2="287.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="257.0" width="388.0" height="30" rx="4" fill="#1c5cab"><title>Travaille à Plérin, Ploufragan, Trégueux, Langueux, Yffiniac ou Trémuson : 80.5 %</title></rect>
<text x="422.0" y="278.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">81 %</text>
<text x="24.0" y="325.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille ailleurs (hors de Saint-Brieuc, Plérin, Ploufragan,</text>
<text x="24.0" y="344.0" font-size="15" font-weight="600" fill="#1a1d28" text-anchor="start">Trégueux, Langueux, Yffiniac et Trémuson)</text>
<rect x="24" y="354.0" width="482.0" height="30" rx="4" fill="#eef1f6"/>
<line x1="144.5" y1="354.0" x2="144.5" y2="384.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="265.0" y1="354.0" x2="265.0" y2="384.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="385.5" y1="354.0" x2="385.5" y2="384.0" stroke="#d9d6cf" stroke-width="1"/>
<line x1="506.0" y1="354.0" x2="506.0" y2="384.0" stroke="#d9d6cf" stroke-width="1"/>
<rect x="24" y="354.0" width="395.2" height="30" rx="4" fill="#1c5cab"><title>Travaille ailleurs (hors de Saint-Brieuc, Plérin, Ploufragan, Trégueux, Langueux, Yffiniac et Trémuson) : 82.0 %</title></rect>
<text x="429.2" y="375.6" font-size="20" font-weight="700" fill="#1a1d28" text-anchor="start">82 %</text>
<text x="24.0" y="438.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">Groupes distincts de résidents ; les écarts décrivent des pratiques. Source : INSEE,</text>
<text x="24.0" y="455.0" font-size="12" font-weight="400" fill="#5b6373" text-anchor="start">recensement 2022.</text>
