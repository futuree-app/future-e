<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 747" width="640" height="747" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Saint-Brieuc, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Saint-Brieuc, part qui va travailler principalement en voiture : travaillant à Saint-Brieuc, 56 % ; travaillant à Plérin, Ploufragan, Trégueux, Langueux, Yffiniac ou Trémuson, 81 % ; travaillant ailleurs (hors de Saint-Brieuc, Plérin, Ploufragan, Trégueux, Langueux, Yffiniac et Trémuson), 82 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
