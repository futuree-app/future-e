<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Poitiers, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Poitiers, part qui va travailler principalement en voiture : travaillant à Poitiers, 54 % ; travaillant à Buxerolles, Jaunay-Marigny, Saint-Benoît, Vouneuil-sous-Biard, Migné-Auxances ou Chasseneuil-du-Poitou, 76 % ; travaillant ailleurs (hors de Poitiers, Buxerolles, Jaunay-Marigny, Saint-Benoît, Vouneuil-sous-Biard, Migné-Auxances et Chasseneuil-du-Poitou), 74 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
