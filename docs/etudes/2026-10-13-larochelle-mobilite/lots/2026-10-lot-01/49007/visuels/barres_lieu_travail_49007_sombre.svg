<text x="506.0" y="402.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">100 %</text>
<text x="24.0" y="40.0" font-size="22" font-weight="700" fill="#f6f4ef" text-anchor="start">Habiter Angers, travailler ici ou ailleurs</text>
