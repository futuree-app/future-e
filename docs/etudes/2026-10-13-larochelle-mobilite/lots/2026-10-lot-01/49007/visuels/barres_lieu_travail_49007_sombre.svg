<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Angers, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Angers, part qui va travailler principalement en voiture : travaillant à Angers, 44 % ; travaillant à Trélazé, Avrillé, Les Ponts-de-Cé, Saint-Barthélemy-d&#x27;Anjou, Verrières-en-Anjou ou Bouchemaine, 76 % ; travaillant ailleurs (hors de Angers, Trélazé, Avrillé, Les Ponts-de-Cé, Saint-Barthélemy-d&#x27;Anjou, Verrières-en-Anjou et Bouchemaine), 73 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
