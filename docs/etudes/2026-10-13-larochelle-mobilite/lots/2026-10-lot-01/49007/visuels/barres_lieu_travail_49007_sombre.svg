<rect x="24" y="346.0" width="353.8" height="30" rx="4" fill="#5598e7"><title>Travaille ailleurs (hors de Angers, Trélazé, Avrillé, Les Ponts-de-Cé, Saint-Barthélemy-d&#x27;Anjou, Verrières-en-Anjou et Bouchemaine) : 73.4 %</title></rect>
