<text x="24.0" y="82.0" font-size="14" font-weight="400" fill="#c6cfdb" text-anchor="start">les actifs résidant à Angers, en 2022.</text>
<text x="24.0" y="123.0" font-size="15" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Angers</text>
