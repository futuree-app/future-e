<rect x="24" y="365.0" width="326.8" height="30" rx="4" fill="#5598e7"><title>Travaille ailleurs (hors de Tours, Joué-lès-Tours, Saint-Cyr-sur-Loire, Saint-Pierre-des-Corps, Saint-Avertin, Amboise et Chambray-lès-Tours) : 67.8 %</title></rect>
