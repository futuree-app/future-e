<text x="506.0" y="421.0" font-size="12" font-weight="400" fill="#9ba3b4" text-anchor="middle">100 %</text>
<text x="24.0" y="40.0" font-size="22" font-weight="700" fill="#f6f4ef" text-anchor="start">Habiter Tours, travailler ici ou ailleurs</text>
<text x="24.0" y="63.0" font-size="14" font-weight="400" fill="#c6cfdb" text-anchor="start">Part utilisant principalement la voiture pour aller travailler, parmi</text>
<text x="24.0" y="82.0" font-size="14" font-weight="400" fill="#c6cfdb" text-anchor="start">les actifs résidant à Tours, en 2022.</text>
<text x="24.0" y="123.0" font-size="15" font-weight="600" fill="#f6f4ef" text-anchor="start">Travaille à Tours</text>
