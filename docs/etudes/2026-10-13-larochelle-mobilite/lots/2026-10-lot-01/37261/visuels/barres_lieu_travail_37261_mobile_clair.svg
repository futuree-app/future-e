<text x="391.9" y="706.2" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">75 %</text>
<line x1="514.5" y1="672.3" x2="514.5" y2="680.3" stroke="#d9d6cf" stroke-width="1"/>
<text x="514.5" y="706.2" font-size="17" font-weight="400" fill="#5b6373" text-anchor="middle">100 %</text>
<text x="24.0" y="58.0" font-size="32" font-weight="700" fill="#1a1d28" text-anchor="start">Habiter Tours, travailler ici ou</text>
<text x="24.0" y="97.2" font-size="32" font-weight="700" fill="#1a1d28" text-anchor="start">ailleurs</text>
<text x="24.0" y="132.3" font-size="20" font-weight="400" fill="#3d4456" text-anchor="start">Part utilisant principalement la voiture pour aller</text>
<text x="24.0" y="159.9" font-size="20" font-weight="400" fill="#3d4456" text-anchor="start">travailler, parmi les actifs résidant à Tours, en</text>
<text x="24.0" y="187.4" font-size="20" font-weight="400" fill="#3d4456" text-anchor="start">2022.</text>
<text x="24.0" y="246.9" font-size="22" font-weight="600" fill="#1a1d28" text-anchor="start">Travaille à Tours</text>
