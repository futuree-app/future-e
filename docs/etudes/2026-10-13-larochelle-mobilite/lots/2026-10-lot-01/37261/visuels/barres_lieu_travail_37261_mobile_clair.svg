<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 803" width="640" height="803" role="img" aria-labelledby="t d" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Habiter Tours, travailler ici ou ailleurs</title>
<desc id="d">Graphique en 3 barres sur une échelle de 0 à 100 %. Parmi les actifs résidant à Tours, part qui va travailler principalement en voiture : travaillant à Tours, 40 % ; travaillant à Joué-lès-Tours, Saint-Cyr-sur-Loire, Saint-Pierre-des-Corps, Saint-Avertin, Amboise ou Chambray-lès-Tours, 70 % ; travaillant ailleurs (hors de Tours, Joué-lès-Tours, Saint-Cyr-sur-Loire, Saint-Pierre-des-Corps, Saint-Avertin, Amboise et Chambray-lès-Tours), 68 %. Groupes distincts ; les écarts décrivent des pratiques, pas un effet causal. Source : INSEE, recensement 2022.</desc>
