<style>
/* ════════════════════════════════════════════════════════════════════════════════════════════
   FUT-41 / FUT-22 · V3, « LA PLANCHE » RESSERRÉE ET « FAIRE LE POINT ». Prototype de revue, données fictives.
   Jetons : ceux de design-tokens.css et de releve.module.css (fond, plaque, encre, six registres,
   mouvement FUT-75). Aucune couleur nouvelle. Les règles visuelles nouvelles sont listées comme
   propositions à soumettre à FUT-118 dans README-v3.md, jamais adoptées ici.
   ════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;
  --r-fond: #060812; --r-plaque: #0d1322; --r-plaque-bord: rgba(255,255,255,0.12);
  --r-encre: #f6f4ef; --r-texte: #c6cfdb; --r-discret: #9ba3b4; --r-meta: #788095;
  --r-filet: rgba(255,255,255,0.08); --r-filet-fort: rgba(255,255,255,0.14);
  --r-elev: rgba(255,255,255,0.04); --r-elev-2: rgba(255,255,255,0.07);
  --marque: #E8823A;
  --reg-incompatibilite: #FF9AA4; --reg-alignement: #7BD3A5; --reg-compromis: #E8823A;
  --reg-ecart: #C2A5EB; --reg-non-su: #B8BFCC; --reg-controle: #82B4E8;
  --f-sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --m-pression: 90ms; --m-geste: 120ms; --m-bascule: 180ms; --m-etat: 240ms;
  --m-releve: cubic-bezier(0.2, 0.7, 0.2, 1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --r-fond: #faf8f3; --r-plaque: #f2ede4; --r-plaque-bord: rgba(26,29,40,0.14);
    --r-encre: #1a1d28; --r-texte: #3d4456; --r-discret: #5b6373; --r-meta: #646c7f;
    --r-filet: rgba(26,29,40,0.09); --r-filet-fort: rgba(26,29,40,0.17);
    --r-elev: rgba(26,29,40,0.035); --r-elev-2: rgba(26,29,40,0.06);
    --marque: #994000;
    --reg-incompatibilite: #8F2E3A; --reg-alignement: #236844; --reg-compromis: #994000;
    --reg-ecart: #64428E; --reg-non-su: #505662; --reg-controle: #285B91;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --r-fond: #faf8f3; --r-plaque: #f2ede4; --r-plaque-bord: rgba(26,29,40,0.14);
  --r-encre: #1a1d28; --r-texte: #3d4456; --r-discret: #5b6373; --r-meta: #646c7f;
  --r-filet: rgba(26,29,40,0.09); --r-filet-fort: rgba(26,29,40,0.17);
  --r-elev: rgba(26,29,40,0.035); --r-elev-2: rgba(26,29,40,0.06);
  --marque: #994000;
  --reg-incompatibilite: #8F2E3A; --reg-alignement: #236844; --reg-compromis: #994000;
  --reg-ecart: #64428E; --reg-non-su: #505662; --reg-controle: #285B91;
}
@media (prefers-reduced-motion: reduce) {
  :root { --m-pression: 0ms; --m-geste: 0ms; --m-bascule: 0ms; --m-etat: 0ms; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--r-fond); color: var(--r-texte); font-family: var(--f-sans); font-size: 16px; line-height: 1.5; }
body.sheet-ouverte { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--r-encre); outline-offset: 2px; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; color: var(--r-encre); text-wrap: balance; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1240px; margin: 0 auto; padding: 0 16px 80px; }
@media (min-width: 640px) { .app { padding: 0 28px 96px; } }

/* ── Typographie du Relevé ─────────────────────────────────────────────────────────────── */
.surtitre { display: flex; align-items: baseline; gap: 10px; font-variation-settings: "wdth" 88; font-weight: 600; font-size: 13.5px; letter-spacing: 0.01em; color: var(--r-discret); }
.surtitre .num { font-family: var(--f-mono); font-variation-settings: normal; font-weight: 500; font-size: 11.5px; color: var(--r-meta); }
.etiquette { font-variation-settings: "wdth" 88; font-weight: 600; font-size: 12.5px; letter-spacing: 0.01em; color: var(--r-discret); }
.nuance { font-size: 13.5px; line-height: 1.5; color: var(--r-discret); }
.meta { font-family: var(--f-mono); font-size: 12px; color: var(--r-meta); }
.encre { color: var(--r-encre); }

/* ── Boutons ───────────────────────────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 3px; border: 1px solid var(--r-filet-fort); background: transparent; color: var(--r-encre); font-weight: 600; font-size: 14px; line-height: 1.25; text-align: left; transition: border-color var(--m-geste) ease, background-color var(--m-geste) ease, transform var(--m-pression) ease; }
.btn:hover { border-color: var(--r-encre); }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"] { background: var(--r-elev-2); border-color: var(--r-encre); }
.btn-plein { background: var(--r-encre); border-color: var(--r-encre); color: var(--r-fond); }
.btn-plein:hover { background: var(--r-texte); border-color: var(--r-texte); }
.btn-lien { border: 0; padding: 4px 0; min-height: 32px; background: none; color: var(--r-encre); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--r-filet-fort); font-weight: 600; font-size: 14px; text-align: left; }
.btn-lien:hover { text-decoration-color: var(--r-encre); }
.btn-lien.meta { font-weight: 400; font-size: 12px; color: var(--r-discret); }
.sim { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--r-meta); border: 1px dashed var(--r-filet-fort); border-radius: 2px; padding: 1px 5px; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 10px; }

/* ── Barre ─────────────────────────────────────────────────────────────────────────────── */
.barre { display: flex; align-items: center; gap: 18px; min-height: 60px; border-bottom: 1px solid var(--r-filet); }
.marque-mot { font-variation-settings: "wdth" 100; font-weight: 600; font-size: 21px; letter-spacing: -0.01em; color: var(--r-encre); }
.marque-mot b { color: var(--marque); font-weight: 600; }
.barre nav { display: flex; gap: 16px; }
.barre nav span { font-size: 14px; color: var(--r-discret); }
.barre nav span[aria-current] { color: var(--r-encre); font-weight: 600; box-shadow: inset 0 -2px 0 var(--r-encre); padding-bottom: 4px; }
.barre .droite { margin-left: auto; display: flex; align-items: center; gap: 8px; position: relative; }
.fictif { font-family: var(--f-mono); font-size: 11.5px; color: var(--r-discret); border: 1px dashed var(--r-filet-fort); border-radius: 3px; padding: 6px 9px; background: none; min-height: 36px; }
.fictif:hover { color: var(--r-encre); border-color: var(--r-discret); }
.icone-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--r-filet-fort); border-radius: 50%; background: none; color: var(--r-encre); }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--r-plaque); border: 1px solid var(--r-plaque-bord); border-radius: 3px; padding: 8px; display: grid; gap: 2px; box-shadow: 0 18px 40px rgba(0,0,0,0.28); }
.menu[hidden] { display: none; }
.menu p { padding: 6px 8px 8px; }
.menu button { text-align: left; background: none; border: 0; border-radius: 2px; padding: 9px 10px; display: grid; gap: 1px; }
.menu button:hover { background: var(--r-elev-2); }
.menu button[aria-current="true"] { background: var(--r-elev-2); box-shadow: inset 2px 0 0 var(--r-encre); }
.menu button b { font-weight: 600; font-size: 14.5px; color: var(--r-encre); }
.menu button span { font-size: 12.5px; color: var(--r-discret); }
@media (max-width: 639px) { .barre nav { display: none; } .fictif .long { display: none; } }
/* ── Panneau : une possibilité ─────────────────────────────────────────────────────────── */
.fiche { display: grid; gap: 20px; }
.fiche-tete { display: grid; gap: 6px; }
.fiche-tete h2 { font-variation-settings: "wdth" 108; font-weight: 600; font-size: clamp(22px, 2.2vw, 27px); line-height: 1.15; letter-spacing: -0.01em; }
.fiche-tete h2:focus { outline: none; }
.fiche-emb { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 16px; align-items: center; }
.fiche-emb > svg { width: 124px; height: 124px; overflow: visible; }
.fiche-emb .forme { cursor: pointer; }
.echelles-etat { display: grid; }
.echelles-etat button { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 1px 10px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px solid var(--r-filet); padding: 7px 6px; min-height: 44px; color: var(--r-encre); }
.echelles-etat button:first-child { border-top: 0; }
.echelles-etat button:hover { background: var(--r-elev); }
.echelles-etat button[aria-pressed="true"] { background: var(--r-elev-2); box-shadow: inset 2px 0 0 var(--r-encre); }
.echelles-etat b { font-size: 14px; font-weight: 600; }
.echelles-etat .e { grid-column: 2; font-size: 12.5px; color: var(--r-discret); }
.conds { display: grid; }
.cond { border-top: 1px solid var(--r-filet); }
.cond > button { width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 4px; min-height: 48px; }
.cond > button:hover { background: var(--r-elev); }
.cond .lab { font-size: 14.5px; color: var(--r-encre); line-height: 1.35; }
.cond .lab small { display: block; font-size: 11.5px; color: var(--r-meta); font-family: var(--f-mono); }
.cond .iss { font-size: 13px; text-align: right; justify-content: flex-end; color: var(--r-texte); }
.cond.actif > button { box-shadow: inset 2px 0 0 var(--r-encre); background: var(--r-elev); }
.cond .ouvert { padding: 4px 0 14px 32px; display: grid; gap: 10px; }
.contexte-ecart { padding: 0 0 14px; border-bottom: 1px solid var(--r-filet); display: grid; gap: 8px; }
.contexte-ecart.change { border-left-color: var(--reg-controle); }
.form-mini { display: grid; gap: 8px; padding: 12px; margin-top: 8px; border: 1px solid var(--r-filet-fort); border-radius: 3px; }
.form-mini textarea { width: 100%; min-height: 64px; background: var(--r-fond); border: 1px solid var(--r-filet-fort); border-radius: 3px; padding: 8px 10px; resize: vertical; }
.form-mini select { background: var(--r-fond); border: 1px solid var(--r-filet-fort); border-radius: 3px; padding: 8px 10px; min-height: 40px; }
.note-perso { display: grid; gap: 2px; padding: 6px 0 6px 12px; border-left: 2px solid var(--r-filet-fort); font-size: 14px; }

/* ── Preuve ────────────────────────────────────────────────────────────────────────────── */
.preuve { display: grid; gap: 3px; font-family: var(--f-mono); font-size: 12px; line-height: 1.5; color: var(--r-discret); border-left: 1px solid var(--r-filet-fort); padding-left: 12px; }
.preuve .v { color: var(--r-encre); font-family: var(--f-sans); font-size: 14.5px; line-height: 1.45; }
.preuve .ligne { display: flex; gap: 7px; align-items: center; }
.verif { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--r-filet-fort); border-radius: 3px; }
.verif p { font-size: 14px; color: var(--r-texte); }

/* ── Glyphes ───────────────────────────────────────────────────────────────────────────── */
.g { display: inline-block; vertical-align: -1px; flex: none; }
.reg-t { display: inline-flex; align-items: baseline; gap: 6px; }
.reg-t::before { content: ""; flex: none; width: 3px; height: 0.9em; transform: translateY(0.1em); background: var(--t, var(--r-meta)); }
.bande { margin-top: 24px; }
.bande-tete { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--r-filet-fort); color: var(--r-encre); }
.bande-tete b { font-variation-settings: "wdth" 108; font-size: 17px; font-weight: 600; }
.socle { display: grid; gap: 8px; padding: 14px 0 6px; }
.socle-trait { position: relative; height: 26px; }
.socle-trait::before { content: ""; position: absolute; left: 6%; right: 6%; top: 12px; height: 3px; background: var(--r-encre); }
.socle-trait span { position: absolute; top: 4px; width: 18px; height: 18px; border: 1.6px solid var(--r-encre); border-radius: 50%; background: var(--r-plaque); }
.piste { position: relative; height: 64px; width: 100%; background: none; border: 0; padding: 0; display: block; border-radius: 2px; }
.piste:hover { background: var(--r-elev); }
.piste .pl { position: absolute; top: 14px; height: 0; border-top: 1.5px solid var(--r-encre); }
.piste .pl.tirets { border-top: 1.5px dashed var(--r-discret); }
.piste .pl.points { border-top: 2px dotted var(--reg-controle); }
.piste .pl.fort { border-top-width: 3px; top: 13px; }
.piste .mk { position: absolute; top: 4px; width: 20px; height: 20px; margin-left: -10px; }
.piste .mk svg { display: block; overflow: visible; }
.piste .tx { position: absolute; top: 31px; font-size: 12.5px; line-height: 1.3; color: var(--r-texte); max-width: 42%; }
.piste .tx.ga { left: 0; text-align: left; }
.piste .tx.dr { right: 0; text-align: right; }
.piste .tx.ce { left: 50%; transform: translateX(-50%); text-align: center; max-width: 50%; color: var(--r-discret); }
.piste .coupure { position: absolute; top: 6px; left: 50%; width: 14px; height: 17px; margin-left: -7px; }
.piste .coupure::before, .piste .coupure::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--r-encre); transform: skewX(-20deg); }
.piste .coupure::before { left: 3px; } .piste .coupure::after { right: 3px; }
.preuves { display: grid; gap: 14px; padding: 8px 0 14px; }
@media (min-width: 640px) { .preuves { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.pourrait { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--r-filet-fort); display: grid; gap: 10px; }
.pourrait ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pourrait li { display: grid; gap: 4px; }
.vide-rapp { padding: 18px 0; color: var(--r-discret); font-size: 14.5px; }
.arrive { animation: arrive var(--m-bascule) var(--m-releve) both; }
@keyframes arrive { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
@media (prefers-reduced-motion: reduce) { .arrive { animation: none; } }
/* ── Condition par condition ───────────────────────────────────────────────────────────── */
.partition-zone { margin-top: 52px; }
.partition-wrap { overflow-x: auto; margin-top: 12px; }
.partition { display: grid; min-width: min-content; }
.partition .ligne-p { display: grid; align-items: center; border-bottom: 1px solid var(--r-filet); min-height: 46px; }
.partition .ligne-p.focus { background: var(--r-elev-2); }
.partition .tete-p { align-items: end; border-bottom: 1px solid var(--r-filet-fort); padding-bottom: 6px; }
.partition .tete-p span.v { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12.5px; color: var(--r-discret); max-height: 136px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; justify-self: center; }
.partition .lab-p { font-size: 14px; color: var(--r-encre); padding-right: 12px; }
.partition .cel { display: grid; place-items: center; width: 100%; height: 44px; background: none; border: 0; border-radius: 2px; }
.partition .cel:hover { background: var(--r-elev-2); }
/* ── Feuille mobile ────────────────────────────────────────────────────────────────────── */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--r-fond); overflow: auto; overscroll-behavior: contain; padding: 0 16px 56px; }
.sheet[hidden] { display: none; }
.sheet-barre { position: sticky; top: 0; z-index: 2; background: var(--r-fond); display: flex; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--r-filet); margin: 0 -16px 18px; padding: 0 16px; }
/* ── Note d'état ───────────────────────────────────────────────────────────────────────── */
.note { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; width: min(620px, calc(100vw - 24px)); background: var(--r-plaque); border: 1px solid var(--r-plaque-bord); border-radius: 3px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 14px 34px rgba(0,0,0,0.3); font-size: 14px; color: var(--r-texte); }
.note[hidden] { display: none; }
.note p { flex: 1; }

/* ── Le Projet, en une bande ───────────────────────────────────────────────────────────── */
.projet { padding: 18px 0 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--r-filet); }
.projet-l1 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.projet-phrase { font-variation-settings: "wdth" 108; font-weight: 600; font-size: clamp(22px, 2.3vw, 29px); line-height: 1.15; letter-spacing: -0.01em; }
.lentilles-l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.lentille { position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 5px 10px; border-radius: 3px; border: 1px solid var(--r-filet-fort); background: transparent; color: var(--r-texte); font-size: 13.5px; font-weight: 500; transition: background-color var(--m-geste) ease, color var(--m-geste) ease, border-color var(--m-geste) ease; }
.lentille:hover { border-color: var(--r-discret); color: var(--r-encre); }
.lentille[aria-pressed="true"] { background: var(--r-encre); color: var(--r-fond); border-color: var(--r-encre); }
.lentille .poids { display: inline-flex; gap: 2px; align-items: flex-end; height: 11px; }
.lentille .poids i { width: 3px; background: currentColor; }
.lentille .poids i.vide { opacity: 0.25; }
.lentille.sans { border-color: var(--r-discret); }
.lentille .verrou { width: 9px; height: 11px; border: 1.5px solid currentColor; border-radius: 1px; position: relative; }
.lentille .verrou::after { content: ""; position: absolute; left: 1.5px; right: 1.5px; top: 3px; height: 1.5px; background: currentColor; }
.lentille.cote > span:nth-child(2) { text-decoration: line-through; }
.projet-l1 .non-mesure { margin-left: auto; }
.non-mesure.m { display: none; }
.non-mesure { font-size: 12.5px; color: var(--r-discret); border: 1px dashed var(--r-filet-fort); border-radius: 3px; padding: 6px 9px; }
.lecture-lentille { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 0 2px; }
.lecture-lentille p { flex: 1 1 320px; font-size: 14px; }
.lecture-lentille .formes { display: inline-flex; gap: 5px; color: var(--r-encre); }
.revs { display: grid; border-top: 1px solid var(--r-filet); margin-top: 4px; }
.revs > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid var(--r-filet); font-size: 14px; }
@media (max-width: 639px) { .revs > div { grid-template-columns: 1fr; } }

/* ── Corps : la planche à gauche, la lecture à droite ──────────────────────────────────── */
.corps { display: grid; gap: 22px; padding-top: 20px; grid-template-areas: "lecture" "planche" "suite"; }
.planche { grid-area: planche; } .lecture { grid-area: lecture; } .suite { grid-area: suite; min-width: 0; }
.suite[hidden] { display: none; }
.suite-in { display: grid; gap: 16px; }
@media (min-width: 1024px) {
  .corps { grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); grid-template-areas: "planche lecture" "planche suite"; grid-template-rows: auto 1fr; gap: 20px 44px; align-items: start; }
  .planche { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding-right: 8px; scrollbar-width: thin; }
}
.lecture { min-width: 0; container-type: inline-size; }

/* ── La planche resserrée ──────────────────────────────────────────────────────────────── */
.planche-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; color: var(--r-discret); }
.legende > span { display: inline-flex; align-items: center; gap: 5px; }
.legende .g { color: var(--r-encre); }
.legende .sep { color: var(--r-meta); }
.filtres { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════════════════════════
// DONNÉES DE DÉMONSTRATION. Même forme que la V1 : une analyse = { échelle, révision du Projet,
// moteur, date, issues { critère → CriterionOutcome } }, plus une preuve fictive par issue.
// Aucune ne décrit un lieu réel.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const AUJ = "2026-10-20";
const REV = {
  r1: { id: "r1", n: 1, date: "2026-09-08", gare: 20 },
  r2: { id: "r2", n: 2, date: "2026-10-08", gare: 30, cause: "Après la visite du 4 octobre : « 25 minutes nous paraissent acceptables »." },
};
const REV_COURANTE = "r2";
const gareMax = () => REV[REV_COURANTE].gare;

const ECH = {
  territoire: { nom: "Territoire", grain: "la commune", forme: "cercle", lu: "à la commune" },
  autour: { nom: "Autour de l'adresse", grain: "le voisinage", forme: "carre", lu: "aux abords de l'adresse" },
  logement: { nom: "Logement", grain: "le bâtiment", forme: "losange", lu: "dans le logement" },
};
const CRITERES = [
  { cle: "mer", sans: true, ech: ["territoire"], lab: () => "la mer à moins de 15 km", court: () => "La mer à 15 km" },
  { cle: "soins", sans: true, ech: ["territoire"], lab: () => "un médecin disponible", court: () => "Un médecin disponible" },
  { cle: "gare", poids: 3, ech: ["territoire", "autour"], lab: () => `une gare à moins de ${gareMax()} min`, court: () => `Une gare à ${gareMax()} min` },
  { cle: "chaleur", poids: 2, ech: ["territoire", "logement"], lab: () => "des nuits fraîches l'été", court: () => "Des nuits fraîches" },
  { cle: "calme", poids: 2, ech: ["territoire", "autour"], lab: () => "le calme", court: () => "Le calme" },
  { cle: "vie", poids: 1, ech: ["territoire"], lab: () => "une vie de quartier", court: () => "Une vie de quartier" },
];
const CRIT = Object.fromEntries(CRITERES.map((c) => [c.cle, c]));

const SRC = {
  ign: "IGN, BD Carto · 2025", ameli: "Ameli, annuaire santé · 2025", sncf: "SNCF Réseau, OpenStreetMap · 2026",
  drias: "DRIAS, TRACC +2,7 °C · 2025", bruit: "Cerema, cartes de bruit · 2024", bpe: "INSEE BPE, RNA · 2024",
  dpe: "ADEME, DPE · 2025", osm: "OpenStreetMap · 2026",
};
// [issue, valeur observée, source]
const ANALYSES = {
  "t:port-anvel": { ech: "territoire", rev: "r2", moteur: "engine-4", date: "2026-10-09", i: {
    mer: ["favorable", "Littoral à 3 km du centre-bourg", SRC.ign],
    soins: ["to_confirm", "4 généralistes pour 5 200 habitants ; l'accueil de nouveaux patients n'est pas publié", SRC.ameli],
    gare: ["favorable", "Gare de référence à 12 min en voiture", SRC.sncf],
    chaleur: ["favorable", "Nuits tropicales : 2 par an (1976-2005), 7 à l'horizon 2050", SRC.drias],
    calme: ["reserve", "Une départementale à fort trafic traverse le bourg", SRC.bruit],
    vie: ["favorable", "Commerces et associations au-dessus de la médiane des communes de même taille", SRC.bpe] } },
  "t:saint-aurec": { ech: "territoire", rev: "r1", moteur: "engine-4", date: "2026-09-17", i: {
    mer: ["favorable", "Littoral à 9 km", SRC.ign],
    soins: ["to_confirm", "2 généralistes pour 3 100 habitants ; l'accueil de nouveaux patients n'est pas publié", SRC.ameli],
    gare: ["mismatch", "Gare de référence à 24 min, au-delà de 20 min (révision 1)", SRC.sncf],

const S = {

// Une possibilité, avec son état éventuellement modifié dans la session (écartée, reprise).

// L'analyse telle qu'on la lit : figée, ou « mise au même cadre » (simulation, analyses en jeu seulement).

// Ce qu'on sait d'une possibilité, pour un critère, à une échelle.

//         | piste (rien n'est lu) | non_lu (aperçu muet sur ce point)

// ═══════════════════════════════════════════════════════════════════════════════════════════
// GLYPHES. La forme dit l'échelle (cercle, carré, losange) ; le trait dit le registre ; le
// remplissage dit qu'une réponse est établie. Une absence est dessinée en pointillé, jamais vide.
// ═══════════════════════════════════════════════════════════════════════════════════════════

  if (f === "carre") return `<rect x="${m}" y="${m}" width="${t - 2 * m}" height="${t - 2 * m}" rx="${t / 9}" ${attrs}/>`;
  const s = t * 0.66;

}

}
// Une marque d'issue : forme de l'échelle, teinte du registre.
function marque(r, ech, taille = 18) {

  else if (r.issue === "to_confirm") attrs = `fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="3 2.4"`;
  else if (r.issue === "indeterminate") attrs = `fill="none" stroke="${col}" stroke-width="1.6"`;
  else attrs = `fill="none" stroke="var(--r-meta)" stroke-width="1.3" stroke-dasharray="2.4 3"`;

  return `<svg class="g" width="${taille}" height="${taille}" viewBox="0 0 ${taille} ${taille}" aria-hidden="true">${forme(ECH[ech].forme, taille, attrs)}${bloq}</svg>`;
}

// L'emblème d'une possibilité seule (panneau, pôles du rapprochement) : trois formes emboîtées,
// pleines quand l'échelle est examinée, pointillées sinon.

    return `${base} vector-effect="non-scaling-stroke"`;

// ═══════════════════════════════════════════════════════════════════════════════════════════
// LE RAPPROCHEMENT : LA RÈGLE. Pour une condition et une échelle, deux lectures donnent une
// classe. Déterministe, sans total, sans tri des lieux.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const NON_EXAMINE = new Set(["piste", "sans_adresse", "adresse_non_examinee", "commune_seule", "non_lu"]);

// ═══════════════════════════════════════════════════════════════════════════════════════════
// MAINTENANT. Les prochaines actions naissent de l'état de la recherche, chacune avec sa raison.

    g.push({ k: "libre-" + p.id, t: "non-su", titre: `${p.nom} n'est lue que par l'aperçu gratuit.`, pourquoi: "Trois constats, aucun départage : elle n'est comparée sur rien tant qu'elle n'est pas examinée.", actions: [["Voir l'aperçu", "sel-seul", p.id]] });

  if (acts.length === 1) g.push({ k: "seule", t: "non-su", titre: "Une seule possibilité : rien à départager encore.", pourquoi: "Ajoutez une commune ou un bien pour voir ce qui les sépare, et ce qu'ils partagent.", actions: [["Ajouter une possibilité", "ajout", ""]] });
  return g;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// LA PLANCHE RESSERRÉE. Une ligne par possibilité, rangée sous sa commune. L'emblème est petit
// et toujours le même : le cercle dit la commune, le carré les abords, le losange le logement ;
// plein si l'échelle est lue, pointillé sinon. La grande composition ne revient que dans la
// fiche d'un lieu, là où l'on manipule ses échelles.
// ═══════════════════════════════════════════════════════════════════════════════════════════
// Une condition sans compromis non tenue se voit sur la planche, lentille ou non : rien ne la compense.
const bloquants = (p) => CRITERES.filter((c) => c.sans).filter((c) => { const r = lire(p, c.cle, "territoire"); return r.issue === "incompatible" && !r.libre; });
const horsCadreP = (p) => versionsDe(p).some((v) => v.rev !== REV_COURANTE);
// Sous une lentille, une analyse d'une autre version du Projet ne prend aucune teinte : posée à côté
// des autres, elle se lirait comme un avantage ou un défaut actuel.
function regPlanche(p, crit, ech) {
  const r = lire(p, crit, ech);
  if (r.a && r.a.rev !== REV_COURANTE) return "horscadre";
  return regVar(r);
}
function mini(p, t = 34) {
  const com = COMMUNES[p.commune];
  const terr = com.analyse ? "plein" : com.libre ? "points" : "pointille";
  const adr = p.type === "bien" && p.adr ? "plein" : "pointille";
  const c = t / 2;
  const at = (etat, ech) => `class="tr ${etat}" data-ech="${ech}" data-pid-trait="${p.id}"`;
  let s = `<circle ${at(terr, "territoire")} cx="${c}" cy="${c}" r="${c - 1.5}"/>`;
  if (p.type === "bien") {
    const q = t * 0.5, d = t * 0.24;
    s += `<rect ${at(adr, "autour")} x="${c - q / 2}" y="${c - q / 2}" width="${q}" height="${q}" rx="1.5"/>`;
    s += `<rect ${at(adr, "logement")} x="${c - d / 2}" y="${c - d / 2}" width="${d}" height="${d}" rx="1" transform="rotate(45 ${c} ${c})"/>`;
    if (p.sansAdresse) s += `<text class="q" x="${c}" y="${c + 3.5}" text-anchor="middle">?</text>`;
  } else s += `<circle cx="${c}" cy="${c}" r="1.6" class="pt"/>`;
  if (bloquants(p).length) s += `<line class="barre-bloq" x1="${t * 0.18}" y1="${t * 0.82}" x2="${t * 0.82}" y2="${t * 0.18}"/>`;
  return `<svg class="mini" width="${t}" height="${t}" viewBox="0 0 ${t} ${t}" aria-hidden="true">${s}</svg>`;
}
// La ligne d'état d'un lieu : une seule, la plus importante. Sous une lentille, l'issue de la condition.
function statutLieu(p) {
  const ech3 = { territoire: "commune", autour: "abords", logement: "logement" };
  if (S.lentille) {
    const r = lirePlusFin(p, S.lentille);
    if (r.a && r.a.rev !== REV_COURANTE) return { t: `Lu sous la révision ${r.a.rev.slice(1)} · ne se compare pas`, cls: "hc" };
    return { t: `${cap(motDe(r))}${ETAB.has(r.issue) || r.issue === "to_confirm" ? ` · ${ech3[r.ech]}` : ""}`, reg: REG[r.issue].reg && !r.libre ? REG[r.issue].reg : null };
  }
  const bq = bloquants(p);
  if (bq.length) return { t: `Ne tient pas : ${bq.map((c) => c.lab()).join(", ")}`, reg: "incompatibilite" };
  if (p.etat === "ecarte") {
    const change = p.ecart.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare";
    return { t: `Écartée le ${dc(p.ecart.date)}${change ? " · raison changée depuis" : ""}`, reg: change ? "controle" : null };
  }
  if (horsCadreP(p)) return { t: "Lu sous l'ancienne version du Projet", cls: "hc" };
  const n = CRITERES.filter((c) => !S.cote.has(c.cle) && lirePlusFin(p, c.cle).issue === "to_confirm" && !COMMUNES[p.commune].libre).length;
  if (n) return { t: `${n} ${pl(n, "point")} à vérifier`, reg: "controle" };

}
const PROF = { apercu: "aperçu gratuit seulement", piste: "rien n'est encore lu", sans_adresse: "adresse inconnue", adresse_non_examinee: "adresse non examinée", examine: null };

// ═══════════════════════════════════════════════════════════════════════════════════════════
// FAIRE LE POINT. Deux étapes, séparées dans le code comme elles le seraient dans le produit.
//
// 1. contrat() : l'état structuré de la recherche, calculé sans rédaction. Il fixe ce que toute
//    lecture a le droit de dire : candidats, versions d'analyse, issues établies, différences
//    comparables, différences hors cadre, inconnues, non-mesuré, observations, vérifications.
// 2. lecture(ct) : des énoncés déterministes, chacun avec ses fondements (analyse, version du
//    Projet, observation, vérification). La « version rédigée » n'est qu'une reformulation de ces
//    énoncés : dans ce prototype, un texte écrit à la main pour chaque situation, qui cite les
//    énoncés sur lesquels chaque phrase repose. Aucune IA n'est appelée.
// ═══════════════════════════════════════════════════════════════════════════════════════════
const NOMBRES = ["zéro", "une", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze"];
const nb = (n, fem = true) => (n === 1 && !fem ? "un" : NOMBRES[n] ?? String(n));
const pl = (n, s, p = s + "s") => (n > 1 ? p : s);
const OU = { territoire: "à la commune", autour: "aux abords", logement: "dans le logement" };
const ordreCrit = (a, b) => (b.sans ? 9 : b.poids) - (a.sans ? 9 : a.poids);

function lectureDe(p) {
  const c = COMMUNES[p.commune];
  if (c.libre) return "apercu";
  if (!c.analyse) return "piste";
  if (p.sansAdresse) return "sans_adresse";
  if (p.type === "bien" && !p.adr) return "adresse_non_examinee";
  return "examine";
}
function versionsDe(p) {
  const c = COMMUNES[p.commune], out = [];
  for (const [cle, ech, nom] of [[c.analyse, "territoire", c.nom], [p.adr, "autour", p.court]]) {
    if (!cle) continue;
    const a = lireAnalyse(cle, p.id);
    out.push({ cle, ech, nom, rev: a.rev, moteur: a.moteur, date: a.date, simule: !!a.simule });
  }
  return out;
}
const refAnalyse = (v) => ({ g: v.ech, t: `${v.nom} · révision ${v.rev.slice(1)} · ${v.moteur} · ${dc(v.date)}${v.simule ? " · simulation" : ""}` });
const refProjet = (rev = REV_COURANTE) => ({ g: null, t: `Votre Projet · révision ${rev.slice(1)} · ${dc(REV[rev].date)}` });
const refsIssue = (p, crit, ech) => { const r = lire(p, crit, ech); return r.a ? [refAnalyse(versionsDe(p).find((v) => v.cle === (ech === "territoire" ? COMMUNES[p.commune].analyse : p.adr)))] : []; };
const uniq = (refs) => refs.filter((r, i) => refs.findIndex((x) => x.t === r.t) === i);

// ── Étape 1 : le contrat ─────────────────────────────────────────────────────────────────────
function contrat() {
  const cands = actives().map((p) => {
    const versions = versionsDe(p);
    return {
      p, lecture: lectureDe(p), versions,
      horsCadre: versions.some((v) => v.rev !== REV_COURANTE),
      bloq: bloquants(p),
      aVerifier: CRITERES.filter((c) => !S.cote.has(c.cle)).map((c) => ({ c, r: lirePlusFin(p, c.cle) })).filter((x) => x.r.issue === "to_confirm" && !x.r.libre),
    };
  });
  return {
    rev: REV_COURANTE, cands,
    comparables: cands.filter((c) => !c.horsCadre && !c.bloq.length && (c.lecture === "examine" || c.lecture === "sans_adresse" || c.lecture === "adresse_non_examinee")),
    ecartees: ecartees(),
    evts: evenementsDepuis(),
    obs: [...OBS, ...S.notes].filter((o) => S.ids.includes(o.pid) && P(o.pid).etat !== "ecarte"),
    cote: [...S.cote],
  };
}
// Clé de cache d'une lecture rédigée : révision du Projet, candidats, versions de leurs analyses,
// observations et priorités mises de côté. Une lentille, une sélection ou un clic n'en font pas partie.
function cleLecture(ct) {
  return [ct.rev, ...ct.cands.map((c) => `${c.p.id}:${c.versions.map((v) => v.rev + (v.simule ? "s" : "")).join("/")}`).sort(), `obs${ct.obs.length}`, `cote:${ct.cote.join("/")}`, `ec:${ct.ecartees.map((p) => p.id).join("/")}`, ...(enoncesDepuis(ct).length ? [`vu:${S.derniere}`] : [])].join("|");
}

// ── Étape 2 : les énoncés ────────────────────────────────────────────────────────────────────
// Un lien d'énoncé ouvre ce qu'il nomme : une piste du rapprochement, une fiche, une vérification.
const go = (arg, txt) => `<button class="lien-p" data-act="go" data-arg="${esc(arg)}">${txt}</button>`;
const nomL = (p) => esc(p.court);

function enoncesJeu(ct) {
  const out = [];
  const n = ct.cands.length;
  const noms = (cs) => liste(cs.map((c) => go("fiche:" + c.p.id, esc(c.p.type === "bien" ? c.p.court : c.p.nom))));
  const groupe = (cs, mot) => (cs.length === n ? `${noms(cs)}, ${n === 2 ? "toutes deux" : "toutes"} ${mot}` : `${nb(cs.length)} ${mot}${cs.length <= 3 ? ` (${noms(cs)})` : ""}`);
  const enCourse = ct.cands.filter((c) => c.p.etat === "en_course");
  const aConsiderer = ct.cands.filter((c) => c.p.etat !== "en_course");
  let t;
  if (n === 0) t = "Aucune possibilité n'est en jeu.";
  else if (n === 1) t = `Une seule possibilité est en jeu : ${go("fiche:" + ct.cands[0].p.id, nomL(ct.cands[0].p))}. Rien n'est à départager ; ce point porte sur ce lieu seul.`;
  else t = `${cap(nb(n))} possibilités sont en jeu : ${[enCourse.length ? groupe(enCourse, "en course") : null, aConsiderer.length ? groupe(aConsiderer, "à considérer") : null].filter(Boolean).join(" et ")}.`;
  if (ct.ecartees.length) t += ` ${ct.ecartees.length > 1 ? `${cap(nb(ct.ecartees.length))} autres sont écartées` : "Une autre est écartée"}.`;
  out.push({ k: "jeu", sec: "jeu", html: t, refs: [refProjet()] });
  for (const c of ct.cands.filter((c) => c.bloq.length)) {
    for (const k of c.bloq) {
      const r = lire(c.p, k.cle, "territoire");
      out.push({ k: "bloq-" + c.p.id, sec: "jeu", fort: "incompatibilite", html: `${go("fiche:" + c.p.id, nomL(c.p))} ne tient pas une condition sans compromis, ${k.lab()} : ${r.valeur.charAt(0).toLowerCase() + r.valeur.slice(1)}. Aucune autre correspondance ne compense ce constat.`, refs: [refProjet(), ...refsIssue(c.p, k.cle, "territoire")] });
    }
  }
  for (const p of ct.ecartees) {
    if (p.ecart?.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare" && REV[p.ecart.rev].gare !== gareMax()) {
      out.push({ k: "ecart-" + p.id, sec: "jeu", html: `${go("fiche:" + p.id, esc(p.nom))} a été écartée le ${dc(p.ecart.date)} pour la gare, sous une limite de ${REV[p.ecart.rev].gare} min que vous avez portée depuis à ${gareMax()} min. Sans nouvelle analyse, futur•e ne peut pas dire si elle y correspondrait.`, refs: [refProjet(p.ecart.rev), refProjet()] });
    }
  }
  return out;
}

// Une paire de lieux : ce qui les sépare dans le même cadre, ce qu'ils partagent.
function enoncesPaire(pa, pb) {
  const out = [];
  const rangs = rangsPaire(pa, pb);
  const de = (rs) => [...new Map(rs.map((r) => [r.c.cle, r])).values()].sort((x, y) => ordreCrit(x.c, y.c));
  const lien = (r, txt) => go(`paire:${pa.id},${pb.id}:${r.c.cle}:${r.ech}`, txt);
  if (pa.commune === pb.commune) {
    out.push({ k: "socle", sec: "compare", html: `${nomL(pa)} et ${nomL(pb)} partagent la lecture de ${COMMUNES[pa.commune].nom} : une seule analyse de la commune, qui vaut pour les deux.`, refs: refsIssue(pa, "mer", "territoire") });
  }
  const sep = de(rangs.filter((r) => r.cl === "separe"));
  const uneEch = (rs) => new Set(rs.map((r) => r.ech)).size === 1;
  const elles = pa.type === "commune" && pb.type === "commune" ? "Elles" : "Ils";
  if (sep.length) {
    const u = uneEch(sep);
    out.push({ k: "separe", sec: "compare", html: `Ce qui les sépare${u ? `, ${OU[sep[0].ech]}` : ""} : ${sep.map((r) => `${lien(r, r.c.lab())}${u ? "" : " " + OU[r.ech]} (${nomL(pa)} : ${motDe(r.a)} ; ${nomL(pb)} : ${motDe(r.b)})`).join(", ")}.`, refs: uniq(sep.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  }
  const com = de(rangs.filter((r) => r.cl === "commun"));
  if (com.length) out.push({ k: "commun", sec: "compare", html: `${elles} se rejoignent sur ${liste(com.map((r) => lien(r, r.c.lab())))}.`, refs: uniq(com.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  const inc = de(rangs.filter((r) => r.cl === "incertain"));
  if (inc.length) out.push({ k: "incertain", sec: "ouvert", html: `Établi d'un seul côté, donc sans départage : ${inc.map((r) => `${lien(r, r.c.lab())} ${OU[r.ech]} (${nomL(pa)} : ${motDe(r.a)} ; ${nomL(pb)} : ${motDe(r.b)})`).join(", ")}.`, refs: uniq(inc.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  const hc = rangs.filter((r) => r.cl === "hors_cadre");
  if (hc.length) {
    const vieilles = [pa, pb].flatMap(versionsDe).filter((v) => v.rev !== REV_COURANTE);
    out.push({ k: "horscadre", sec: "ouvert", html: `Leurs analyses ne répondent pas à la même version de votre Projet : ${liste(vieilles.map((v) => v.nom))} ${vieilles.length > 1 ? "ont été lus" : "a été lu"} sous la ${go("revs", "révision 1")}, quand la gare devait être à moins de ${REV.r1.gare} min. Sur ces ${nb(hc.length, false) === "un" ? "une" : nb(hc.length)} ${pl(hc.length, "lecture")}, un écart comme un accord peut tenir à votre Projet plutôt qu'aux lieux : futur•e ne les compare pas. Les relire sous la révision 2 le permettrait (${go("cadre", "voir ce que cela changerait")}).`, refs: uniq([refProjet("r1"), refProjet(), ...[pa, pb].flatMap(versionsDe).map(refAnalyse)]) });
  }
  return { out, rangs };
}

function enoncesCompare(ct) {
  const out = [];
  const n = ct.cands.length;
  if (n === 1) {
    const c = ct.cands[0], p = c.p;
    if (c.lecture !== "examine" && c.lecture !== "sans_adresse") return out;
    const parReg = {};
    for (const k of CRITERES.filter((k) => !S.cote.has(k.cle))) {
      const r = lirePlusFin(p, k.cle);
      if (!ETAB.has(r.issue)) continue;
      (parReg[r.issue] ??= []).push(`${go(`fiche:${p.id}:${k.cle}`, k.lab())}${r.ech !== "territoire" ? " " + OU[r.ech] : ""}`);
    }
    const morceaux = [["favorable", "correspond"], ["reserve", "compromis"], ["mismatch", "moins bien que demandé"], ["incompatible", "condition non tenue"]].filter(([i]) => parReg[i]).map(([i, m]) => `${m} pour ${liste(parReg[i])}`);
    out.push({ k: "seul", sec: "compare", html: `Pour ${nomL(p)}, futur•e établit : ${morceaux.join(" ; ")}. Aucun autre lieu ne permet encore de le situer : ${go("ajout", "ajouter une possibilité")} montrerait ce qui l'en distingue.`, refs: c.versions.map(refAnalyse) });
    return out;
  }
  if (n === 2) {
    const [a, b] = ct.cands.map((c) => c.p);
    return enoncesPaire(a, b).out;
  }
  // Trois possibilités ou plus : une lecture d'ensemble, jamais une mini-synthèse par lieu.
  const comp = ct.comparables.map((c) => c.p);
  if (comp.length < 2) {
    out.push({ k: "aucune-paire", sec: "compare", html: "Aucune paire de possibilités n'est encore comparable dans un même cadre : les raisons sont ci-dessous.", refs: [refProjet()] });
    return out;
  }
  const communes = [...new Map(comp.map((p) => [p.commune, p])).values()];
  if (communes.length >= 2) {
    const diff = CRITERES.filter((k) => !S.cote.has(k.cle)).filter((k) => {
      const iss = communes.map((p) => lire(p, k.cle, "territoire").issue).filter((i) => ETAB.has(i));
      return new Set(iss).size > 1;
    });
    const memes = CRITERES.filter((k) => !S.cote.has(k.cle) && !diff.includes(k)).filter((k) => communes.every((p) => ETAB.has(lire(p, k.cle, "territoire").issue)));
    out.push({ k: "ensemble", sec: "compare", html: `À la commune, ${liste(communes.map((p) => COMMUNES[p.commune].nom))} sont lues sous la même version de votre Projet. ${diff.length ? `Elles ne disent pas la même chose sur ${liste(diff.map((k) => go("lent:" + k.cle, k.lab())))}` : "Elles disent la même chose sur toutes vos conditions établies"}${memes.length ? ` ; elles se rejoignent sur ${liste(memes.map((k) => k.lab()))}` : ""}.`, refs: uniq(communes.flatMap((p) => versionsDe(p).filter((v) => v.ech === "territoire").map(refAnalyse))) });
  }
  // Les biens d'une même commune partagent un socle : on le dit une fois.
  const parCommune = Object.values(Object.groupBy(comp.filter((p) => p.type === "bien"), (p) => p.commune)).filter((g) => g.length > 1);
  for (const g of parCommune) {
    const avecAdr = g.filter((p) => p.adr);
    const sansAdr = g.filter((p) => !p.adr);
    out.push({ k: "socle-" + g[0].commune, sec: "compare", html: `${liste(g.map(nomL))} partagent la lecture de ${COMMUNES[g[0].commune].nom}. ${avecAdr.length >= 2 ? `Ce qui peut distinguer ${liste(avecAdr.map(nomL))} se lit aux abords et dans le logement${sansAdr.length ? ` ; ${liste(sansAdr.map(nomL))}, sans adresse, ne s'y lit pas encore` : ""}.` : `Sans adresse pour ${liste(sansAdr.map(nomL))}, rien ne les distingue encore.`}`, refs: versionsDe(g[0]).filter((v) => v.ech === "territoire").map(refAnalyse) });
  }
  // Des paires à rapprocher : même type, toutes deux au cadre, dans l'ordre d'ajout. Aucun mérite n'est classé.
  const paires = [];
  for (const type of ["bien", "commune"]) {
    const xs = comp.filter((p) => p.type === type && (type === "commune" || p.adr));
    if (xs.length >= 2) paires.push([xs[0], xs[1]]);
  }
  if (paires.length) out.push({ k: "rapprocher", sec: "compare", html: `Pour voir ce qui sépare deux lieux, rapprochez-les : ${paires.map(([a, b]) => go(`paire:${a.id},${b.id}`, `${nomL(a)} et ${nomL(b)}`)).join(", ou ")}.`, refs: [] });
  return out;
}

function enoncesOuvert(ct, dejaHc, dejaDits = new Set()) {
  const out = [];
  const hcs = ct.cands.filter((c) => c.horsCadre);
  if (hcs.length && !dejaHc && ct.cands.length > 1) {
    const vieilles = hcs.flatMap((c) => c.versions.filter((v) => v.rev !== REV_COURANTE));
    const noms = [...new Set(vieilles.map((v) => v.nom))];
    const touches = hcs.filter((c) => !noms.includes(c.p.court)).map((c) => c.p).filter((p) => p.type === "bien" && !noms.includes(p.court));
    const autre = ct.cands.find((c) => !c.horsCadre && c.p.type === hcs[0].p.type && c.lecture === "examine") ?? ct.cands.find((c) => !c.horsCadre);
    out.push({ k: "horscadre", sec: "ouvert", html: `${liste(noms.map(esc))} ${noms.length > 1 ? "sont lus" : "est lu"} sous la ${go("revs", "révision 1")} de votre Projet, quand la gare devait être à moins de ${REV.r1.gare} min. Tant qu'ils ne sont pas relus sous la révision 2, leurs écarts avec vos autres possibilités ne disent rien des lieux${touches.length ? `. Cela vaut aussi pour ${liste(touches.map(nomL))}, dont la commune est ${liste([...new Set(touches.map((p) => COMMUNES[p.commune].nom))])}` : ""}${autre ? ` : ${go(`paire:${autre.p.id},${hcs[0].p.id}`, "voir ce qui ne se compare pas")}` : ""}.`, refs: uniq([refProjet("r1"), refProjet(), ...vieilles.map(refAnalyse)]) });
  }
  // Les inconnues, regroupées par condition, avec l'échelle où elles se posent.
  const parCrit = new Map();
  for (const c of ct.cands) for (const x of c.aVerifier) {
    if (dejaDits.has(x.c.cle)) continue;
    if (!parCrit.has(x.c.cle)) parCrit.set(x.c.cle, { c: x.c, ou: [] });
    const qui = x.r.ech === "territoire" ? `à ${COMMUNES[c.p.commune].nom}` : `${OU[x.r.ech]} du ${c.p.court}`;
    const e = parCrit.get(x.c.cle);
    if (!e.ou.some((o) => o.qui === qui)) e.ou.push({ qui, p: c.p, ech: x.r.ech });
  }
  if (parCrit.size) {
    const items = [...parCrit.values()].sort((x, y) => ordreCrit(x.c, y.c)).map((e) => `${go(`verif:${e.ou[0].p.id}:${e.c.cle}`, e.c.lab())}${e.c.sans ? ", condition sans compromis," : ""} ${liste(e.ou.map((o) => esc(o.qui)))}`);
    out.push({ k: "inconnues", sec: "ouvert", html: `Restent à vérifier, et futur•e ne peut pas les établir : ${items.join(" ; ")}.`, refs: uniq(ct.cands.filter((c) => c.aVerifier.length).flatMap((c) => c.versions.map(refAnalyse))) });
  }
  for (const c of ct.cands) {
    const nom = go("fiche:" + c.p.id, esc(c.p.type === "bien" ? c.p.court : c.p.nom));
    if (c.lecture === "apercu") out.push({ k: "apercu-" + c.p.id, sec: "ouvert", html: `${nom} n'est lue que par l'aperçu gratuit : ${Object.keys(COMMUNES[c.p.commune].libre).length} de vos ${CRITERES.length} conditions y sont lues, sans départage possible. Ce que l'aperçu ne lit pas reste inconnu ; ce n'est ni bon ni mauvais signe.`, refs: [{ g: "territoire", t: `${c.p.nom} · aperçu gratuit` }] });
    if (c.lecture === "piste") out.push({ k: "piste-" + c.p.id, sec: "ouvert", html: `${nom} est une piste : rien n'y est encore lu.`, refs: [] });
    if (c.lecture === "sans_adresse") out.push({ k: "sansadr-" + c.p.id, sec: "ouvert", html: `${nom} : sans adresse exacte, seule la commune est lue ; les abords et le logement restent inconnus.`, refs: c.versions.map(refAnalyse) });
    if (c.lecture === "adresse_non_examinee") out.push({ k: "adrne-" + c.p.id, sec: "ouvert", html: `${nom} : la commune est lue, l'adresse pas encore.`, refs: c.versions.map(refAnalyse) });
  }
  if (ct.obs.length) {
    const lieux = [...new Set(ct.obs.map((o) => o.pid))];
    out.push({ k: "obs", sec: "ouvert", html: `Vos ${ct.obs.length > 1 ? `${nb(ct.obs.length, false)} observations` : "observation"} (${liste(lieux.map((id) => go("fiche:" + id, nomL(P(id)))))}) ${ct.obs.length > 1 ? "restent des notes" : "reste une note"} : ${ct.obs.length > 1 ? "elles ne modifient" : "elle ne modifie"} aucune issue.`, refs: ct.obs.map((o) => ({ g: null, t: `${cap(o.origine)} · ${dc(o.date)}` })) });
  }
  out.push({ k: "budget", sec: "ouvert", html: "Votre budget de 320 000 € n'est mesuré pour aucun lieu : rien dans cette lecture n'en tient compte.", refs: [refProjet()] });
  if (ct.cote.length) out.push({ k: "cote", sec: "ouvert", html: `Mis de côté dans cette vue : ${liste(ct.cote.map((k) => CRIT[k].lab()))}. Votre Projet n'est pas modifié.`, refs: [] });
  return out;
}

function enoncesAvancer(ct) {
  const out = [];
  const actions = [];
  for (const c of ct.cands.filter((c) => c.p.visite && c.p.visite >= AUJ)) {
    actions.push({ txt: `Préparer la visite du ${dc(c.p.visite)} au ${c.p.court}`, arg: `verif:${c.p.id}:${c.aVerifier[0]?.c.cle ?? ""}` });
  }
  for (const c of ct.cands) for (const x of c.aVerifier) {
    if (actions.length >= 3) break;
    if (c.p.visite && c.p.visite >= AUJ) continue;
    const deja = actions.some((a) => a.crit === x.c.cle && x.r.ech === "territoire" && a.commune === c.p.commune);
    if (!deja) actions.push({ txt: VERIF[x.c.cle] ?? `Vérifier : ${x.c.lab()}`, arg: `verif:${c.p.id}:${x.c.cle}`, crit: x.c.cle, commune: c.p.commune, qui: x.r.ech === "territoire" ? COMMUNES[c.p.commune].nom : c.p.court });
  }
  if (actions.length) out.push({ k: "avancer", sec: "avancer", liste: actions, html: "", refs: [] });
  return out;
}

function enoncesDepuis(ct) {
  const ev = ct.evts.filter((e) => !e.futur);
  if (!ev.length || Date.parse(AUJ) - Date.parse(S.derniere) < 14 * 864e5) return [];
  const proj = ev.filter((e) => e.type === "projet");
  const de = (type) => [...new Set(ev.filter((e) => e.type === type && e.qui).map((e) => e.qui))].map((id) => esc(P(id).type === "bien" ? P(id).court : P(id).nom));
  const morceaux = [];
  if (proj.length) morceaux.push(`votre Projet a été révisé le ${dc(proj[0].date)} (une gare à moins de 30 min au lieu de 20)`);
  const mot = ev.find((e) => e.type === "moteur");
  const aj = de("ajout"), exa = de("examen"), vis = de("visite"), eca = de("ecarte");
  for (const [xs, un, des] of [[aj, "un ajout", "ajouts"], [exa, "un examen", "examens"], [vis, "une visite", "visites"], [eca, "un lieu écarté", "lieux écartés"]]) {
    if (xs.length) morceaux.push(`${xs.length > 1 ? `${nb(xs.length, false)} ${des}` : un} (${liste(xs)})`);
  }
  const t = `Depuis votre visite du ${dc(S.derniere)} : ${morceaux.join(" ; ")}.${mot ? ` Le moteur de futur•e est passé à engine-6 le ${dc(mot.date)} ; vos analyses restent celles d'engine-4 et ne sont pas relues d'elles-mêmes.` : ""} Le temps écoulé ne change aucune analyse.`;
  return [{ k: "depuis", sec: "depuis", html: t, refs: [{ g: null, t: `Journal · ${ev.length} entrées, du ${dc(ev[0].date)} au ${dc(ev.at(-1).date)}` }] }];
}

function lecture(ct) {
  const jeu = enoncesJeu(ct);
  const compare = enoncesCompare(ct);
  const dits = new Set(ct.cands.length === 2 ? rangsPaire(ct.cands[0].p, ct.cands[1].p).filter((r) => r.cl === "incertain").map((r) => r.c.cle) : []);
  const ouvert = [...compare.filter((e) => e.sec === "ouvert"), ...enoncesOuvert(ct, compare.some((e) => e.k === "horscadre"), dits)];
  return [
    { cle: "depuis", titre: "Ce qui a changé", es: enoncesDepuis(ct) },
    { cle: "jeu", titre: "Ce qui reste en jeu", es: jeu },
    { cle: "compare", titre: ct.cands.length === 1 ? "Ce qui est établi" : "Ce qui se compare", es: compare.filter((e) => e.sec === "compare") },
    { cle: "ouvert", titre: "Ce qui ne peut pas encore être conclu", es: ouvert },
    { cle: "avancer", titre: "Ce qui ferait avancer", es: enoncesAvancer(ct) },
  ].filter((s) => s.es.length);
}

// La lecture d'accueil : une ou deux phrases, tirées des mêmes énoncés, jamais un autre texte.
function accroche(ct) {
  const sections = lecture(ct);
  const tous = sections.flatMap((s) => s.es);
  const prem = tous.find((e) => e.k === "jeu");
  const limite = tous.find((e) => e.k.startsWith("bloq-")) ?? tous.find((e) => e.k === "horscadre") ?? tous.find((e) => e.k === "aucune-paire") ?? tous.find((e) => e.k.startsWith("apercu-")) ?? tous.find((e) => e.k === "separe" || e.k === "ensemble" || e.k === "seul");
  return [prem, limite].filter(Boolean);
}

// ── Rendu ────────────────────────────────────────────────────────────────────────────────────
function htmlRefs(refs) {
  if (!refs.length) return `<span class="meta">Votre recherche</span>`;
  return refs.map((r) => `<span class="ref">${r.g ? glyphe(r.g, 11) : `<i class="ref-p" aria-hidden="true"></i>`}<span>${esc(r.t)}</span></span>`).join("");
}
function htmlEnonce(e, n) {
  if (e.liste) {
    return `<li class="enonce avancer" id="en-${e.k}"><span class="num-e meta">${n}</span><ol class="verifs-p">${e.liste.map((a, i) => `<li><span class="meta">${i + 1}</span><div><p>${esc(a.txt)}</p>${a.qui ? `<span class="nuance">${esc(a.qui)}</span>` : ""}</div>${go(a.arg, "Ouvrir")}</li>`).join("")}</ol></li>`;
  }
  return `<li class="enonce ${e.fort ? "fort" : ""}" id="en-${e.k}" ${e.fort ? `style="--t:var(--reg-${e.fort})"` : ""}><p><span class="num-e meta">${n}</span>${e.html}</p><div class="marge-p" aria-label="Sur quoi repose l'énoncé ${n}">${htmlRefs(e.refs)}</div><details class="marge-d"><summary>Sur quoi cela repose · ${e.refs.length || 1}</summary><div class="marge-p">${htmlRefs(e.refs)}</div></details></li>`;
}
function htmlPoint() {
  const ct = contrat();
  const sections = lecture(ct);
  const cle = cleLecture(ct);
  const red = REDIGE[S.situation];
  const aJour = red && red.cle === cle;
  let n = 0;
  const num = {};
  sections.forEach((s) => s.es.forEach((e) => { num[e.k] = ++n; }));
  const etabli = sections.map((s) => `<section class="sec-p"><h3 class="etiquette">${s.titre}</h3><ol class="enonces">${s.es.map((e) => htmlEnonce(e, num[e.k])).join("")}</ol></section>`).join("");
  // La version rédigée cite ses énoncés : un appel absent du contrat est une erreur, affichée comme telle.
  const lier = (txt) => txt.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (_, arg, t) => go(arg, t));
  const redige = !red ? "" : red.paras.map((par) => `<p class="para-r">${par.map(([brut, refs]) => {
    const txt = lier(brut);
    return `${txt}${refs.length ? `<sup class="appel">${refs.map((k) => (num[k] ? `<button data-act="appel" data-arg="${k}" aria-label="Énoncé ${num[k]}">${num[k]}</button>` : `<span class="manque" data-manque="${k}">?</span>`)).join(" ")}</sup>` : ""}`;
  }).join(" ")}</p>`).join("");
  const modes = `<div class="modes" role="group" aria-label="Forme de la lecture">
    <button data-act="mode" data-arg="etabli" aria-pressed="${!S.redige}" data-fk="mode-etabli">Lecture établie</button>

// ═══════════════════════════════════════════════════════════════════════════════════════════
// LE RAPPROCHEMENT, DANS L'ORDRE DES QUESTIONS. D'abord ce qui les départage, puis ce qui ne
// peut pas être conclu, vos conditions sans compromis, ce qu'ils partagent ; toutes les pistes
// échelle par échelle restent à un geste. Les conditions sont rangées comme dans le Projet
// (sans compromis, puis par poids), toutes échelles confondues : un compromis aux abords n'attend
// plus derrière six lignes de Territoire. Les nombres sont des longueurs de liste, rien d'autre.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function piste(cl, a, b, ech, k) {
  const A = 7, B = 93, C = 50;
  const mk = (r, x, kk, neutre) => `<span class="mk" data-k="${k}-${kk}" style="left:${x}%">${neutre ? marqueNeutre(ech) : marque(r, ech, 20)}</span>`;
  const tx = (cls, txt) => `<span class="tx ${cls}">${txt}</span>`;
  const ligne = (g, d, cls = "") => `<span class="pl ${cls}" style="left:${g}%;right:${100 - d}%"></span>`;
  const ma = cap(motDe(a)), mb = cap(motDe(b));
  switch (cl) {
    case "commun": return ligne(A, B) + mk(a, C, "a") + mk(b, C, "b") + tx("ce", `${ma}, tous deux`);
    case "socle": return ligne(A, B, "fort") + mk(a, C, "a") + mk(b, C, "b") + tx("ce", `${ma} · une seule lecture`);
    case "separe": return ligne(A, 44) + ligne(56, B) + `<span class="coupure"></span>` + mk(a, A, "a") + mk(b, B, "b") + tx("ga", ma) + tx("dr", mb);
    case "bloquant": return mk(a, A, "a") + mk(b, B, "b") + tx("ga", ma) + tx("dr", mb) + tx("ce", "rien ne compense");
    // Hors cadre : aucune ligne, aucune teinte, aucun mot d'issue. Seulement la version de chaque lecture.
    case "hors_cadre": return mk(a, A, "a", true) + mk(b, B, "b", true) + `<span class="neq" aria-hidden="true">≠</span>` + tx("ga", `Révision ${a.a.rev.slice(1)} · ${dc(a.a.date)}`) + tx("dr", `Révision ${b.a.rev.slice(1)} · ${dc(b.a.date)}`) + tx("ce", "ne se compare pas");
    case "incertain": case "a_verifier": case "inconnu": return ligne(A, B, "points") + mk(a, A, "a") + mk(b, B, "b") + tx("ga", ma) + tx("dr", mb);
    default: return mk(a, A, "a") + mk(b, B, "b") + tx("ga", ma) + tx("dr", mb);
  }
}
function marqueNeutre(ech) {
  return `<svg class="g" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">${forme(ECH[ech].forme, 20, `fill="none" stroke="var(--r-discret)" stroke-width="1.4" stroke-dasharray="2 2.6"`)}</svg>`;
}
function rangsPaire(pa, pb) {
  const out = [];
  for (const ech of ["territoire", "autour", "logement"]) {
    for (const c of CRITERES) {
      if (!c.ech.includes(ech) || S.cote.has(c.cle)) continue;
      out.push({ ech, c, cl: classePaire(pa, pb, c.cle, ech), a: lire(pa, c.cle, ech), b: lire(pb, c.cle, ech) });
    }
  }
  return out;
}
const RAISON = { hors_cadre: "Deux versions du Projet", incertain: "Établi d'un seul côté", a_verifier: "À vérifier des deux côtés", inconnu: "Aucune ne le dit", profondeur: "Une seule est examinée ici", partiel: "Aperçu gratuit, hors départage", rien: "Aucune n'est examinée ici" };
function htmlRang(r, pa, pb, opts = {}) {

  const etiquette = opts.raison ? RAISON[r.cl] ?? CLASSE[r.cl].mot : CLASSE[r.cl].mot;

    <div class="rang-lab"><span class="c">${glyphe(r.ech, 12)} ${lab}</span><span class="k">${r.c.sans ? "sans compromis · " : ""}${OU[r.ech]}${opts.raison ? ` · ${etiquette}` : ""}</span></div>
    <div><button class="piste" data-act="rang" data-arg="${k}" data-fk="rang-${k}" aria-expanded="${ouvert}" aria-label="${esc(`${lab}, ${OU[r.ech]}. ${etiquette}. ${lu}. ${ouvert ? "Masquer" : "Voir"} les preuves.`)}">${piste(r.cl, r.a, r.b, r.ech, k)}</button>

  }).join("");
  const vers = (p) => { const vs = versionsDe(p); if (!vs.length) return COMMUNES[p.commune].libre ? "aperçu gratuit" : "aucune analyse"; const revs = [...new Set(vs.map((v) => v.rev))]; return revs.length === 1 ? `révision ${revs[0].slice(1)}` : vs.map((v) => `${v.ech === "territoire" ? "commune" : "adresse"} rév. ${v.rev.slice(1)}`).join(", "); };
  return `<div class="rapp arrive" data-paire="${pa.id},${pb.id}">
    <div class="rapp-tete">
      <div class="pole">${mini(pa, 30)}<div><h2 id="titre-rapp" tabindex="-1">${nomA}</h2><span class="s">${pa.type === "bien" ? COMMUNES[pa.commune].nom + " · " : ""}${vers(pa)}</span></div></div>
      <span class="entre" aria-hidden="true">⟷</span>
      <div class="pole">${mini(pb, 30)}<div><h3>${nomB}</h3><span class="s">${pb.type === "bien" ? COMMUNES[pb.commune].nom + " · " : ""}${vers(pb)}</span></div></div>
    </div>
    ${hc ? `<div class="emplacement-hc"><p><b class="encre">Ces deux lectures ne se comparent pas encore.</b> ${liste([pa, pb].flatMap(versionsDe).filter((v) => v.rev !== REV_COURANTE).map((v) => esc(v.nom)))} ${[pa, pb].flatMap(versionsDe).filter((v) => v.rev !== REV_COURANTE).length > 1 ? "ont été lus" : "a été lu"} sous la révision 1 de votre Projet, quand la gare devait être à moins de 20 min. Leurs issues sont consultables, à leur date ; elles ne disent pas lequel convient mieux aujourd'hui.</p><div class="actions"><button class="btn" data-act="cadre" data-fk="cadre-rapp">Relire sous la révision 2 <span class="sim">simulation</span></button><button class="btn-lien" data-act="revs">Voir les deux versions du Projet</button></div></div>` : S.cadre ? `<div class="emplacement-hc"><p><span class="sim">simulation</span> Analyses lues comme si elles avaient été actualisées sous la révision 2 et engine-6. Aucune analyse n'a été produite.</p><div><button class="btn-lien" data-act="cadre" data-fk="cadre-rapp">Revenir aux analyses figées</button></div></div>` : ""}
    ${phrase.length ? `<div class="rapp-phrase">${phrase.map((t) => `<p>${t}</p>`).join("")}</div>` : ""}
    ${blq.length || departage.length || !hc ? htmlSection("Ce qui les départage", departage, pa, pb, hc ? "Rien ne peut encore les départager dans le même cadre." : "Rien d'établi ne les sépare.", {}) : ""}
    ${htmlSection(hc ? "Ce qui ne peut pas encore être conclu" : "Ce qui reste à établir", ouverts, pa, pb, "Tout ce qui se lit des deux côtés est établi.", { raison: true })}
    ${sans.length ? `<section class="sec-r"><h4 class="sec-titre"><span>Vos conditions sans compromis</span><span class="num">${sans.length + blq.length}</span></h4><ul class="sans-l">${[...blq, ...sans].map((r) => `<li><span class="reg-t" style="--t:${r.cl === "bloquant" ? "var(--reg-incompatibilite)" : r.cl === "commun" || r.cl === "socle" ? "var(--reg-alignement)" : "var(--r-meta)"}"><b class="encre">${cap(r.c.lab())}</b></span><span class="nuance">${r.cl === "bloquant" ? "non tenue : rien ne compense" : r.cl === "commun" || r.cl === "socle" ? "tenue des deux côtés" : r.cl === "hors_cadre" ? `${nomA} : ${motDe(r.a)}, selon la révision ${r.a.a.rev.slice(1)} ; ${nomB} : ${motDe(r.b)}, selon la révision ${r.b.a.rev.slice(1)}` : r.cl === "a_verifier" ? "à vérifier des deux côtés" : `${nomA} : ${motDe(r.a)} ; ${nomB} : ${motDe(r.b)}`}</span>${r.cl === "a_verifier" || r.cl === "incertain" ? `<button class="btn-lien meta" data-act="rang" data-arg="${r.ech}-${r.c.cle}" data-fk="sans-${r.c.cle}">Quoi vérifier</button>` : ""}</li>`).join("")}</ul>${sans.some((r) => S.rangOuvert === `${r.ech}-${r.c.cle}`) ? sans.filter((r) => S.rangOuvert === `${r.ech}-${r.c.cle}`).map((r) => `<div class="preuves">${htmlPreuve(r.a, pa, r.ech)}${htmlPreuve(r.b, pb, r.ech)}${[[pa, r.a], [pb, r.b]].filter(([, x]) => x.issue === "to_confirm" && !x.libre).map(([p]) => htmlVerif(p, r.c.cle)).join("")}</div>`).join("") : ""}</section>` : ""}
    <section class="sec-r"><button class="depliant" data-act="commun" data-fk="commun" aria-expanded="${S.menus.commun}"><span class="pm" aria-hidden="true">${S.menus.commun ? "−" : "+"}</span>Ce qu'ils ont en commun <span class="num">${communs.length + (socle.length ? 1 : 0)}</span></button>
      ${S.menus.commun ? `<div class="arrive">${socle.length ? `<div class="socle"><p><b class="encre">${COMMUNES[pa.commune].nom} : une seule lecture pour les deux.</b> ${socle.length} conditions identiques par construction ; on ne les répète pas.</p></div>` : ""}${communs.map((r) => htmlRang(r, pa, pb)).join("")}${!communs.length && !socle.length ? `<p class="vide-rapp">Rien d'établi en commun.</p>` : ""}</div>` : `<p class="nuance resume-commun">${socle.length ? `Même commune, ${COMMUNES[pa.commune].nom}. ` : ""}${communs.length ? liste([...new Set(communs.map((r) => r.c.lab()))]) + "." : socle.length ? "" : "Rien d'établi en commun."}</p>`}
    </section>
    <section class="sec-r"><button class="depliant" data-act="toutes" data-fk="toutes" aria-expanded="${S.menus.toutes}"><span class="pm" aria-hidden="true">${S.menus.toutes ? "−" : "+"}</span>Toutes les conditions, échelle par échelle <span class="num">${rangs.length}</span></button>${S.menus.toutes ? `<div class="arrive">${bandes}</div>` : ""}</section>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// CONDITION PAR CONDITION. Dans « Faire le point », à la demande. Aucune colonne n'est totalisée.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function htmlPartition() {
  const ps = actives();
  const cols = `minmax(140px, 220px) repeat(${ps.length}, 46px)`;
  const crits = CRITERES.filter((c) => !S.cote.has(c.cle));
  return `<p class="nuance" style="margin-top:8px">Une forme dit où la réponse a été lue. Une marque en pointillé gris vient d'une analyse d'une autre version du Projet : elle ne se compare pas aux autres.</p>
    <div class="partition-wrap"><div class="partition" role="table" aria-label="Vos conditions pour chaque possibilité">
      <div class="ligne-p tete-p" role="row" style="grid-template-columns:${cols}"><span role="columnheader"><span class="sr">Condition</span></span>${ps.map((p) => `<span role="columnheader" class="v" title="${esc(p.nom)}">${esc(p.court)}</span>`).join("")}</div>
      ${crits.map((c) => `<div class="ligne-p ${S.lentille === c.cle ? "focus" : ""}" role="row" style="grid-template-columns:${cols}"><span class="lab-p" role="rowheader">${cap(c.lab())}</span>${ps.map((p) => { const r = lirePlusFin(p, c.cle); const hc = r.a && r.a.rev !== REV_COURANTE; return `<span role="cell"><button class="cel" data-act="cellule" data-arg="${p.id},${c.cle}" aria-label="${esc(`${p.court}, ${c.lab()} : ${hc ? `lu sous la révision ${r.a.rev.slice(1)}, ne se compare pas` : motDe(r)}, ${ECH[r.ech].lu}`)}">${hc ? marqueNeutre(r.ech) : marque(r, r.ech, 18)}</button></span>`; }).join("")}</div>`).join("")}
    </div></div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// RENDU. Une seule zone de lecture à droite de la planche : l'accueil, « Faire le point », une
// fiche ou un rapprochement. Le fil de retour remonte d'un niveau à la fois. Sur un écran
// étroit, la lecture passe dans une feuille plein écran ; l'accueil reste au-dessus de la liste.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function htmlFil() {
  const ici = S.sel.length === 2 ? "Rapprochement" : S.sel.length === 1 ? P(S.sel[0]).court : "Faire le point";
  const retour = S.sel.length && S.point ? "Faire le point" : "Ma recherche";
  return `<nav class="fil" aria-label="Où vous êtes"><button class="btn-lien" data-act="retour" data-fk="retour">← ${retour}</button><span class="meta" id="sheet-titre">${esc(ici)}</span>${!S.point ? `<button class="btn-lien meta droite-fil" data-act="point" data-fk="point-fil">Faire le point</button>` : ""}</nav>`;
}
function contenuLecture() {
  if (S.sel.length === 2) return htmlRapprochement(S.sel);
  if (S.sel.length === 1) return htmlFiche(P(S.sel[0]));
  if (S.point) return htmlPoint();
  return "";
}
let derniereCle = "";
let flipCadre = false;
function rendreLecture() {
  const m = mobile();
  const sheet = $("#sheet"), lec = $("#lecture");
  const avant = new Map([...document.querySelectorAll("[data-k]")].map((e) => [e.dataset.k, e.getBoundingClientRect().left]));
  const c = contenuLecture();
  if (m) {
    lec.innerHTML = htmlAccueil(); $("#suite").innerHTML = htmlSuite(); $("#suite").hidden = false;
    if (c) {
      sheet.innerHTML = `<div class="sheet-barre">${htmlFil()}</div>${c}`;
      sheet.hidden = false; document.body.classList.add("sheet-ouverte"); $("#app").inert = true;
    } else { sheet.hidden = true; sheet.innerHTML = ""; document.body.classList.remove("sheet-ouverte"); $("#app").inert = false; }
  } else {
    sheet.hidden = true; sheet.innerHTML = ""; document.body.classList.remove("sheet-ouverte"); $("#app").inert = false;
    lec.innerHTML = c ? htmlFil() + c : htmlAccueil();
    $("#suite").innerHTML = c ? "" : htmlSuite(); $("#suite").hidden = !!c;
  }
  // Mise au même cadre : une marque qui change de place glisse de l'ancienne à la nouvelle.
  if (flipCadre && !reduit()) {
    document.querySelectorAll("[data-k]").forEach((e) => {
      const x0 = avant.get(e.dataset.k); if (x0 == null) return;
      const dx = x0 - e.getBoundingClientRect().left; if (Math.abs(dx) < 1) return;
      e.style.transition = "none"; e.style.transform = `translateX(${dx}px)`; e.getBoundingClientRect();
      e.style.transition = "transform var(--m-etat) var(--m-releve)"; e.style.transform = "";
    });
  }
  flipCadre = false;
  // Ce qui reste affiché ne rejoue pas son arrivée à chaque geste.
  const cle = `${S.sel.join(",")}|${S.point}|${S.redige}`;
  if (cle === derniereCle) document.querySelectorAll(".arrive").forEach((e) => e.classList.remove("arrive"));
  derniereCle = cle;
}
function rendreMenu() {
  const m = $("#menu-situations");
  m.hidden = !S.menus.situations;
  $("#btn-situations").setAttribute("aria-expanded", S.menus.situations);
  $("#situation-courante").textContent = SITUATIONS.find((s) => s.cle === S.situation).lib.toLowerCase();
  m.innerHTML = `<p class="nuance">Situations de démonstration. Tout est fictif ; rien n'est enregistré.</p>${SITUATIONS.map((s) => `<button data-act="situation" data-arg="${s.cle}" aria-current="${S.situation === s.cle}"><b>${s.lib}</b><span>${s.d}</span></button>`).join("")}`;
}
function rendre() {
  const fk = document.activeElement?.dataset?.fk;
  rendreMenu(); rendreProjet(); rendrePlanche(); appliquerLentillePlanche(); rendreLecture();
  if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el && !el.closest("[inert]")) el.focus({ preventScroll: true }); }
}
function note(html, ms = 6000) {
  const n = $("#note");
  n.innerHTML = `<p>${html}</p><button class="btn-lien" data-act="note-fermer">Fermer</button>`;
  n.hidden = false; clearTimeout(note.h); note.h = setTimeout(() => (n.hidden = true), ms);
}
function reinitLecture() { S.echelleFiche = null; S.condOuverte = null; S.rangOuvert = null; S.menus.commun = false; S.menus.toutes = false; S.menus.ecarter = null; S.menus.note = null; }
// Après un geste qui change la lecture : on la montre et on y porte le focus.
function montrer(cible) {
  rendre();
  const titre = S.sel.length === 2 ? "#titre-rapp" : S.sel.length === 1 ? "#titre-fiche" : S.point ? "#titre-point" : null;
  if (mobile()) { const sh = $("#sheet"); if (!sh.hidden) sh.scrollTop = 0; }
  else { const l = $("#lecture"); if (l.getBoundingClientRect().top < 0) l.scrollIntoView({ block: "start", behavior: reduit() ? "auto" : "smooth" }); }
  if (titre) $(titre)?.focus({ preventScroll: true });
  if (cible) {
    const el = document.getElementById(cible);
    if (el) { el.scrollIntoView({ block: "center", behavior: reduit() ? "auto" : "smooth" }); el.classList.add("eclaire"); setTimeout(() => el.classList.remove("eclaire"), 1600); }
  }
}
function chargerSituation(cle) {
  const s = SITUATIONS.find((x) => x.cle === cle);
  Object.assign(S, { situation: cle, ids: [...s.ids], derniere: s.derniere, sel: [], lentille: null, cadre: false, point: false, redige: false, filtre: "toutes", echelleFiche: null, condOuverte: null, rangOuvert: null, etats: {}, ecartsLocaux: {} });
  S.cote = new Set(); S.verifs = new Set(); S.notes = [];
  S.menus = { situations: false, ajout: false, depuis: false, revs: false, guidePlus: false, ecarter: null, note: null, commun: false, toutes: false, fondements: false, tableau: false };
  clePlanche = "";
}
// Un lien d'énoncé : il ouvre exactement ce qu'il nomme.
function suivre(arg) {
  const [type, a, crit, ech] = arg.split(":");
  switch (type) {
    case "fiche": reinitLecture(); S.sel = [a]; S.condOuverte = crit || null; return montrer(crit ? null : null);
    case "visite":
    case "verif": {
      reinitLecture(); S.sel = [a];
      S.condOuverte = crit || CRITERES.find((c) => lirePlusFin(P(a), c.cle).issue === "to_confirm")?.cle || null;
      return montrer(S.condOuverte ? "cond-" + S.condOuverte : null);
    }
    case "paire": {
      reinitLecture(); S.sel = a.split(",");
      if (crit) { S.lentille = crit; S.rangOuvert = `${ech}-${crit}`; }
      return montrer(crit ? `rang-${ech}-${crit}` : null);
    }
    case "lent": S.lentille = crit ?? a; if (mobile()) S.point = false; rendre(); $("#planche").scrollIntoView({ block: "start", behavior: reduit() ? "auto" : "smooth" }); return;
    case "revs": S.menus.revs = true; S.sel = []; if (mobile()) S.point = false; rendre(); window.scrollTo({ top: 0, behavior: reduit() ? "auto" : "smooth" }); $("[data-fk='revs']")?.focus({ preventScroll: true }); return;
    case "cadre": if (!S.cadre) basculerCadre(); rendre(); return;
    case "ajout": S.point = false; S.sel = []; S.menus.ajout = true; clePlanche = ""; rendre(); $("[data-fk='ajout']")?.focus(); return;
    case "mode": S.redige = a === "redige"; return montrer();
  }
}
function basculerCadre() {
  S.cadre = !S.cadre; clePlanche = ""; flipCadre = true;
  note(S.cadre ? `<span class="sim">simulation</span> Analyses lues comme si elles avaient été relues sous la révision 2 et engine-6. Dans le produit, chacune deviendrait une nouvelle version, l'ancienne restant lisible ; ici, aucune analyse n'est produite.` : "Retour aux analyses figées.");
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) { if (S.menus.situations && !e.target.closest("#menu-situations")) { S.menus.situations = false; rendreMenu(); } return; }
  const act = t.dataset.act, arg = t.dataset.arg;
  switch (act) {
    case "ouvrir": reinitLecture(); S.sel = S.sel.length === 1 && S.sel[0] === arg ? [] : [arg]; return montrer();
    case "sel-seul": reinitLecture(); S.sel = [arg]; return montrer();
    case "paire": reinitLecture(); S.sel = arg.split(","); return montrer();
    case "visite": return suivre(`verif:${arg}`);
    case "go": return suivre(arg);
    case "cellule": { const [pid, crit] = arg.split(","); reinitLecture(); S.sel = [pid]; S.condOuverte = crit; return montrer("cond-" + crit); }
    case "ecarter-ouvrir": reinitLecture(); S.sel = [arg]; S.menus.ecarter = arg; return montrer();
    case "point": reinitLecture(); S.sel = []; S.point = true; return montrer();
    case "fermer": case "retour": {
      const etaitSel = S.sel.length;
      if (etaitSel) { S.sel = []; reinitLecture(); } else S.point = false;
      rendre();
      (S.point ? $("#titre-point") : document.querySelector(".lieu"))?.focus({ preventScroll: true });
      return;
    }
    case "appel": S.redige = false; return montrer("en-" + arg);
    case "mode": S.redige = arg === "redige"; break;
    case "lentille": S.lentille = S.lentille === arg ? null : arg; break;
    case "cote": if (S.cote.has(arg)) S.cote.delete(arg); else S.cote.add(arg); clePlanche = ""; break;
    case "cadre": basculerCadre(); break;
    case "echelle": S.echelleFiche = S.echelleFiche === t.dataset.ech ? null : t.dataset.ech; break;
    case "cond": S.condOuverte = S.condOuverte === arg ? null : arg; break;
    case "rang": S.rangOuvert = S.rangOuvert === arg ? null : arg; break;
    case "commun": S.menus.commun = !S.menus.commun; break;
    case "toutes": S.menus.toutes = !S.menus.toutes; break;
    case "tableau": S.menus.tableau = !S.menus.tableau; break;
    case "filtre": S.filtre = arg; break;
    case "verif": if (S.verifs.has(arg)) S.verifs.delete(arg); else S.verifs.add(arg); break;
    case "ajout": S.menus.ajout = !S.menus.ajout; clePlanche = ""; if (mobile()) { S.sel = []; S.point = false; } break;
    case "ajouter": S.ids = [...S.ids, arg]; S.menus.ajout = false; reinitLecture(); S.sel = [arg]; clePlanche = ""; note(`<span class="sim">démonstration</span> ${POSS[arg].nom} ajoutée. Rien n'est analysé.`); return montrer();
    case "reprendre": S.etats[arg] = "a_considerer"; clePlanche = ""; note(`${P(arg).nom} revient parmi vos possibilités. Son analyse répond toujours à la révision ${(P(arg).ecart?.rev ?? REV_COURANTE).slice(1)} : elle ne se compare pas aux autres tant qu'elle n'est pas relue.`); break;
    case "ecarter": S.menus.ecarter = S.menus.ecarter === arg ? null : arg; break;
    case "note": S.menus.note = S.menus.note === arg ? null : arg; break;
    case "examiner": note(`<span class="sim">simulation</span> Dans le produit, ce geste ouvrirait ${POSS[arg].type === "commune" ? "le dossier de territoire" : "l'analyse de l'adresse"}, avec son prix et son périmètre expliqués. Ici, rien n'est acheté ni analysé.`, 8000); return;
    case "situations": S.menus.situations = !S.menus.situations; rendreMenu(); if (S.menus.situations) $("#menu-situations button")?.focus(); return;
    case "situation": chargerSituation(arg); rendre(); window.scrollTo({ top: 0 }); $("#btn-situations").focus({ preventScroll: true }); return;
    case "theme": { const r = document.documentElement; const sombre = r.dataset.theme ? r.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches; r.dataset.theme = sombre ? "light" : "dark"; try { localStorage.setItem("fut41-v3-theme", r.dataset.theme); } catch {} return; }
    case "depuis": S.menus.depuis = !S.menus.depuis; break;
    case "revs": S.menus.revs = !S.menus.revs; if (S.menus.revs && mobile()) { S.sel = []; S.point = false; } break;
    case "guidePlus": S.menus.guidePlus = !S.menus.guidePlus; break;
    case "note-fermer": $("#note").hidden = true; return;
  }
  rendre();
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const d = new FormData(f); const pid = f.dataset.pid;
  if (f.dataset.form === "note") {
    S.notes.push({ pid, crit: d.get("crit"), date: AUJ, origine: "noté par vous", texte: String(d.get("texte")).trim() });
    S.menus.note = null; S.condOuverte = d.get("crit"); note("Note gardée pour cette page. Elle ne modifie aucune issue.");
  } else if (f.dataset.form === "ecarter") {
    const crit = d.get("crit"); const motif = String(d.get("motif") || "").trim();
    S.etats[pid] = "ecarte"; S.ecartsLocaux[pid] = { date: AUJ, rev: REV_COURANTE, critere: crit === "autre" ? null : crit, motif: motif ? `« ${motif} »` : crit === "autre" ? "Une autre raison." : `Raison : ${CRIT[crit].lab()}.` };
    S.menus.ecarter = null; clePlanche = ""; note(`${P(pid).court} est écartée. La raison et la version du Projet sont gardées.`);
  }
  rendre();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.menus.situations) { S.menus.situations = false; rendreMenu(); $("#btn-situations").focus(); return; }
  if (S.sel.length || S.point) $("[data-act='retour']")?.click();
});
matchMedia("(max-width: 1023px)").addEventListener("change", () => rendre());
try { const th = localStorage.getItem("fut41-v3-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
const depart = new URLSearchParams(location.search).get("situation");
chargerSituation(SITUATIONS.some((s) => s.cle === depart) ? depart : "recherche");
rendre();
</script>
