    <p class="nuance">Ajouter un lieu l'enregistre dans votre recherche. Rien n'est analysé, rien n'est acheté : vous verrez ensuite ce qui peut en être lu. <span class="sim">démonstration</span> ${libres.length > 1 ? "deux lieux préparés" : "un lieu préparé"}.</p>
    <div class="gestes">${libres.map(([a, t]) => `<button class="bouton" data-act="go" data-arg="${a}">${libres.length > 1 ? `Ajouter ${esc(t.split(",")[0])}` : "Ajouter à ma recherche"}</button>`).join("")}<button class="lien petit" data-act="ajout">Annuler</button></div>
  </div>`;
}
function vueRecherche() {
  const ct = contrat();
  const n = ct.cands.length;
  const g = geste(ct);
  const ph = phrasesAccueil(ct);
  const acts = actions();
  const choix = Array.isArray(S.choix);
  const sec = n === 2 ? `<button class="lien" data-act="go" data-arg="point" data-fk="point">Faire le point</button>` : n > 2 ? `<button class="lien" data-act="choix" data-fk="choix">Comparer deux lieux</button>` : "";
  const ev = evenementsDepuis();
  const lentilles = `<div class="outils-lieux"><label for="lentille">Afficher</label><select id="lentille" class="selecteur" data-fk="lentille-sel"><option value="">ce qui demande votre attention</option>${CRITERES.map((c) => `<option value="${c.cle}" ${S.lentille === c.cle ? "selected" : ""}>${c.court().toLowerCase().replace(/^./, (x) => x)}</option>`).join("")}</select></div>`;
  const actifs = actives();
  const ecs = ecartees();
  let lieux;
  if (n === 1 && !choix) {
    const p = actifs[0];
    lieux = `<div class="vedette"><ul style="list-style:none">${htmlTuile(p)}</ul><div>${htmlRetenir(p)}</div></div><ul class="lieux" style="margin-top:28px">${tuileAjout()}</ul>`;
  } else {
    lieux = `<ul class="lieux">${actifs.map(htmlTuile).join("")}${choix ? "" : tuileAjout()}</ul>`;
  }
  // V3.2 · LA PLACE DU PROJET SUIT LA MATURITÉ DE LA RECHERCHE. Même ordre partout (Projet, phrase,
  // geste) ; seules les tailles changent. Au début, le Projet est le titre de l'écran ; à deux lieux, il
  // descend d'un rôle ; dans une recherche enrichie, il tient en une ligne et le titre devient la phrase
  // qui dit où en est la recherche (« le titre dit ce que le lecteur doit retenir », Relevé § 2.2).
  const mat = n <= 1 ? "debut" : n === 2 ? "deux" : "riche";
  const projetTxt = "Vivre près de la mer, avec un médecin à portée.";
  const projetLigne = `<div class="projet-ligne"><span>${CRITERES.length} conditions<span class="long">, dont ${CRITERES.filter((c) => c.sans).length} sans compromis · budget non mesuré</span></span><button class="lien" data-act="projet" data-fk="projet" aria-expanded="${S.menus.projet}" aria-controls="projet-panneau">${S.menus.projet ? "Masquer mon Projet" : "Voir mon Projet"}</button></div>`;
  const gestes = `<div class="gestes"><button class="bouton ${choix ? "" : "boutonMarque"}" data-act="go" data-arg="${g.act}" data-fk="geste">${g.t}</button>${sec}</div>`;
  const chapos = (xs) => xs.map((x) => `<p class="chapo ${x.reg ? "signal" : ""}" ${x.reg ? `style="--t:var(--reg-${x.reg})"` : ""}>${x.t}</p>`).join("");
  const tete = mat === "riche"
    ? `<section class="ouverture riche" aria-labelledby="titre-projet">
      <div class="projet-compact"><span class="etiquette">Votre Projet</span><span class="pc-txt">${projetTxt}</span>${projetLigne}</div>
      ${S.menus.projet ? htmlProjetPanneau() : ""}
      <div class="lead"><div><h1 class="titre" id="titre-projet" tabindex="-1">${ph[0].t}</h1>${chapos(ph.slice(1))}</div>${gestes}</div>
      ${S.menus.ajout ? htmlAjout() : ""}
    </section>`
    : `<section class="ouverture ${mat}" aria-labelledby="titre-projet">
      <span class="surtitre">${mat === "debut" ? "Ma recherche · votre Projet" : "Votre Projet"}</span>
      <h1 class="${mat === "debut" ? "display" : "titre"}" id="titre-projet" tabindex="-1">${projetTxt}</h1>
      ${mat === "debut" ? `<p class="nuance projet-def-l">${DEF_PROJET}</p>` : ""}
      ${projetLigne}
      ${S.menus.projet ? htmlProjetPanneau() : ""}
      <div class="lead"><div>${chapos(ph)}</div>${gestes}</div>
      ${S.menus.ajout ? htmlAjout() : ""}
    </section>`;
  return `<div class="arrive">
    ${tete}
    ${n ? `<section class="mouvement ${mat === "deux" ? "lieux-deux" : ""}" aria-labelledby="titre-lieux">
      <div class="tete-mvt"><h2 class="surtitre" id="titre-lieux"><span class="num">01</span>${n === 1 ? "Votre lieu" : "Vos lieux"}${n > 2 ? ` <span class="nuance" style="font-weight:400">· dans l'ordre où vous les avez ajoutés</span>` : ""}</h2>${n > 1 && !choix ? lentilles : ""}</div>
      ${lieux}
      ${ecs.length && !choix ? `<div class="ecartees-l"><button class="depliant" data-act="ecartees" data-fk="ecartees" aria-expanded="${S.menus.ecartees}"><span class="pm" aria-hidden="true">${S.menus.ecartees ? "−" : "+"}</span><span>${ecs.length > 1 ? `${nb(ecs.length, false)} lieux écartés` : `Un lieu écarté : ${esc(nomLieu(ecs[0]))}`}</span></button>${S.menus.ecartees ? `<ul class="lieux">${ecs.map(htmlTuile).join("")}</ul>` : ""}</div>` : ""}
      ${choix ? `<div class="barre-choix" role="region" aria-label="Comparer deux lieux"><p aria-live="polite">${S.choix.length === 2 ? `<b>${esc(nomLieu(P(S.choix[0])))}</b> et <b>${esc(nomLieu(P(S.choix[1])))}</b>` : "Choisissez deux lieux à comparer"}<span class="marge">${S.choix.length} sur 2</span></p><button class="bouton boutonMarque" data-act="comparer-choix" data-fk="comparer-choix" ${S.choix.length === 2 ? "" : "disabled"}>Comparer</button><button class="lien petit" data-act="choix" data-fk="choix-annuler">Annuler</button></div>` : ""}
    </section>` : ""}
    ${acts.length && n ? `<section class="mouvement" aria-labelledby="titre-faire">
      <div class="tete-mvt"><h2 class="surtitre" id="titre-faire"><span class="num">02</span>À faire</h2>${ev.length ? `<span class="nuance">Depuis votre dernière visite, le ${dc(S.derniere)} : ${ev.length} ${pl(ev.length, "changement")}</span>` : ""}</div>
      ${htmlActions(S.menus.faire ? acts : acts.slice(0, 3))}
      ${acts.length > 3 ? `<button class="depliant" data-act="faire" data-fk="faire" aria-expanded="${S.menus.faire}"><span class="pm" aria-hidden="true">${S.menus.faire ? "−" : "+"}</span><span>${S.menus.faire ? "Moins" : `${acts.length - 3} ${pl(acts.length - 3, "autre")}`}</span></button>` : ""}
    </section>` : ""}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// LE FIL. « Ma recherche », puis l'étape d'où l'on vient, puis l'écran courant.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function htmlFil(courant) {
  const pas = [`<button class="lien" data-act="accueil" data-fk="fil-accueil">Ma recherche</button>`];
  if (S.retour === "point") pas.push(`<button class="lien" data-act="go" data-arg="point" data-fk="fil-point">Faire le point</button>`);
  if (S.retour === "paire" && S.paire.length === 2) pas.push(`<button class="lien" data-act="go" data-arg="paire:${S.paire.join(",")}" data-fk="fil-paire">Comparaison</button>`);
  return `<nav class="fil" aria-label="Fil de navigation">${pas.join(`<span class="sep" aria-hidden="true">/</span>`)}<span class="sep" aria-hidden="true">/</span><span aria-current="page">${esc(courant)}</span></nav>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// UN LIEU. Trois niveaux : ce qu'il faut comprendre ; pourquoi futur•e le dit ; la documentation.
// Les faits des sources, les conclusions de futur•e et vos notes restent séparés.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function docAnalyse(r, ech) {

// La phrase d'entrée de la comparaison : ce qu'il faut regarder, pas le détail.
function entreeComparaison(pa, pb, rangs) {
  const hc = rangs.some((r) => r.cl === "hors_cadre");
  const blq = rangs.filter((r) => r.cl === "bloquant");
  if (blq.length) { const r = blq[0]; const qui = r.a.issue === "incompatible" ? pa : pb; return [`${esc(nomLieu(qui))} ne tient pas votre condition sans compromis « ${r.c.lab()} » : rien ne compense ce point.`]; }
  if (hc) { const vieux = [pa, pb].filter(horsCadreP); return [`Ces deux lieux ne peuvent pas encore être comparés de façon fiable : votre Projet a changé depuis l'analyse ${vieux.length > 1 ? "des deux" : `du ${esc(nomLieu(vieux[0]))}`}.`]; }
  if (rangs.some((r) => r.cl === "partiel")) return [`${esc(nomLieu(cLibre(pa) ? pa : pb))} n'est connue que par l'aperçu gratuit : trop peu pour les comparer.`];
  const sep = [...new Map(rangs.filter((r) => r.cl === "separe").map((r) => [r.c.cle, r])).values()].sort((x, y) => ordreCrit(x.c, y.c));
  const quoi = pa.type === "commune" && pb.type === "commune" ? "ces communes" : "ces lieux";
  const out = [];
  if (pa.commune === pb.commune) out.push(`Même commune : ce qui se lit à ${COMMUNES[pa.commune].nom} vaut pour les deux.`);
  if (!sep.length) { out.push("Rien d'établi ne les distingue."); return out; }
  const noms = sep.map((r) => r.c.court().toLowerCase().replace(/^une |^des |^le |^la |^un /, (m) => m));
  if (sep.length === 1) out.push(`Une condition distingue ${quoi} : ${sep[0].c.lab()}, ${OU_COURT[sep[0].ech]}.`);
  else {
    out.push(`${cap(nb(sep.length))} conditions distinguent ${quoi} : ${liste(sep.map((r) => r.c.lab()))}.`);
    const rang = { favorable: 0, reserve: 1, mismatch: 2, incompatible: 3 };
    const sens = new Set(sep.map((r) => Math.sign(rang[r.a.issue] - rang[r.b.issue])));
    out.push(sens.size > 1 ? "Les compromis ne vont pas dans le même sens." : "Les écarts vont tous dans le même sens.");
  }
  return out;
}

    </header>
    ${hc ? `<div class="reserve"><p>Mettre les analyses à jour pour les comparer.</p><p class="dense">${esc(liste(vieux.map(nomLieu)))} ${vieux.length > 1 ? "ont été analysés" : "a été analysé"} quand votre limite de gare était de ${REV.r1.gare} min. Tant que ${vieux.length > 1 ? "leurs analyses ne sont pas" : "son analyse n'est pas"} à jour, un écart comme un accord pourrait tenir à ce changement plutôt qu'aux lieux.</p>

    ${!hc ? sec("Ce qui les distingue", "t-dist", dist.length ? tete + dist.map((r) => htmlRang(r, pa, pb)).join("") : `<p class="vide-msg">Rien d'établi ne les distingue.</p>`) : ""}

// FAIRE LE POINT. Trois questions, quelques phrases, une source d'actions commune avec l'accueil.
// Le détail (énoncés numérotés et leurs fondements) reste à un geste.

function pointCourt(ct) {
  const n = ct.cands.length;
  const ou = [], hesite = [];
  const lien = (arg, t) => `<button class="lien-p" data-act="go" data-arg="${esc(arg)}">${t}</button>`;
  const L = (p) => lien(`fiche:${p.id}`, esc(nomLieu(p)));
  if (n === 1) ou.push(`Un lieu dans votre recherche : ${L(ct.cands[0].p)}.`);
  else {
    const enCourse = ct.cands.filter((c) => c.p.etat === "en_course").map((c) => c.p);
    ou.push(`${cap(nb(n, false))} lieux en jeu${enCourse.length ? `, dont ${enCourse.length > 1 ? `${nb(enCourse.length, false)} en course (${liste(enCourse.map(L))})` : `un en course, ${L(enCourse[0])}`}` : ""}${ct.ecartees.length ? ` ; ${ct.ecartees.length > 1 ? `${nb(ct.ecartees.length, false)} écartés` : "un écarté"}` : ""}.`);
  }
  for (const c of ct.cands.filter((c) => c.bloq.length)) hesite.push({ t: `${L(c.p)} ne tient pas votre condition « ${c.bloq[0].lab()} ». Rien ne compense ce point.`, reg: "incompatibilite" });
  if (n === 1) {
    const p = ct.cands[0].p;
    const faibles = CRITERES.map((k) => ({ k, r: lirePlusFin(p, k.cle) })).filter((x) => x.r.issue === "reserve" || x.r.issue === "mismatch");
    if (faibles.length) hesite.push({ t: `${faibles.length > 1 ? `${cap(nb(faibles.length, false))} points ne correspondent` : "Un point ne correspond"} pas pleinement à votre Projet : ${liste(faibles.map((x) => `${lien(`fiche:${p.id}:${x.k.cle}`, x.k.lab())} (${motDe(x.r)}, ${OU_COURT[x.r.ech]})`))}.` });
  } else if (n === 2) {
    const [a, b] = ct.cands.map((c) => c.p);
    const rangs = rangsPaire(a, b);
    const e = entreeComparaison(a, b, rangs);
    const sep = [...new Map(rangs.filter((r) => r.cl === "separe").map((r) => [r.c.cle, r])).values()];
    if (!ct.cands.some((c) => c.bloq.length)) hesite.push({ t: e.map((t) => t.replace(/(une gare à moins de \d+ min|des nuits fraîches l'été|le calme|une vie de quartier|un médecin disponible|la mer à moins de 15 km)/g, (m) => { const r = sep.find((x) => x.c.lab() === m); return r ? lien(`paire:${a.id},${b.id}:${r.c.cle}:${r.ech}`, m) : m; })).join(" ") + (rangs.some((r) => r.cl === "hors_cadre") ? ` ${lien("cadre", "Mettre les analyses à jour")}.` : "") });
  } else {
    const hcs = ct.cands.filter((c) => c.horsCadre).map((c) => c.p);
    if (hcs.length) hesite.push({ t: `${liste(hcs.map(L))} ${hcs.length > 1 ? "ne peuvent" : "ne peut"} pas encore être comparé${hcs.length > 1 ? "s" : ""} de façon fiable aux autres : votre Projet a changé depuis ${hcs.length > 1 ? "leur" : "son"} analyse.` });
    const comp = ct.comparables.map((c) => c.p);
    const paires = [];
    for (const type of ["bien", "commune"]) { const xs = comp.filter((p) => p.type === type && (type === "commune" || p.adr)); if (xs.length >= 2) paires.push([xs[0], xs[1]]); }
    if (paires.length) hesite.push({ t: `Vous pouvez comparer de façon fiable ${paires.map(([x, y]) => lien(`paire:${x.id},${y.id}`, `${esc(nomLieu(x))} et ${esc(nomLieu(y))}`)).join(", ou ")}.` });
    const partiels = ct.cands.filter((c) => c.lecture === "apercu" || c.lecture === "sans_adresse" || c.lecture === "piste");
    if (partiels.length) hesite.push({ t: `Lecture encore partielle : ${liste(partiels.map((c) => `${L(c.p)} (${c.lecture === "apercu" ? "aperçu gratuit" : c.lecture === "sans_adresse" ? "adresse inconnue" : "pas encore analysé"})`))}.` });
  }
  for (const p of ct.ecartees.filter((p) => p.ecart?.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare")) hesite.push({ t: `${L(p)} avait été écartée pour la gare, quand votre limite était de ${REV[p.ecart.rev].gare} min ; elle est aujourd'hui de ${gareMax()} min.` });
  const ev = evenementsDepuis();

  return { ou, hesite, depuis };
}
function vuePoint() {

  const atlas = `<ul class="atlas" aria-label="Les lieux en jeu, dans l'ordre où vous les avez ajoutés">${ct.cands.map((c) => `<li><button class="atlas-b" data-act="go" data-arg="fiche:${c.p.id}" data-fk="atlas-${c.p.id}">${emblemeLieu(c.p, 56)}<span class="a-nom">${esc(nomLieu(c.p))}</span><span class="a-etat ${c.horsCadre ? "pointille" : ""}">${esc(aJour(c))}</span></button></li>`).join("")}${ct.ecartees.map((p) => `<li class="atlas-ecarte"><button class="atlas-b" data-act="go" data-arg="fiche:${p.id}">${emblemeLieu(p, 56)}<span class="a-nom">${esc(nomLieu(p))}</span><span class="a-etat">écarté le ${dc(p.ecart.date)}</span></button></li>`).join("")}</ul>`;
  return `<div class="arrive">
    ${htmlFil("Faire le point")}
    <section class="plaque point-plaque" aria-labelledby="titre-vue">
      <p class="marge pp-tete">Relevé de votre recherche · ${dc(AUJ)}</p>
      <h1 class="titre" id="titre-vue" tabindex="-1">Où en est votre recherche</h1>
      ${atlas}
      <p class="nuance pp-legende">Dans l'ordre où vous les avez ajoutés. Les formes disent ce qui a été analysé : la commune (cercle), les abords (carré), le logement (losange) ; en pointillé, ce qui ne l'est pas. Elles ne disent rien de ce que vaut le lieu.</p>
      ${pc.depuis ? `<section class="point-bloc"><h2>Depuis votre dernière visite</h2><div class="phrases"><p>${pc.depuis}</p></div></section>` : ""}
      <section class="point-bloc"><h2>Où vous en êtes</h2><div class="phrases">${pc.ou.map((t) => `<p>${t}</p>`).join("")}</div></section>
      ${pc.hesite.length ? `<section class="point-bloc"><h2>${ct.cands.length > 1 ? "Ce qui peut vous faire hésiter" : "Ce qui pèse"}</h2><div class="phrases">${pc.hesite.map((x) => `<p class="${x.reg ? "signal" : ""}" ${x.reg ? `style="--t:var(--reg-${x.reg})"` : ""}>${x.t}</p>`).join("")}</div></section>` : ""}
      ${acts.length ? `<section class="point-bloc"><h2>Pour avancer</h2><div>${htmlActions(acts.slice(0, 4))}</div></section>` : ""}
      <section class="point-bloc"><h2>Ce que futur•e ne mesure pas</h2><div class="phrases"><p>Votre budget de 320 000 € : rien dans ce point n'en tient compte.${ct.obs.length ? ` Vos notes de visite non plus : elles restent les vôtres.` : ""}</p></div></section>

    <span class="var-marques" role="group" aria-label="Revue : marques de piste"><span class="marge">Marques</span>${["A", "B"].map((m) => `<button data-act="marques" data-arg="${m}" data-fk="marques-${m}" aria-pressed="${S.marques === m}">${m}</button>`).join("")}</span>
    <button class="lien petit autres" data-act="demo" data-fk="demo" aria-expanded="${S.menus.demo}">${t ? "Situation de test" : "Autres situations"} ▾</button>
    <div class="menu" ${S.menus.demo ? "" : "hidden"}><p class="nuance">Situations de test, pour éprouver l'interface. Tout est fictif.</p>${TESTS.map((x) => `<button data-act="parcours" data-arg="${x.cle}" aria-current="${S.situation === x.cle}">${x.lib}</button>`).join("")}<label><input type="checkbox" data-act="redige" ${S.menus.redige ? "checked" : ""}> Revue : montrer la version rédigée simulée dans « Faire le point »</label><p class="nuance">Marques de piste : A, pastilles colorées (V3.1) ; B, forme d'échelle à l'encre et trait de registre (Relevé strict).</p></div>`;
  void p;
}
const memo = { y: 0 };
function rendre() {
  const fk = document.activeElement?.dataset?.fk;
  rendreDemo();
  const v = S.vue === "rapport" ? vueRapport() : S.vue === "lieu" ? vueLieu() : S.vue === "comparer" ? vueComparer() : S.vue === "point" ? vuePoint() : vueRecherche();
  $("#vue").innerHTML = v;
  document.documentElement.dataset.marques = S.marques;
  document.querySelectorAll(".barre nav span").forEach((e) => e.toggleAttribute("aria-current", e.dataset.nav === (S.vue === "rapport" ? "dossiers" : "recherche")));
  // Ce qui reste affiché ne rejoue pas son arrivée à chaque geste.
  const cle = `${S.vue}|${S.lieu}|${S.paire}|${S.situation}`;
  if (cle === rendre.cle) document.querySelectorAll("#vue .arrive").forEach((e) => e.classList.remove("arrive"));
  rendre.cle = cle;
  if (fk) { const el = document.querySelector(`[data-fk="${CSS.escape(fk)}"]`); if (el) el.focus({ preventScroll: true }); }
}
function note(html, ms = 6000) {
  const n = $("#note");
  n.innerHTML = `<p>${html}</p><button class="lien petit" data-act="note-fermer">Fermer</button>`;
  n.hidden = false; clearTimeout(note.h); note.h = setTimeout(() => (n.hidden = true), ms);
}
function aller(vue, opts = {}) {
  if (S.vue === "recherche") memo.y = scrollY;
  const de = S.vue;
  S.retour = vue === "recherche" ? null : de === "point" ? "point" : de === "comparer" && vue === "lieu" ? "paire" : opts.garderRetour ? S.retour : null;
  S.vue = vue; S.ouvert = opts.ouvert ?? null; S.doc = null; S.choix = null;
  Object.assign(S.menus, { commun: false, toutes: false, pourquoi: false, ecarter: false, note: false, histoire: false, detail: false, ajout: false, offre: null });
  rendre();
  if (vue === "recherche") { scrollTo({ top: memo.y }); $("#titre-projet")?.focus({ preventScroll: true }); }
  else { scrollTo({ top: 0 }); $("#titre-vue")?.focus({ preventScroll: true }); }
  if (opts.cible) { const el = document.getElementById(opts.cible); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("eclaire"); setTimeout(() => el.classList.remove("eclaire"), 1600); } }
}
function chargerSituation(cle) {
  const s = SITUATIONS.find((x) => x.cle === cle);
  Object.assign(S, { situation: cle, ids: [...s.ids], derniere: s.derniere, obs: s.obs, nouveau: s.nouveau ?? null, vue: s.rapport ? "rapport" : "recherche", rapport: s.rapport ?? null, depuis: null, lieu: null, paire: [], choix: null, retour: null, lentille: null, cadre: false, ouvert: null, doc: null, etats: {}, ecartsLocaux: {}, connu: {} });
  S.cote = new Set(); S.verifs = new Set(); S.notes = [];
  S.menus = { ...S.menus, demo: false, projet: false, ajout: false, ecartees: false, faire: false, commun: false, toutes: false, detail: false, pourquoi: false, ecarter: false, note: false, histoire: false, offre: null };
  memo.y = 0;
}
// Un lien d'action ou d'énoncé ouvre exactement ce qu'il nomme.
function suivre(arg) {
  const [type, a, crit, ech] = arg.split(":");
  if (type === "point") return aller("point");
  if (type === "ajout") { S.menus.ajout = true; rendre(); $("#ajout-champ")?.focus(); return; }
  if (type === "cadre") { basculerCadre(); return rendre(); }
  if (type === "parcours") { chargerSituation(a); rendre(); scrollTo({ top: 0 }); note(a === "premier" ? `<span class="sim">démonstration</span> 12 rue des Sternes est analysé et rejoint votre recherche.` : `<span class="sim">démonstration</span> 5 allée des Goélands rejoint votre recherche. Vous pouvez maintenant comparer vos deux lieux.`); return; }
  // V3.2 : ajouter ENREGISTRE. Si la commune est déjà lue dans la recherche (par le dossier d'une autre
  // adresse), elle l'est aussi pour ce lieu : c'est le droit territorial existant (canAccessTerritory).
  if (type === "ajouter") {
    const q = POSS[a];
    const communeLue = q.type === "bien" && actives().some((x) => x.commune === q.commune && cAnalyse(x));
    S.ids = [...S.ids, a]; S.nouveau = a; S.connu[a] = communeLue ? "commune" : "enregistre"; S.menus.ajout = false;
    note(`${esc(nomLieu(P(a)))} est enregistré dans votre recherche. Rien n'a été analysé ni acheté.`);
    return rendre();
  }
  if (type === "fiche" || type === "verif") {
    S.lieu = a;
    const p = P(a);
    const c = crit || (type === "verif" ? CRITERES.find((k) => lirePlusFin(p, k.cle).issue === "to_confirm")?.cle : null);
    return aller("lieu", { ouvert: c ? `${a}:${c}` : null, cible: c ? `fait-${c}` : null });
  }
  if (type === "paire") {
    S.paire = a.split(",");
    if (crit) S.lentille = crit;
    return aller("comparer", { ouvert: crit ? `${ech}-${crit}` : null, cible: crit ? `rang-${ech}-${crit}` : null });
  }
}
function basculerCadre() {
  S.cadre = !S.cadre;
  note(S.cadre ? `<span class="sim">simulation</span> Analyses lues comme si elles avaient été mises à jour pour votre Projet actuel. Dans le produit, l'ancienne version resterait consultable ; ici, rien n'est produit.` : "Retour aux analyses d'origine.");
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) { if (S.menus.demo && !e.target.closest(".menu")) { S.menus.demo = false; rendreDemo(); } return; }
  const act = t.dataset.act, arg = t.dataset.arg;
  switch (act) {
    case "go": return suivre(arg);
    case "ouvrir": S.lieu = arg; return aller("lieu");
    case "pont": S.depuis = S.ids[0]; return aller("recherche");
    case "marques": S.marques = arg; break;
    case "offre": S.menus.offre = arg.split(":")[1]; rendre(); $("#offre")?.scrollIntoView({ block: "nearest" }); $("[data-fk='analyser']")?.focus({ preventScroll: true }); return;
    case "offre-fermer": S.menus.offre = null; break;
    case "apercu": { const id = arg.split(":")[0]; S.connu[id] = "apercu"; note(`<span class="sim">démonstration</span> L'aperçu gratuit de ${esc(COMMUNES[P(id).commune].nom)} lit une partie de vos conditions, à la commune. Rien n'est acheté.`); break; }
    case "adresse": note(`<span class="sim">démonstration</span> Dans le produit, vous saisiriez l'adresse exacte ; le lieu resterait enregistré tant qu'elle n'est pas analysée.`); return;
    case "analyser": {
      // Démonstration : l'analyse fictive est chargée, rien n'est acheté. Le parcours suit l'étape correspondante.
      delete S.connu[arg]; S.menus.offre = null;
      if (arg === "goelands" && S.situation === "premier") S.situation = "deuxieme";
      if (arg === "sternes" && S.situation === "vide") S.situation = "premier";
      note(`<span class="sim">démonstration</span> Analyse fictive chargée pour ${esc(nomLieu(P(arg)))}. Dans le produit : achat confirmé, puis analyse ; rien n'est acheté ici.`);
      break;
    }
    case "accueil": return aller("recherche");
    case "parcours": chargerSituation(arg); rendre(); scrollTo({ top: 0 }); return;
    case "choix": S.choix = Array.isArray(S.choix) ? null : []; break;
    case "choisir": S.choix = S.choix.includes(arg) ? S.choix.filter((x) => x !== arg) : S.choix.length < 2 ? [...S.choix, arg] : [S.choix[1], arg]; break;
    case "comparer-choix": if (S.choix?.length === 2) { S.paire = [...S.choix]; return aller("comparer"); } return;
    case "ouvrir-fait": S.ouvert = S.ouvert === arg ? null : arg; S.doc = null; break;
    case "doc": S.doc = S.doc === arg ? null : arg; break;
    case "verif": if (S.verifs.has(arg)) S.verifs.delete(arg); else S.verifs.add(arg); break;
    case "cadre": basculerCadre(); break;
    case "projet": case "ajout": case "ecartees": case "faire": case "commun": case "toutes": case "pourquoi": case "detail": case "note": case "ecarter": case "histoire": case "demo": S.menus[act] = !S.menus[act]; break;
    case "redige": S.menus.redige = t.checked; break;
    case "reprendre": S.etats[arg] = "a_considerer"; note(`${esc(P(arg).nom)} revient dans votre recherche.`); break;
    case "theme": { const r = document.documentElement; const sombre = r.dataset.theme ? r.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches; r.dataset.theme = sombre ? "light" : "dark"; try { localStorage.setItem("fut41-v31-theme", r.dataset.theme); } catch {} return; }
    case "note-fermer": $("#note").hidden = true; return;
    default: return;
  }
  rendre();
});
document.addEventListener("change", (e) => {
  if (e.target.id === "lentille") { S.lentille = e.target.value || null; rendre(); return; }
  if (e.target.id === "comparer-avec" && e.target.value) { S.paire = [e.target.dataset.pid, e.target.value]; aller("comparer"); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const d = new FormData(f); const pid = f.dataset.pid;
  if (f.dataset.form === "note") {
    S.notes.push({ pid, crit: d.get("crit"), date: AUJ, origine: "noté par vous", texte: String(d.get("texte")).trim() });
    S.menus.note = false; note("Note gardée. Elle ne modifie aucun résultat.");
  } else {
    const crit = d.get("crit"); const motif = String(d.get("motif") || "").trim();
    S.etats[pid] = "ecarte"; S.ecartsLocaux[pid] = { date: AUJ, rev: REV_COURANTE, critere: crit === "autre" ? null : crit, motif: motif ? `« ${motif} »` : crit === "autre" ? "Une autre raison." : `Raison : ${CRIT[crit].lab()}.` };
    S.menus.ecarter = false; note(`${esc(nomLieu(P(pid)))} est écarté. La raison est gardée.`);
  }
  rendre();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.menus.demo) { S.menus.demo = false; rendreDemo(); $("[data-fk='demo']").focus(); return; }
  if (Array.isArray(S.choix)) { S.choix = null; rendre(); return; }
  if (S.vue !== "recherche") $(".fil .lien:last-of-type")?.click();
});
try { const th = localStorage.getItem("fut41-v31-theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
const depart = new URLSearchParams(location.search).get("situation");
chargerSituation(SITUATIONS.some((s) => s.cle === depart) ? depart : "premier");
rendre();
</script>
