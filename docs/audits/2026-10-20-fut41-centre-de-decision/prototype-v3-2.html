<title>Ma recherche · futur•e · V3.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo sans axe de largeur : le même rendu que /fonts/Archivo-Variable.woff2 servi par le site (FUT-118, correctif du 20/10). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ════════════════════════════════════════════════════════════════════════════════════════════
   FUT-41 / FUT-22 · V3.2, CONTINUITÉ AVEC LE RELEVÉ. Prototype de revue, données fictives.
   Sur la base de la V3.1 : marge de preuve au premier niveau, emblème des trois échelles, surtitres
   numérotés, plaque pour « Faire le point », place du Projet selon la maturité, états de connaissance
   (enregistré, aperçu, analysé), variantes A / B des marques de piste, rapport reconstitué.
   Jetons repris de src/app/design-tokens.css tel que FUT-118 R0 le propose (PR #71, 17303dbd) :
   thème (--bg, --fg-*, --border-*), registres (--reg-*), Relevé (--r-*, rôles --r-t-*), mouvement
   FUT-75 (--m-*). Aucune valeur nouvelle. Archivo en largeur normale : aucun font-variation-settings.
   ════════════════════════════════════════════════════════════════════════════════════════════ */
:root {
  color-scheme: dark;
  --bg: #060812; --bg-deep: #0d1322; --bg-elev: rgba(255,255,255,0.03); --bg-elev-2: rgba(255,255,255,0.04); --bg-elev-3: rgba(255,255,255,0.06);
  --fg-hi: #f6f4ef; --fg-1: #e9ecf2; --fg-2: #c6cfdb; --fg-3: #9ba3b4; --fg-4: #788095; --ghost: #788095;
  --border-1: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.12); --border-hi: rgba(255,255,255,0.15);
  --orange: #E8823A; --orange-soft: #EEA36E;
  --reg-incompatibilite: #FF9AA4; --reg-alignement: #7BD3A5; --reg-compromis: #E8823A;
  --reg-ecart: #C2A5EB; --reg-non-su: #B8BFCC; --reg-controle: #82B4E8;
  --r-sur-marque: #060812;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #faf8f3; --bg-deep: #f2ede4; --bg-elev: rgba(26,29,40,0.025); --bg-elev-2: rgba(26,29,40,0.04); --bg-elev-3: rgba(26,29,40,0.06);
  --fg-hi: #1a1d28; --fg-1: #2b3040; --fg-2: #3d4456; --fg-3: #5b6373; --fg-4: #646c7f; --ghost: #646c7f;
  --border-1: rgba(26,29,40,0.08); --border-2: rgba(26,29,40,0.12); --border-hi: rgba(26,29,40,0.18);
  --reg-incompatibilite: #8F2E3A; --reg-alignement: #236844; --reg-compromis: #994000;
  --reg-ecart: #64428E; --reg-non-su: #505662; --reg-controle: #285B91;
  --r-sur-marque: #1a1d28;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #faf8f3; --bg-deep: #f2ede4; --bg-elev: rgba(26,29,40,0.025); --bg-elev-2: rgba(26,29,40,0.04); --bg-elev-3: rgba(26,29,40,0.06);
    --fg-hi: #1a1d28; --fg-1: #2b3040; --fg-2: #3d4456; --fg-3: #5b6373; --fg-4: #646c7f; --ghost: #646c7f;
    --border-1: rgba(26,29,40,0.08); --border-2: rgba(26,29,40,0.12); --border-hi: rgba(26,29,40,0.18);
    --reg-incompatibilite: #8F2E3A; --reg-alignement: #236844; --reg-compromis: #994000;
    --reg-ecart: #64428E; --reg-non-su: #505662; --reg-controle: #285B91;
    --r-sur-marque: #1a1d28;
  }
}
:root {
  --r-fond: var(--bg); --r-plaque: var(--bg-deep); --r-plaque-bord: var(--border-2);
  --r-encre: var(--fg-hi); --r-texte: var(--fg-2); --r-discret: var(--fg-3); --r-meta: var(--ghost);
  --r-filet: var(--border-1); --r-filet-fort: var(--border-2);
  --r-rayon: 3px; --r-marge: 232px; --r-gouttiere: 48px; --r-pas: 8px;
  --r-t-display: clamp(34px, 4.4vw, 58px); --r-t-verdict: clamp(27px, 3.6vw, 46px); --r-t-titre: clamp(23px, 2.5vw, 31px);
  --r-t-sous-titre: 17px; --r-t-chapo: 18px; --r-t-corps: 16px; --r-t-dense: 14.5px; --r-t-nuance: 13.5px;
  --r-t-surtitre: 13.5px; --r-t-etiquette: 12.5px; --r-t-numero: 11.5px; --r-t-marge: 12px; --r-t-marge-etroite: 13px;
  --m-pression: 90ms; --m-geste: 120ms; --m-bascule: 180ms; --m-etat: 240ms;
  --m-releve: cubic-bezier(0.2, 0.7, 0.2, 1); --m-sortie: cubic-bezier(0.4, 0, 1, 1);
  --f-sans: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-reduced-motion: reduce) {
  :root { --m-pression: 0ms; --m-geste: 0ms; --m-bascule: 0ms; --m-etat: 0ms; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
body { margin: 0; background: var(--r-fond); color: var(--r-texte); font-family: var(--f-sans); font-size: var(--r-t-corps); line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--r-encre); outline-offset: 2px; }
/* Un titre qui reçoit le focus après une navigation n'est pas une commande : pas de contour. */
[tabindex="-1"]:focus { outline: none; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; color: var(--r-encre); text-wrap: balance; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app { max-width: 1100px; margin: 0 auto; padding: 0 20px 96px; }
@media (min-width: 640px) { .app { padding: 0 28px 120px; } }

/* ── Rôles du Relevé (DESIGN.md v3.0 § 9.1), en largeur normale ─────────────────────────── */
.display { font-weight: 500; font-size: var(--r-t-display); line-height: 1.04; letter-spacing: -0.02em; }
.titre { font-weight: 600; font-size: var(--r-t-titre); line-height: 1.15; letter-spacing: -0.012em; }
.sous-titre { font-weight: 600; font-size: var(--r-t-sous-titre); line-height: 1.35; color: var(--r-encre); }
.chapo { font-size: var(--r-t-chapo); line-height: 1.55; color: var(--r-texte); }
.dense { font-size: var(--r-t-dense); line-height: 1.58; }
.nuance { font-size: var(--r-t-nuance); line-height: 1.55; color: var(--r-discret); }
.surtitre { font-weight: 600; font-size: var(--r-t-surtitre); letter-spacing: 0.01em; color: var(--r-discret); display: flex; gap: 10px; align-items: baseline; }
.surtitre .num { font-family: var(--f-mono); font-weight: 500; font-size: var(--r-t-numero); color: var(--r-meta); }
.etiquette { font-weight: 600; font-size: var(--r-t-etiquette); letter-spacing: 0.01em; color: var(--r-discret); }
.marge { font-family: var(--f-mono); font-size: var(--r-t-marge); line-height: 1.5; color: var(--r-discret); }
@media (max-width: 899px) { .marge { font-size: var(--r-t-marge-etroite); } }
.encre { color: var(--r-encre); }

/* ── Boutons : marque (une action principale dans le champ visuel), trait, lien ─────────── */
.bouton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--r-rayon); border: 1px solid var(--r-filet-fort); background: transparent; color: var(--r-encre); font-weight: 600; font-size: 15px; line-height: 1.25; text-align: left; transition: border-color var(--m-geste) var(--m-releve), background-color var(--m-geste) var(--m-releve), transform var(--m-pression) var(--m-releve); }
.bouton:hover { border-color: var(--r-encre); }
.bouton:active { transform: translateY(1px); }
.bouton[disabled] { opacity: 0.45; cursor: not-allowed; }
.boutonMarque { background: var(--orange); border-color: var(--orange); color: var(--r-sur-marque); }
.boutonMarque:hover { background: var(--orange-soft); border-color: var(--orange-soft); }
.lien { border: 0; padding: 6px 0; min-height: 40px; background: none; color: var(--r-encre); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--r-filet-fort); text-decoration-thickness: 1px; font-weight: 600; font-size: 15px; text-align: left; transition: text-decoration-color var(--m-geste) var(--m-releve); }
.lien:hover { text-decoration-color: var(--r-encre); }
.lien.petit { font-size: 14px; font-weight: 500; color: var(--r-texte); }
.dans-texte { display: inline; min-height: 0; padding: 0; font-size: inherit; line-height: inherit; font-weight: 600; }
.sim { font-family: var(--f-mono); font-weight: 400; font-size: 11.5px; color: var(--r-meta); border: 1px dashed var(--r-filet-fort); border-radius: 2px; padding: 1px 5px; white-space: nowrap; }
.depliant { display: inline-flex; align-items: baseline; gap: 10px; background: none; border: 0; padding: 10px 0; min-height: 44px; color: var(--r-encre); font-weight: 600; font-size: 15px; text-align: left; }
.depliant .pm { font-family: var(--f-mono); font-weight: 500; color: var(--r-discret); width: 10px; flex: none; }
.depliant:hover > span:not(.pm) { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--r-filet-fort); }

/* ── Barres : produit, puis démonstration ──────────────────────────────────────────────── */
.barre { display: flex; align-items: center; gap: 22px; min-height: 64px; }
.marque-mot { font-weight: 600; font-size: 21px; letter-spacing: -0.01em; color: var(--r-encre); }
.marque-mot b { color: var(--orange); font-weight: 600; }
.barre nav { display: flex; gap: 18px; }
.barre nav span { font-size: 14.5px; color: var(--r-discret); }
.barre nav span[aria-current] { color: var(--r-encre); font-weight: 600; box-shadow: inset 0 -2px 0 var(--r-encre); padding-bottom: 4px; }
.icone-btn { margin-left: auto; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--r-filet-fort); border-radius: 50%; background: none; color: var(--r-encre); }
@media (max-width: 639px) { .barre nav { display: none; } }
.demo { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border: 1px dashed var(--r-filet-fort); border-radius: var(--r-rayon); font-size: 13px; color: var(--r-discret); }
.demo .marge { white-space: nowrap; }
.etapes { display: flex; gap: 4px; flex-wrap: wrap; }
.etapes button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 6px; min-height: 36px; font-size: 13px; color: var(--r-discret); transition: color var(--m-geste) var(--m-releve), border-color var(--m-bascule) var(--m-releve); }
.etapes button .marge { margin-right: 5px; }
.etapes button[aria-current="true"] { color: var(--r-encre); border-bottom-color: var(--r-encre); font-weight: 600; }
.demo .autres { margin-left: auto; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; width: min(380px, calc(100vw - 40px)); background: var(--r-plaque); border: 1px solid var(--r-plaque-bord); border-radius: var(--r-rayon); padding: 8px; display: grid; gap: 2px; }
.menu[hidden] { display: none; }
.menu > p { padding: 6px 8px 8px; }
.menu button { text-align: left; background: none; border: 0; border-radius: 2px; padding: 10px; font-size: 14.5px; color: var(--r-encre); min-height: 40px; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--bg-elev-3); }
.menu label { display: flex; gap: 10px; align-items: center; padding: 10px; font-size: 14px; border-top: 1px solid var(--r-filet); margin-top: 6px; }
@media (max-width: 639px) { .demo .titre-demo { display: none; } .etapes button .long { display: none; } }

/* ── Mouvement : l'arrivée d'une vue, fondu et flou de 2 px, sans déplacement (FUT-75, état) ── */
.arrive { animation: arrive var(--m-bascule) var(--m-releve) both; }
@keyframes arrive { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }
@media (prefers-reduced-motion: reduce) { .arrive { animation: none; } }

/* ── Rythme : un mouvement = 56 px et un filet ─────────────────────────────────────────── */
.mouvement { padding: 48px 0 56px; border-top: 1px solid var(--r-filet); }
.mouvement:first-child { border-top: 0; }
@media (max-width: 639px) { .mouvement { padding: 36px 0; } }
.tete-mvt { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 28px; }

/* ── L'en-tête de la recherche ─────────────────────────────────────────────────────────── */
.ouverture { padding: 44px 0 48px; display: grid; gap: 18px; }
.ouverture .display { max-width: none; }
.projet-ligne { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 15px; color: var(--r-discret); }
.projet-ligne .lien { font-size: 15px; }
.lead { display: grid; gap: 22px; margin-top: 18px; padding-top: 26px; border-top: 1px solid var(--r-filet); }
@media (min-width: 900px) { .lead { grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 22px 56px; } }
.lead .chapo { font-size: clamp(18px, 1.7vw, 21px); color: var(--r-encre); line-height: 1.5; }
.lead .chapo + .chapo { margin-top: 8px; font-size: 17px; color: var(--r-texte); }
.gestes { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.signal { display: flex; gap: 12px; }
.signal::before { content: ""; flex: none; width: 3px; height: 1em; transform: translateY(0.22em); background: var(--t); }
@media (max-width: 639px) {
  .ouverture { padding: 28px 0 32px; gap: 14px; }
  .ouverture .display { font-size: 27px; line-height: 1.12; }
  .lead { margin-top: 10px; padding-top: 18px; gap: 16px; }
  .lead .chapo { font-size: 17px; }
  .lead .chapo + .chapo { display: none; }
  .gestes .boutonMarque { width: 100%; }
  .gestes { gap: 4px 20px; }
  .projet-ligne .long { display: none; }
  .ouverture + .mouvement { padding-top: 26px; }
  .tete-mvt { margin-bottom: 14px; gap: 8px 16px; align-items: center; }
  .tete-mvt .titre { font-size: 22px; }
  .outils-lieux label { display: none; }
  .selecteur { min-height: 40px; font-size: 14px; }
}

/* ── Le Projet déplié ──────────────────────────────────────────────────────────────────── */
.projet-panneau { margin-top: 8px; padding: 26px 0 4px; border-top: 1px solid var(--r-filet); display: grid; gap: 22px; }
@media (min-width: 900px) { .projet-panneau { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; } }
.projet-panneau h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
.projet-panneau li { padding: 6px 0; border-top: 1px solid var(--r-filet); font-size: 15px; color: var(--r-encre); display: flex; justify-content: space-between; gap: 12px; }
.projet-panneau li span { color: var(--r-discret); font-size: 13.5px; white-space: nowrap; }

/* ── Les lieux ─────────────────────────────────────────────────────────────────────────── */
.outils-lieux { display: flex; align-items: center; gap: 10px; }
.outils-lieux label { font-size: 14px; color: var(--r-discret); }
.selecteur { min-height: 40px; padding: 6px 34px 6px 12px; border: 1px solid var(--r-filet-fort); border-radius: var(--r-rayon); background: var(--r-fond); color: var(--r-encre); font-size: 14.5px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--r-discret) 50%), linear-gradient(135deg, var(--r-discret) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.lieux { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 0 40px; }
@media (max-width: 639px) { .lieux { grid-template-columns: 1fr; } }
.tuile { position: relative; border-top: 1px solid var(--r-filet-fort); transition: border-color var(--m-geste) var(--m-releve); }
.tuile:hover, .tuile.choisie { border-top-color: var(--r-encre); }
.tuile.choisie { box-shadow: inset 0 2px 0 var(--r-encre); }
.tuile-b { width: 100%; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 16px; align-items: start; text-align: left; background: none; border: 0; padding: 20px 0 30px; min-height: 100%; color: inherit; }
.t-emb { padding-top: 4px; }
.t-txt { display: grid; gap: 6px; align-content: start; min-width: 0; }
.emb { display: block; overflow: visible; }
.t-haut { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.t-commune { font-weight: 600; font-size: 14px; color: var(--r-discret); }
.t-etat { font-size: 13px; color: var(--r-discret); white-space: nowrap; }
.t-etat.course { color: var(--r-encre); font-weight: 600; }
.t-nom { font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; color: var(--r-encre); margin-top: 2px; }
.t-type { font-size: 15px; color: var(--r-texte); }
.t-bas { display: grid; gap: 6px; margin-top: 14px; }
.t-prof { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--r-discret); }
.t-att { display: flex; gap: 9px; align-items: baseline; font-size: 14.5px; color: var(--r-encre); }
.t-att::before { content: ""; flex: none; width: 3px; height: 0.95em; transform: translateY(0.12em); background: var(--t, var(--r-meta)); }
.t-att.neutre::before { width: 0; border-left: 2px dashed var(--r-meta); background: none; }
/* Le choix se dit par un mot et le filet d'encre, jamais par un carré : la forme est réservée aux abords. */
.lieux-deux .t-nom { font-size: 26px; }
.coche { position: absolute; top: 16px; right: 0; padding: 2px 8px; border: 1px solid var(--r-filet-fort); border-radius: var(--r-rayon); font-size: 13px; font-weight: 600; color: var(--r-discret); pointer-events: none; transition: color var(--m-geste) var(--m-releve), background-color var(--m-geste) var(--m-releve), border-color var(--m-geste) var(--m-releve); }
.choisie .coche { background: var(--r-encre); border-color: var(--r-encre); color: var(--r-fond); }
.en-choix .t-etat { display: none; }
.nouveau-mot { font-family: var(--f-mono); font-size: 12px; color: var(--r-encre); border: 1px solid var(--r-filet-fort); border-radius: 2px; padding: 1px 6px; margin-right: 8px; }
.tuile.nouveau { border-top-color: var(--r-encre); }
.tuile-ajout .tuile-b { color: var(--r-discret); }
.tuile-ajout .t-nom { color: var(--r-discret); font-weight: 500; }
.tuile-ajout { border-top-style: dashed; }
.tuile-ajout:hover .t-nom { color: var(--r-encre); }
.prof-svg { display: inline-flex; gap: 3px; }
.prof-svg svg { overflow: visible; }
.ecartees-l { margin-top: 18px; }
@media (max-width: 639px) {
  .tuile-b { padding: 16px 0 22px; grid-template-columns: 38px minmax(0, 1fr); gap: 0 12px; }
  .t-emb svg { width: 38px; height: 38px; }
  .lieux-deux .t-nom { font-size: 21px; }
  .t-nom { font-size: 19px; }
  .t-bas { margin-top: 8px; }
}

/* ── Le premier lieu, mis en avant ─────────────────────────────────────────────────────── */
.vedette { border-top: 1px solid var(--r-encre); padding-top: 22px; display: grid; gap: 28px; }
@media (min-width: 900px) { .vedette { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; } }
.vedette .tuile-b { padding: 0; }
.vedette .tuile { border-top: 0; }
.retenir-cols { display: grid; gap: 22px; }
@media (min-width: 640px) { .retenir-cols { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); } }
.retenir-cols h3 { font-size: 14px; font-weight: 600; display: flex; gap: 9px; align-items: baseline; margin-bottom: 8px; }
.retenir-cols h3::before { content: ""; width: 3px; height: 0.95em; transform: translateY(0.12em); background: var(--t); }
.retenir-cols li { font-size: 15px; color: var(--r-encre); padding: 3px 0; }
.retenir-cols li span { display: block; font-size: 13px; color: var(--r-discret); }

/* ── À faire ───────────────────────────────────────────────────────────────────────────── */
.a-faire { display: grid; counter-reset: af; }
.a-faire li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 14px; padding: 18px 0; border-top: 1px solid var(--r-filet); }
@media (min-width: 900px) { .a-faire li { grid-template-columns: 28px minmax(0, 1fr) auto; align-items: baseline; } }
.a-faire li::before { counter-increment: af; content: counter(af); font-family: var(--f-mono); font-size: var(--r-t-numero); color: var(--r-meta); padding-top: 4px; }
.a-faire p { font-size: 17px; color: var(--r-encre); line-height: 1.45; }
.a-faire .pourquoi { font-size: 14px; color: var(--r-discret); margin-top: 2px; }
.a-faire .lien { grid-column: 2; }
@media (min-width: 900px) { .a-faire .lien { grid-column: 3; } }

/* ── La barre de choix (comparer deux lieux) ───────────────────────────────────────────── */
.barre-choix { position: sticky; bottom: 0; z-index: 20; margin: 0 -20px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--r-plaque); border-top: 1px solid var(--r-filet-fort); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
@media (min-width: 640px) { .barre-choix { margin: 0 -28px; padding: 14px 28px; } }
.barre-choix p { font-size: 15px; color: var(--r-encre); margin-right: auto; }
.barre-choix .marge { margin-left: 8px; }

/* ── Fil de retour ─────────────────────────────────────────────────────────────────────── */
.fil { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 22px 0 0; font-size: 14.5px; color: var(--r-discret); }
.fil .lien { font-size: 14.5px; font-weight: 500; min-height: 40px; }
.fil .sep { color: var(--r-meta); }
.fil [aria-current] { color: var(--r-encre); }
.tete-vue { padding: 40px 0 48px; display: grid; gap: 14px; }
@media (max-width: 639px) { .tete-vue { padding: 22px 0 30px; } .tete-vue .display { font-size: 30px; line-height: 1.1; } }

/* ── Un fait : énoncé, pourquoi, documentation (trois niveaux) ─────────────────────────── */
.groupe-f { display: grid; gap: 0; }
.groupe-f + .groupe-f { margin-top: 40px; }
.groupe-f > h3 { font-size: 15px; font-weight: 600; color: var(--r-discret); display: flex; gap: 10px; align-items: baseline; padding-bottom: 10px; }
.groupe-f > h3::before { content: ""; width: 3px; height: 0.95em; transform: translateY(0.12em); background: var(--t); }
/* V3.2 · Une ligne de relevé : le fait à gauche, sa marge de preuve à droite dès 900 px (texte 1fr,
   marge 232, gouttière 48 : la grille du Relevé). Sous 900 px, la marge passe dessous, en une ligne. */
.fait { border-top: 1px solid var(--r-filet); display: grid; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .fait { grid-template-columns: minmax(0, 1fr) var(--r-marge); column-gap: var(--r-gouttiere); } .fait > .niveau2 { grid-column: 1 / -1; } }
.f-ligne > button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; align-items: baseline; text-align: left; background: none; border: 0; padding: 16px 0 10px; min-height: 56px; transition: background-color var(--m-geste) var(--m-releve); }
.f-ligne > button:hover .f-sujet { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--r-filet-fort); }
.f-sujet { font-size: var(--r-t-sous-titre); font-weight: 600; color: var(--r-encre); }
.f-dit { grid-column: 1 / -1; font-size: 15.5px; color: var(--r-texte); }
.f-plus { font-family: var(--f-mono); color: var(--r-discret); }
.marge-p { font-family: var(--f-mono); font-size: var(--r-t-marge); line-height: 1.5; color: var(--r-discret); display: grid; gap: 4px; align-content: start; padding: 18px 0 14px; }
@media (min-width: 900px) { .marge-p { border-left: 1px solid var(--r-filet); padding-left: 16px; } }
@media (max-width: 899px) { .marge-p { display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 0 0 14px; font-size: var(--r-t-marge-etroite); } }
.ml { display: inline-flex; gap: 7px; align-items: baseline; }
.ml .g { transform: translateY(1px); color: var(--r-discret); }
.ml-k { color: var(--r-meta); }
.ml-note { color: var(--r-texte); }
.legende { flex-basis: 100%; }
/* La règle de rang du rapport (RegleDeRang) : des repères, un trait, la position, sans teinte. */
.regle-rang { margin: 2px 0 12px; max-width: 360px; }
.regle-rang svg { width: 100%; height: 10px; display: block; overflow: visible; }
.regle-rang .ra { stroke: var(--r-filet-fort); stroke-width: 1; vector-effect: non-scaling-stroke; }
.regle-rang .rt { stroke: var(--r-discret); stroke-width: 1; vector-effect: non-scaling-stroke; }
.regle-rang .rp { fill: var(--r-encre); }
.regle-rang figcaption { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 11px; color: var(--r-meta); margin-top: 4px; }
.niveau2 { display: grid; gap: 18px; padding: 4px 0 26px; }
@media (min-width: 900px) { .niveau2 { grid-template-columns: minmax(0, 1fr) var(--r-marge); gap: 18px var(--r-gouttiere); } }
.niveau2 .bloc { display: grid; gap: 4px; }
.niveau2 .bloc .etiquette { display: block; }
.niveau2 .bloc p { font-size: 15.5px; color: var(--r-encre); }
.niveau2 .cote-g { display: grid; gap: 18px; }
.doc { font-family: var(--f-mono); font-size: var(--r-t-marge); line-height: 1.6; color: var(--r-discret); display: grid; gap: 2px; align-content: start; }
@media (max-width: 899px) { .doc { font-size: var(--r-t-marge-etroite); border-top: 1px dashed var(--r-filet-fort); padding-top: 12px; } }
.doc b { font-weight: 500; color: var(--r-texte); }
.verif { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--r-filet-fort); border-radius: var(--r-rayon); }
.verif .etiquette { display: flex; gap: 8px; align-items: baseline; color: var(--r-encre); }
.verif .etiquette::before { content: ""; width: 3px; height: 0.95em; transform: translateY(0.12em); background: var(--reg-controle); }
.note-perso { display: grid; gap: 3px; padding: 12px 0 12px 16px; border-left: 2px solid var(--r-filet-fort); }
.note-perso .marge { font-size: 12px; }
.note-perso p { font-size: 15.5px; color: var(--r-encre); }

/* ── L'emplacement d'une réserve (Projet changé, aperçu) ───────────────────────────────── */
/* V3.2 : le cadre pointillé est réservé à l'emplacement d'un tiers (Relevé § 4.2). Un état se dit par un
   filet, une phrase et un trait neutre : un changement de Projet n'est pas un jugement du lieu. */
.reserve { display: grid; gap: 12px; padding: 18px 0 0; border-top: 1px solid var(--r-filet-fort); }
.reserve > p:first-child { font-size: 17px; color: var(--r-encre); font-weight: 600; display: flex; gap: 12px; }
.reserve > p:first-child::before { content: ""; flex: none; width: 3px; height: 1em; transform: translateY(0.2em); background: var(--r-meta); }
.reserve .gestes { gap: 8px 20px; }
.reserve.bloq > p:first-child::before { background: var(--reg-incompatibilite); }

/* ── Analysé à trois échelles ──────────────────────────────────────────────────────────── */
.echelles { display: grid; }
.echelles li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--r-filet); font-size: 15.5px; color: var(--r-encre); }
.echelles li span:last-child { font-size: 13.5px; color: var(--r-discret); }
.g { display: inline-block; vertical-align: -1px; flex: none; }

/* ── Formulaires ───────────────────────────────────────────────────────────────────────── */
.form { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--r-filet-fort); border-radius: var(--r-rayon); max-width: 620px; }
.form label { font-size: 14px; font-weight: 600; color: var(--r-encre); }
.form select, .form textarea, .form input { width: 100%; background: var(--r-fond); border: 1px solid var(--r-filet-fort); border-radius: var(--r-rayon); padding: 10px 12px; min-height: 44px; }
.form textarea { min-height: 84px; resize: vertical; }
.form .nuance { margin-top: -2px; }

/* ── La comparaison ────────────────────────────────────────────────────────────────────── */
.poles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.pole { display: grid; gap: 4px; align-content: start; }
.pole:last-child { text-align: right; }
.pole .t-commune { font-size: 14px; }
.pole h1, .pole h2 { font-size: clamp(22px, 2.8vw, 36px); font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.pole h1:focus { outline: none; }
.entete-pistes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--r-discret); }
.entete-pistes span:last-child { text-align: right; }
@media (min-width: 760px) { .entete-pistes { margin-left: 236px; } }
.rang { display: grid; gap: 2px; padding: 16px 0 10px; border-top: 1px solid var(--r-filet); scroll-margin-top: 90px; }
@media (min-width: 760px) { .rang { grid-template-columns: 212px minmax(0, 1fr); gap: 24px; align-items: start; } }
.rang.focus { background: var(--bg-elev-2); box-shadow: -12px 0 0 var(--bg-elev-2), 12px 0 0 var(--bg-elev-2); }
.rang-lab .c { font-size: 16px; font-weight: 600; color: var(--r-encre); line-height: 1.3; display: block; }
.rang-lab .k { font-size: 13.5px; color: var(--r-discret); }
.piste { position: relative; height: 64px; width: 100%; background: none; border: 0; padding: 0; display: block; border-radius: 2px; transition: background-color var(--m-geste) var(--m-releve); }
.piste:hover { background: var(--bg-elev); }
.piste .pl { position: absolute; top: 14px; height: 0; border-top: 1.5px solid var(--r-encre); }
.piste .pl.points { border-top: 2px dotted var(--reg-controle); }
.piste .mk { position: absolute; top: 4px; width: 20px; height: 20px; margin-left: -10px; }
.piste .mk svg { display: block; overflow: visible; }
.piste .tx { position: absolute; top: 32px; font-size: 14px; line-height: 1.3; color: var(--r-texte); max-width: 44%; }
.piste .tx.ga { left: 0; } .piste .tx.dr { right: 0; text-align: right; }
.piste .tx.ce { left: 50%; transform: translateX(-50%); text-align: center; color: var(--r-discret); max-width: 46%; }
.piste .coupure { position: absolute; top: 6px; left: 50%; width: 14px; height: 17px; margin-left: -7px; }
.piste .coupure::before, .piste .coupure::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--r-encre); transform: skewX(-20deg); }
.piste .coupure::before { left: 3px; } .piste .coupure::after { right: 3px; }
.preuves { display: grid; gap: 18px; padding: 10px 0 18px; }
@media (min-width: 640px) { .preuves { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; } }
.preuve { display: grid; gap: 6px; align-content: start; }
.preuve .etiquette { display: block; }
.preuve p { font-size: 15.5px; color: var(--r-encre); }
.sans-l li { display: grid; gap: 2px 18px; padding: 14px 0; border-top: 1px solid var(--r-filet); }
@media (min-width: 760px) { .sans-l li { grid-template-columns: 212px minmax(0, 1fr) auto; align-items: baseline; } }
.sans-l b { font-weight: 600; color: var(--r-encre); display: flex; gap: 9px; align-items: baseline; }
.sans-l b::before { content: ""; flex: none; width: 3px; height: 0.95em; transform: translateY(0.12em); background: var(--t, var(--r-meta)); }
.sans-l span { font-size: 15px; color: var(--r-texte); }
.resume { font-size: 15.5px; color: var(--r-texte); padding: 6px 0 4px; }
.vide-msg { font-size: 15.5px; color: var(--r-discret); padding: 14px 0; border-top: 1px solid var(--r-filet); }

/* ── Faire le point ────────────────────────────────────────────────────────────────────── */
.point-bloc { display: grid; gap: 14px; padding: 36px 0; border-top: 1px solid var(--r-filet); }
@media (min-width: 900px) { .point-bloc { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; } }
.point-bloc h2 { font-size: 16px; font-weight: 600; color: var(--r-discret); padding-top: 4px; }
.point-bloc .phrases { display: grid; gap: 14px; }
.point-bloc .phrases p { font-size: clamp(18px, 1.6vw, 20px); line-height: 1.5; color: var(--r-encre); }
.point-bloc .phrases p.signal::before { transform: translateY(0.3em); }
.enonces { display: grid; }
.enonce { display: grid; gap: 8px 32px; padding: 16px 0; border-top: 1px solid var(--r-filet); scroll-margin-top: 80px; transition: background-color var(--m-etat) var(--m-releve); }
@media (min-width: 900px) { .enonce { grid-template-columns: minmax(0, 1fr) var(--r-marge); } }
.enonce > p { font-size: 15.5px; line-height: 1.6; color: var(--r-texte); }
.enonce .num-e { font-family: var(--f-mono); font-size: var(--r-t-numero); color: var(--r-meta); margin-right: 8px; }
.ref { display: flex; gap: 6px; align-items: baseline; }
.ref-p { flex: none; width: 9px; height: 1px; background: var(--r-meta); transform: translateY(-3px); }
.eclaire { background: var(--bg-elev-3); }
.lien-p { display: inline; background: none; border: 0; padding: 0; color: var(--r-encre); font-weight: 600; text-decoration: underline; text-decoration-color: var(--r-filet-fort); text-underline-offset: 3px; text-decoration-thickness: 1px; text-align: left; font-size: inherit; line-height: inherit; }
.lien-p:hover { text-decoration-color: var(--r-encre); }
.redige-r { display: grid; gap: 14px; padding: 18px; border: 1px dashed var(--r-filet-fort); border-radius: var(--r-rayon); }
.redige-r p { font-size: 16.5px; line-height: 1.6; color: var(--r-encre); }
.appel { font-family: var(--f-mono); font-size: 11px; color: var(--r-discret); margin-left: 2px; }

/* ── Note d'état et pied ───────────────────────────────────────────────────────────────── */
.note { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 50; width: min(620px, calc(100vw - 24px)); background: var(--r-plaque); border: 1px solid var(--r-plaque-bord); border-radius: var(--r-rayon); padding: 12px 16px; display: flex; gap: 14px; align-items: flex-start; font-size: 14.5px; color: var(--r-texte); }
.note[hidden] { display: none; }
.note p { flex: 1; }
.pied { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--r-filet); }

/* ════════════════════════════════════════════════════════════════════════════════════════════
   V3.2 · CONTINUITÉ AVEC LE RELEVÉ
   ════════════════════════════════════════════════════════════════════════════════════════════ */
/* Le Projet selon la maturité : même ordre, d'autres tailles. */
.ouverture.deux { gap: 12px; }
.ouverture.deux .titre { font-size: clamp(25px, 2.7vw, 34px); font-weight: 500; }
.ouverture.riche { padding-top: 28px; gap: 14px; }
.projet-compact { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding-bottom: 14px; border-bottom: 1px solid var(--r-filet); }
.projet-compact .pc-txt { font-weight: 600; font-size: var(--r-t-sous-titre); color: var(--r-encre); }
.projet-compact .projet-ligne { font-size: 14px; }
.ouverture.riche .lead { margin-top: 4px; border-top: 0; padding-top: 6px; }
.ouverture.riche .lead .titre { font-weight: 500; font-size: clamp(24px, 2.6vw, 33px); line-height: 1.2; }
.ouverture.riche .lead .chapo { margin-top: 10px; font-size: 17px; color: var(--r-texte); }
.projet-def-l { max-width: none; }
.projet-def { grid-column: 1 / -1; font-size: 15px; color: var(--r-texte); }
@media (max-width: 639px) {
  .ouverture.deux .titre { font-size: 22px; }
  .ouverture.riche { padding-top: 18px; }
  .ouverture.riche .lead .titre { font-size: 21px; }
  .projet-compact .pc-txt { font-size: 15px; }
  .projet-def-l { display: none; }
}
/* La fiche d'un lieu : l'emblème du lieu en regard du titre, comme « D'où viennent ces constats ». */
.tete-lieu { display: grid; gap: 18px 40px; }
@media (min-width: 760px) { .tete-lieu { grid-template-columns: minmax(0, 1fr) auto; align-items: start; } }
.tl-txt { display: grid; gap: 12px; }
.tl-emb svg { width: 120px; height: 120px; }
@media (max-width: 759px) { .tl-emb { display: none; } }
.tl-gestes { grid-column: 1 / -1; margin-top: 4px; }
.echelles.connu li { grid-template-columns: 22px minmax(0, 1fr) auto; }
.echelles.connu li > span:nth-child(2) { display: grid; gap: 2px; }
.ec-etat { font-size: 13.5px; color: var(--r-discret); }
.echelles.connu .lien { min-height: 36px; padding: 2px 0; }
.offre { display: grid; gap: 10px; margin-top: 18px; padding: 18px 0 0; border-top: 1px solid var(--r-filet-fort); }
/* Variante B des marques : le registre passe au trait de 3 px devant le mot ; un non-établi, pointillé. */
/* Le trait suit le premier mot, même quand le libellé passe sur deux lignes (360 px). */
.piste .tx.trait::before { content: ""; display: inline-block; width: 3px; height: 0.95em; margin-right: 7px; vertical-align: -0.12em; background: var(--t, var(--r-meta)); }
.piste .tx.trait.neutre::before { width: 0; border-left: 2px dotted var(--r-discret); background: none; }
.piste .tx.ce.trait { color: var(--r-texte); }
:root[data-marques="B"] .piste .pl.points { border-top-color: var(--r-discret); }
.poles .emb { margin-bottom: 6px; }
.pole:last-child .emb { margin-left: auto; }
.pole .t-prof { font-size: 13px; color: var(--r-discret); }
.pole .t-prof { display: block; }
.rang-src { display: flex; margin-top: 4px; font-family: var(--f-mono); font-size: 12px; color: var(--r-meta); }
/* La plaque du Relevé : fond --bg-deep, filet, deux coins de coupe. Une par écran. */
.plaque { position: relative; background: var(--r-plaque); border: 1px solid var(--r-plaque-bord); border-radius: var(--r-rayon); padding: 28px 20px; }
@media (min-width: 640px) { .plaque { padding: 40px 44px; } }
.plaque::before, .plaque::after { content: ""; position: absolute; width: 14px; height: 14px; border-color: var(--r-discret); border-style: solid; pointer-events: none; }
.plaque::before { top: -7px; left: -7px; border-width: 1px 0 0 1px; }
.plaque::after { bottom: -7px; right: -7px; border-width: 0 1px 1px 0; }
.point-plaque { margin-top: 32px; display: grid; gap: 0; }
.pp-tete { margin-bottom: 10px; }
.point-plaque > .titre { margin-bottom: 28px; }
.point-plaque .point-bloc:first-of-type { margin-top: 8px; }
.point-plaque .point-bloc { padding: 26px 0; }
.pp-pied { padding-top: 18px; border-top: 1px solid var(--r-filet); }
.atlas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 22px; }
.atlas-b { width: 100%; display: grid; gap: 4px; justify-items: start; text-align: left; background: none; border: 0; padding: 8px 0; color: inherit; }
.atlas-b .emb { margin-bottom: 6px; }
.atlas-b:hover .a-nom { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--r-filet-fort); }
.a-nom { font-weight: 600; font-size: 15.5px; color: var(--r-encre); line-height: 1.3; }
.a-etat { font-size: 13px; color: var(--r-discret); line-height: 1.4; }
.a-etat.pointille { display: inline-flex; gap: 7px; }
.a-etat.pointille::before { content: ""; flex: none; border-left: 2px dotted var(--r-discret); height: 0.95em; transform: translateY(0.2em); }
.atlas-ecarte { opacity: 0.62; }
.pp-legende { margin: 12px 0 6px; }
@media (max-width: 639px) {
  .atlas { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
  .atlas-b .emb { width: 44px; height: 44px; }
  .point-plaque > .titre { margin-bottom: 18px; font-size: 24px; }
  .pp-legende { font-size: 12.5px; }
}
/* La démonstration : la continuité et la variante des marques. */
.continuite, .var-marques { display: inline-flex; align-items: center; gap: 4px; }
.continuite .marge, .var-marques .marge { margin-right: 4px; }
.continuite button, .var-marques button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 6px; min-height: 36px; font-size: 13px; color: var(--r-discret); }
.continuite button[aria-current="true"], .var-marques button[aria-pressed="true"] { color: var(--r-encre); border-bottom-color: var(--r-encre); font-weight: 600; }
@media (max-width: 639px) { .continuite .marge, .var-marques .marge { display: none; } .var-marques { display: none; } }
/* ── Le rapport reconstitué (grammaire du Relevé, FUT-91) ───────────────────────────────── */
.rv { padding-top: 22px; }
.rv-proto { padding: 8px 12px; border: 1px dashed var(--r-filet-fort); border-radius: var(--r-rayon); margin-bottom: 28px; }
.rv-fil { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; font-size: 13.5px; color: var(--r-discret); }
.rv-fil b { color: var(--r-encre); font-weight: 600; }
.rv-fil .ml { font-family: var(--f-mono); font-size: 12px; }
.rv-projet { font-size: 14px; color: var(--r-texte); margin: 10px 0 26px; }

const ETAB = new Set(["favorable", "reserve", "mismatch", "incompatible"]);
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const dc = (iso) => { const [, m, d] = iso.split("-"); return `${+d}${+d === 1 ? "er" : ""} ${MOIS[+m - 1]}`; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const $ = (s, r = document) => r.querySelector(s);
const mobile = () => matchMedia("(max-width: 639px)").matches;
const reduit = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

// Une possibilité, avec son état éventuellement modifié dans la session (écartée, reprise).
function P(id) {
  const p = POSS[id];
  return { id, ...p, etat: S.etats[id] ?? p.etat, ecart: S.ecartsLocaux[id] ?? p.ecart };
}
const actives = () => S.ids.map(P).filter((p) => p.etat !== "ecarte");
const ecartees = () => S.ids.map(P).filter((p) => p.etat === "ecarte");

// L'analyse telle qu'on la lit : figée, ou « mise au même cadre » (simulation, analyses en jeu seulement).
function lireAnalyse(cle, pid) {
  const a = ANALYSES[cle];
  if (!a) return null;
  const enJeu = !pid || P(pid).etat !== "ecarte";
  if (S.cadre && a.rev !== REV_COURANTE && enJeu) {
    return { ...a, rev: REV_COURANTE, moteur: "engine-6", date: AUJ, simule: true, i: { ...a.i, ...(a.apres ?? {}) } };
  }
  return a;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// V3.2 · TROIS ÉTATS DE CONNAISSANCE. Enregistré (rien n'est lu), aperçu (une partie de vos
// conditions, à la commune, gratuitement), analysé (dans le périmètre d'une analyse achetée).
// Un lieu ajouté dans la session part toujours « enregistré » : ajouter n'analyse rien.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function cAnalyse(p) {
  const k = S.connu[p.id];
  if (k === "enregistre" || k === "apercu") return null;
  return COMMUNES[p.commune].analyse ?? null;
}
function cLibre(p) {
  const k = S.connu[p.id];
  if (k === "apercu") return APERCU[p.commune] ?? null;
  if (k === "enregistre" || k === "commune") return null;
  return COMMUNES[p.commune].libre ?? null;
}
// L'adresse n'est analysée que si le lieu en a une ET que la session ne l'a pas seulement enregistrée.
const adrLue = (p) => p.type === "bien" && !!p.adr && !S.connu[p.id];
// Le mot d'état d'un lieu, partout le même : tuile, fiche, point.
function etatConnu(p) {
  const lib = cLibre(p), an = cAnalyse(p);
  if (lib) return "apercu";
  if (!an) return "enregistre";
  if (p.type === "commune") return "analyse";
  if (p.sansAdresse) return "sans_adresse";
  if (!adrLue(p)) return "adresse_enregistree";
  return "analyse";
}

// Ce qu'on sait d'une possibilité, pour un critère, à une échelle.
// issue : favorable | reserve | mismatch | incompatible | to_confirm | indeterminate
//         | piste (rien n'est lu) | non_lu (aperçu muet sur ce point)
//         | sans_adresse (annonce sans adresse) | adresse_non_examinee | commune_seule (une commune n'a pas d'abords)
function lire(p, critCle, ech) {
  if (ech === "territoire") {
    const lib = cLibre(p), an = cAnalyse(p);
    if (lib) { const v = lib[critCle]; return v ? { issue: v[0], valeur: v[1], source: v[2], libre: true } : { issue: "non_lu", libre: true }; }
    if (!an) return { issue: "piste" };
    const a = lireAnalyse(an, p.id); const v = a.i[critCle];
    return v ? { issue: v[0], valeur: v[1], source: v[2], a } : { issue: "indeterminate", a };
  }
  if (p.type === "commune") return { issue: "commune_seule" };
  if (p.sansAdresse) return { issue: "sans_adresse" };
  if (!adrLue(p)) return { issue: "adresse_non_examinee" };
  const a = lireAnalyse(p.adr, p.id); const v = a.i[critCle];
  return v ? { issue: v[0], valeur: v[1], source: v[2], a } : { issue: "indeterminate", a };
}
// L'échelle la plus fine où un critère a reçu une réponse pour cette possibilité.
function lirePlusFin(p, critCle) {
  for (const e of [...CRIT[critCle].ech].reverse()) {
    const r = lire(p, critCle, e);
    if (e === "territoire" || ETAB.has(r.issue) || r.issue === "to_confirm") return { ...r, ech: e };
  }
  return { ...lire(p, critCle, "territoire"), ech: "territoire" };
}

const REG = {
  favorable: { mot: "correspond", reg: "alignement" },
  reserve: { mot: "compromis", reg: "compromis" },
  mismatch: { mot: "moins bien que demandé", reg: "ecart" },
  incompatible: { mot: "ne tient pas", reg: "incompatibilite" },
  to_confirm: { mot: "à vérifier", reg: "controle" },
  indeterminate: { mot: "non établi", reg: "non-su" },
  piste: { mot: "rien n'est encore lu", reg: null },
  non_lu: { mot: "pas dans l'aperçu", reg: null },
  sans_adresse: { mot: "adresse inconnue", reg: null },
  adresse_non_examinee: { mot: "adresse pas encore analysée", reg: null },
  commune_seule: { mot: "demande une adresse", reg: null },
};
const motDe = (r) => REG[r.issue].mot + (r.libre && REG[r.issue].reg ? " (aperçu)" : "");
const regVar = (r) => (r.libre && REG[r.issue].reg ? "libre" : REG[r.issue]?.reg);
const teinte = (reg) => (reg && reg !== "libre" ? `var(--reg-${reg})` : "var(--r-meta)");

const NIVEAU = { analyse: null, apercu: "Aperçu gratuit de la commune", enregistre: "Enregistré · rien n'est encore lu", sans_adresse: "Commune analysée · adresse inconnue", adresse_enregistree: "Commune analysée · adresse pas encore" };
const ETAT_LIB = { en_course: "En course", a_considerer: "À considérer", ecarte: "Écartée" };

// ═══════════════════════════════════════════════════════════════════════════════════════════
// GLYPHES. La forme dit l'échelle (cercle, carré, losange) ; le trait dit le registre ; le
// remplissage dit qu'une réponse est établie. Une absence est dessinée en pointillé, jamais vide.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function forme(f, t, attrs) {
  const c = t / 2, m = 1.6;
  if (f === "cercle") return `<circle cx="${c}" cy="${c}" r="${c - m}" ${attrs}/>`;
  if (f === "carre") return `<rect x="${m}" y="${m}" width="${t - 2 * m}" height="${t - 2 * m}" rx="${t / 9}" ${attrs}/>`;
  const s = t * 0.66;
  return `<rect x="${c - s / 2}" y="${c - s / 2}" width="${s}" height="${s}" rx="${t / 14}" transform="rotate(45 ${c} ${c})" ${attrs}/>`;
}
function glyphe(ech, taille = 14) {
  return `<svg class="g" width="${taille}" height="${taille}" viewBox="0 0 ${taille} ${taille}" aria-hidden="true">${forme(ECH[ech].forme, taille, `fill="none" stroke="currentColor" stroke-width="1.4"`)}</svg>`;
}
// Une marque d'issue. Variante A (V3.1) : forme de l'échelle remplie de la teinte du registre.
// Variante B (stricte, Relevé) : la forme dit l'échelle, à l'encre ; le registre passe au trait de 3 px
// devant le mot, sous la marque (voir piste()). Une issue non établie n'a jamais de teinte.
function marque(r, ech, taille = 18) {
  if (S.marques === "B") {
    let attrs;
    if (ETAB.has(r.issue) && !r.libre) attrs = `fill="var(--r-fond)" stroke="var(--r-encre)" stroke-width="1.8"`;
    else if (r.libre && REG[r.issue].reg) attrs = `fill="var(--r-fond)" stroke="var(--r-discret)" stroke-width="1.8" stroke-dasharray="0.8 2.6" stroke-linecap="round"`;
    else if (r.issue === "to_confirm" || r.issue === "indeterminate") attrs = `fill="var(--r-fond)" stroke="var(--r-discret)" stroke-width="1.4" stroke-dasharray="3 2.4"`;
    else attrs = `fill="var(--r-fond)" stroke="var(--r-meta)" stroke-width="1.1" stroke-dasharray="2.4 3"`;
    return `<svg class="g" width="${taille}" height="${taille}" viewBox="0 0 ${taille} ${taille}" aria-hidden="true">${forme(ECH[ech].forme, taille, attrs)}</svg>`;
  }
  const col = teinte(REG[r.issue].reg);
  let attrs;
  if (ETAB.has(r.issue) && !r.libre) attrs = `fill="${col}" stroke="${col}" stroke-width="1.4"`;
  else if (r.libre && REG[r.issue].reg) attrs = `fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="1.2 3" stroke-linecap="round"`;

const NON_EXAMINE = new Set(["piste", "sans_adresse", "adresse_non_examinee", "commune_seule", "non_lu"]);
function communEch(a, b, crit) {
  for (const e of [...CRIT[crit].ech].reverse()) if (!NON_EXAMINE.has(lire(a, crit, e).issue) && !NON_EXAMINE.has(lire(b, crit, e).issue)) return e;
  return "territoire";
}
function classePaire(pa, pb, crit, ech) {

  if (a.libre || b.libre) return "partiel";
  // V3 : deux analyses produites sous deux versions du Projet ne se comparent pas, même quand
  // leurs issues coïncident. Seul « à vérifier des deux côtés » reste dit : ce n'est pas une comparaison.
  if (a.a && b.a && a.a.rev !== b.a.rev && !(a.issue === "to_confirm" && b.issue === "to_confirm")) return "hors_cadre";
  const ea = ETAB.has(a.issue), eb = ETAB.has(b.issue);

  if (ea || eb) return NON_EXAMINE.has((ea ? b : a).issue) ? "profondeur" : "incertain";
  if (NON_EXAMINE.has(a.issue) !== NON_EXAMINE.has(b.issue)) return "profondeur";
  if (a.issue === "to_confirm" && b.issue === "to_confirm") return "a_verifier";

// FAIRE LE POINT. Deux étapes, séparées dans le code comme elles le seraient dans le produit.

  for (const p of ct.ecartees) {
    if (p.ecart?.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare" && REV[p.ecart.rev].gare !== gareMax()) {
      out.push({ k: "ecart-" + p.id, sec: "jeu", html: `${go("fiche:" + p.id, esc(p.nom))} a été écartée le ${dc(p.ecart.date)} pour la gare, quand votre limite était de ${REV[p.ecart.rev].gare} min ; elle est aujourd'hui de ${gareMax()} min. Sans nouvelle analyse, futur•e ne peut pas dire si elle y correspondrait.`, refs: [refProjet(p.ecart.rev), refProjet()] });
    }
  }
  return out;
}

// Une paire de lieux : ce qui les sépare dans le même cadre, ce qu'ils partagent.
function enoncesPaire(pa, pb) {
  const out = [];
  const rangs = rangsPaire(pa, pb);
  const de = (rs) => [...new Map(rs.map((r) => [r.c.cle, r])).values()].sort((x, y) => ordreCrit(x.c, y.c));
  const lien = (r, txt) => go(`paire:${pa.id},${pb.id}:${r.c.cle}:${r.ech}`, txt);
  if (pa.commune === pb.commune) {
    out.push({ k: "socle", sec: "compare", html: `${nomL(pa)} et ${nomL(pb)} partagent la lecture de ${COMMUNES[pa.commune].nom} : une seule analyse de la commune, qui vaut pour les deux.`, refs: refsIssue(pa, "mer", "territoire") });
  }
  const sep = de(rangs.filter((r) => r.cl === "separe"));
  const uneEch = (rs) => new Set(rs.map((r) => r.ech)).size === 1;
  const elles = pa.type === "commune" && pb.type === "commune" ? "Elles" : "Ils";
  if (sep.length) {
    const u = uneEch(sep);
    out.push({ k: "separe", sec: "compare", html: `Ce qui les sépare${u ? `, ${OU[sep[0].ech]}` : ""} : ${sep.map((r) => `${lien(r, r.c.lab())}${u ? "" : " " + OU[r.ech]} (${nomL(pa)} : ${motDe(r.a)} ; ${nomL(pb)} : ${motDe(r.b)})`).join(", ")}.`, refs: uniq(sep.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  }
  const com = de(rangs.filter((r) => r.cl === "commun"));
  if (com.length) out.push({ k: "commun", sec: "compare", html: `${elles} se rejoignent sur ${liste(com.map((r) => lien(r, r.c.lab())))}.`, refs: uniq(com.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  const inc = de(rangs.filter((r) => r.cl === "incertain"));
  if (inc.length) out.push({ k: "incertain", sec: "ouvert", html: `Établi d'un seul côté, donc sans départage : ${inc.map((r) => `${lien(r, r.c.lab())} ${OU[r.ech]} (${nomL(pa)} : ${motDe(r.a)} ; ${nomL(pb)} : ${motDe(r.b)})`).join(", ")}.`, refs: uniq(inc.flatMap((r) => [...refsIssue(pa, r.c.cle, r.ech), ...refsIssue(pb, r.c.cle, r.ech)])) });
  const hc = rangs.filter((r) => r.cl === "hors_cadre");
  if (hc.length) {
    const vieilles = [pa, pb].flatMap(versionsDe).filter((v) => v.rev !== REV_COURANTE);
    out.push({ k: "horscadre", sec: "ouvert", html: `Leurs analyses ne répondent pas à la même version de votre Projet : ${liste(vieilles.map((v) => v.nom))} ${vieilles.length > 1 ? "ont été analysés" : "a été analysé"} avant que vous ne changiez votre Projet (une gare à moins de ${REV.r1.gare} min, aujourd'hui ${gareMax()}). Ces deux lieux ne peuvent pas encore être comparés de façon fiable : un écart comme un accord pourrait tenir à ce changement plutôt qu'aux lieux. ${go("cadre", "Mettre les analyses à jour pour les comparer")}.`, refs: uniq([refProjet("r1"), refProjet(), ...[pa, pb].flatMap(versionsDe).map(refAnalyse)]) });
  }
  return { out, rangs };
}

function enoncesCompare(ct) {
  const out = [];
  const n = ct.cands.length;
  if (n === 1) {
    const c = ct.cands[0], p = c.p;
    if (c.lecture !== "examine" && c.lecture !== "sans_adresse") return out;
    const parReg = {};
    for (const k of CRITERES.filter((k) => !S.cote.has(k.cle))) {
      const r = lirePlusFin(p, k.cle);
      if (!ETAB.has(r.issue)) continue;
      (parReg[r.issue] ??= []).push(`${go(`fiche:${p.id}:${k.cle}`, k.lab())}${r.ech !== "territoire" ? " " + OU[r.ech] : ""}`);
    }
    const morceaux = [["favorable", "correspond"], ["reserve", "compromis"], ["mismatch", "moins bien que demandé"], ["incompatible", "condition non tenue"]].filter(([i]) => parReg[i]).map(([i, m]) => `${m} pour ${liste(parReg[i])}`);
    out.push({ k: "seul", sec: "compare", html: `Pour ${nomL(p)}, futur•e établit : ${morceaux.join(" ; ")}. Aucun autre lieu ne permet encore de le situer : ${go("ajout", "ajouter une possibilité")} montrerait ce qui l'en distingue.`, refs: c.versions.map(refAnalyse) });
    return out;
  }
  if (n === 2) {
    const [a, b] = ct.cands.map((c) => c.p);
    return enoncesPaire(a, b).out;
  }
  // Trois possibilités ou plus : une lecture d'ensemble, jamais une mini-synthèse par lieu.
  const comp = ct.comparables.map((c) => c.p);
  if (comp.length < 2) {
    out.push({ k: "aucune-paire", sec: "compare", html: "Aucune paire de possibilités n'est encore comparable dans un même cadre : les raisons sont ci-dessous.", refs: [refProjet()] });
    return out;
  }
  const communes = [...new Map(comp.map((p) => [p.commune, p])).values()];
  if (communes.length >= 2) {
    const diff = CRITERES.filter((k) => !S.cote.has(k.cle)).filter((k) => {
      const iss = communes.map((p) => lire(p, k.cle, "territoire").issue).filter((i) => ETAB.has(i));
      return new Set(iss).size > 1;
    });
    const memes = CRITERES.filter((k) => !S.cote.has(k.cle) && !diff.includes(k)).filter((k) => communes.every((p) => ETAB.has(lire(p, k.cle, "territoire").issue)));
    out.push({ k: "ensemble", sec: "compare", html: `À la commune, ${liste(communes.map((p) => COMMUNES[p.commune].nom))} sont lues sous la même version de votre Projet. ${diff.length ? `Elles ne disent pas la même chose sur ${liste(diff.map((k) => go("lent:" + k.cle, k.lab())))}` : "Elles disent la même chose sur toutes vos conditions établies"}${memes.length ? ` ; elles se rejoignent sur ${liste(memes.map((k) => k.lab()))}` : ""}.`, refs: uniq(communes.flatMap((p) => versionsDe(p).filter((v) => v.ech === "territoire").map(refAnalyse))) });
  }
  // Les biens d'une même commune partagent un socle : on le dit une fois.
  const parCommune = Object.values(Object.groupBy(comp.filter((p) => p.type === "bien"), (p) => p.commune)).filter((g) => g.length > 1);
  for (const g of parCommune) {
    const avecAdr = g.filter((p) => p.adr);
    const sansAdr = g.filter((p) => !p.adr);
    out.push({ k: "socle-" + g[0].commune, sec: "compare", html: `${liste(g.map(nomL))} partagent la lecture de ${COMMUNES[g[0].commune].nom}. ${avecAdr.length >= 2 ? `Ce qui peut distinguer ${liste(avecAdr.map(nomL))} se lit aux abords et dans le logement${sansAdr.length ? ` ; ${liste(sansAdr.map(nomL))}, sans adresse, ne s'y lit pas encore` : ""}.` : `Sans adresse pour ${liste(sansAdr.map(nomL))}, rien ne les distingue encore.`}`, refs: versionsDe(g[0]).filter((v) => v.ech === "territoire").map(refAnalyse) });
  }
  // Des paires à rapprocher : même type, toutes deux au cadre, dans l'ordre d'ajout. Aucun mérite n'est classé.
  const paires = [];
  for (const type of ["bien", "commune"]) {
    const xs = comp.filter((p) => p.type === type && (type === "commune" || p.adr));
    if (xs.length >= 2) paires.push([xs[0], xs[1]]);
  }
  if (paires.length) out.push({ k: "rapprocher", sec: "compare", html: `Pour voir ce qui sépare deux lieux, rapprochez-les : ${paires.map(([a, b]) => go(`paire:${a.id},${b.id}`, `${nomL(a)} et ${nomL(b)}`)).join(", ou ")}.`, refs: [] });
  return out;
}

function enoncesOuvert(ct, dejaHc, dejaDits = new Set()) {
  const out = [];
  const hcs = ct.cands.filter((c) => c.horsCadre);
  if (hcs.length && !dejaHc && ct.cands.length > 1) {
    const vieilles = hcs.flatMap((c) => c.versions.filter((v) => v.rev !== REV_COURANTE));
    const noms = [...new Set(vieilles.map((v) => v.nom))];
    const touches = hcs.filter((c) => !noms.includes(c.p.court)).map((c) => c.p).filter((p) => p.type === "bien" && !noms.includes(p.court));
    const autre = ct.cands.find((c) => !c.horsCadre && c.p.type === hcs[0].p.type && c.lecture === "examine") ?? ct.cands.find((c) => !c.horsCadre);
    out.push({ k: "horscadre", sec: "ouvert", html: `${liste(noms.map(esc))} ${noms.length > 1 ? "ont été analysés" : "a été analysé"} avant que vous ne changiez votre Projet (une gare à moins de ${REV.r1.gare} min, aujourd'hui ${gareMax()}). Tant que ${noms.length > 1 ? "leurs analyses ne sont pas mises" : "son analyse n'est pas mise"} à jour, ${noms.length > 1 ? "ils ne peuvent pas être comparés" : "il ne peut pas être comparé"} de façon fiable à vos autres lieux${touches.length ? `. Cela vaut aussi pour ${liste(touches.map(nomL))}, dont la commune est ${liste([...new Set(touches.map((p) => COMMUNES[p.commune].nom))])}` : ""}${autre ? ` : ${go(`paire:${autre.p.id},${hcs[0].p.id}`, "voir pourquoi")}` : ""}.`, refs: uniq([refProjet("r1"), refProjet(), ...vieilles.map(refAnalyse)]) });
  }
  // Les inconnues, regroupées par condition, avec l'échelle où elles se posent.
  const parCrit = new Map();
  for (const c of ct.cands) for (const x of c.aVerifier) {
    if (dejaDits.has(x.c.cle)) continue;
    if (!parCrit.has(x.c.cle)) parCrit.set(x.c.cle, { c: x.c, ou: [] });
    const qui = x.r.ech === "territoire" ? `à ${COMMUNES[c.p.commune].nom}` : `${OU[x.r.ech]} du ${c.p.court}`;
    const e = parCrit.get(x.c.cle);
    if (!e.ou.some((o) => o.qui === qui)) e.ou.push({ qui, p: c.p, ech: x.r.ech });
  }
  if (parCrit.size) {
    const items = [...parCrit.values()].sort((x, y) => ordreCrit(x.c, y.c)).map((e) => `${go(`verif:${e.ou[0].p.id}:${e.c.cle}`, e.c.lab())}${e.c.sans ? ", condition sans compromis," : ""} ${liste(e.ou.map((o) => esc(o.qui)))}`);
    out.push({ k: "inconnues", sec: "ouvert", html: `Restent à vérifier, et futur•e ne peut pas les établir : ${items.join(" ; ")}.`, refs: uniq(ct.cands.filter((c) => c.aVerifier.length).flatMap((c) => c.versions.map(refAnalyse))) });
  }
  for (const c of ct.cands) {
    const nom = go("fiche:" + c.p.id, esc(c.p.type === "bien" ? c.p.court : c.p.nom));
    if (c.lecture === "apercu") out.push({ k: "apercu-" + c.p.id, sec: "ouvert", html: `${nom} n'est connue que par l'aperçu gratuit : ${Object.keys(cLibre(c.p)).length} de vos ${CRITERES.length} conditions y sont lues, trop peu pour la comparer. Ce que l'aperçu ne lit pas reste inconnu ; ce n'est ni bon ni mauvais signe.`, refs: [{ g: "territoire", t: `${c.p.nom} · aperçu gratuit` }] });
    if (c.lecture === "piste") out.push({ k: "piste-" + c.p.id, sec: "ouvert", html: `${nom} est enregistré : rien n'y est encore lu.`, refs: [] });
    if (c.lecture === "sans_adresse") out.push({ k: "sansadr-" + c.p.id, sec: "ouvert", html: `${nom} : sans adresse exacte, seule la commune est lue ; les abords et le logement restent inconnus.`, refs: c.versions.map(refAnalyse) });
    if (c.lecture === "adresse_non_examinee") out.push({ k: "adrne-" + c.p.id, sec: "ouvert", html: `${nom} : la commune est lue, l'adresse pas encore.`, refs: c.versions.map(refAnalyse) });
  }
  if (ct.obs.length) {
    const lieux = [...new Set(ct.obs.map((o) => o.pid))];
    out.push({ k: "obs", sec: "ouvert", html: `Vos ${ct.obs.length > 1 ? `${nb(ct.obs.length, false)} observations` : "observation"} (${liste(lieux.map((id) => go("fiche:" + id, nomL(P(id)))))}) ${ct.obs.length > 1 ? "restent des notes" : "reste une note"} : ${ct.obs.length > 1 ? "elles ne modifient" : "elle ne modifie"} aucune issue.`, refs: ct.obs.map((o) => ({ g: null, t: `${cap(o.origine)} · ${dc(o.date)}` })) });
  }
  out.push({ k: "budget", sec: "ouvert", html: "Votre budget de 320 000 € n'est mesuré pour aucun lieu : rien dans cette lecture n'en tient compte.", refs: [refProjet()] });
  if (ct.cote.length) out.push({ k: "cote", sec: "ouvert", html: `Mis de côté dans cette vue : ${liste(ct.cote.map((k) => CRIT[k].lab()))}. Votre Projet n'est pas modifié.`, refs: [] });
  return out;
}

function enoncesAvancer(ct) {
  const out = [];
  const actions = [];
  for (const c of ct.cands.filter((c) => c.p.visite && c.p.visite >= AUJ)) {
    actions.push({ txt: `Préparer la visite du ${dc(c.p.visite)} au ${c.p.court}`, arg: `verif:${c.p.id}:${c.aVerifier[0]?.c.cle ?? ""}` });
  }
  for (const c of ct.cands) for (const x of c.aVerifier) {
    if (actions.length >= 3) break;
    if (c.p.visite && c.p.visite >= AUJ) continue;
    const deja = actions.some((a) => a.crit === x.c.cle && x.r.ech === "territoire" && a.commune === c.p.commune);
    if (!deja) actions.push({ txt: VERIF[x.c.cle] ?? `Vérifier : ${x.c.lab()}`, arg: `verif:${c.p.id}:${x.c.cle}`, crit: x.c.cle, commune: c.p.commune, qui: x.r.ech === "territoire" ? COMMUNES[c.p.commune].nom : c.p.court });
  }
  if (actions.length) out.push({ k: "avancer", sec: "avancer", liste: actions, html: "", refs: [] });
  return out;
}

function enoncesDepuis(ct) {
  const ev = ct.evts.filter((e) => !e.futur);
  if (!ev.length || Date.parse(AUJ) - Date.parse(S.derniere) < 14 * 864e5) return [];
  const proj = ev.filter((e) => e.type === "projet");
  const de = (type) => [...new Set(ev.filter((e) => e.type === type && e.qui).map((e) => e.qui))].map((id) => esc(P(id).type === "bien" ? P(id).court : P(id).nom));
  const morceaux = [];
  if (proj.length) morceaux.push(`votre Projet a été révisé le ${dc(proj[0].date)} (une gare à moins de 30 min au lieu de 20)`);
  const mot = ev.find((e) => e.type === "moteur");
  const aj = de("ajout"), exa = de("examen"), vis = de("visite"), eca = de("ecarte");
  for (const [xs, un, des] of [[aj, "un ajout", "ajouts"], [exa, "un examen", "examens"], [vis, "une visite", "visites"], [eca, "un lieu écarté", "lieux écartés"]]) {
    if (xs.length) morceaux.push(`${xs.length > 1 ? `${nb(xs.length, false)} ${des}` : un} (${liste(xs)})`);
  }
  const t = `Depuis votre visite du ${dc(S.derniere)} : ${morceaux.join(" ; ")}.${mot ? ` futur•e a fait évoluer sa méthode d'analyse le ${dc(mot.date)} ; vos analyses n'ont pas été refaites pour autant.` : ""} Le temps écoulé ne change aucune analyse.`;
  return [{ k: "depuis", sec: "depuis", html: t, refs: [{ g: null, t: `Journal · ${ev.length} entrées, du ${dc(ev[0].date)} au ${dc(ev.at(-1).date)}` }] }];
}

function lecture(ct) {
  const jeu = enoncesJeu(ct);
  const compare = enoncesCompare(ct);
  const dits = new Set(ct.cands.length === 2 ? rangsPaire(ct.cands[0].p, ct.cands[1].p).filter((r) => r.cl === "incertain").map((r) => r.c.cle) : []);
  const ouvert = [...compare.filter((e) => e.sec === "ouvert"), ...enoncesOuvert(ct, compare.some((e) => e.k === "horscadre"), dits)];
  return [
    { cle: "depuis", titre: "Ce qui a changé", es: enoncesDepuis(ct) },
    { cle: "jeu", titre: "Ce qui reste en jeu", es: jeu },
    { cle: "compare", titre: ct.cands.length === 1 ? "Ce qui est établi" : "Ce qui se compare", es: compare.filter((e) => e.sec === "compare") },
    { cle: "ouvert", titre: "Ce qui ne peut pas encore être conclu", es: ouvert },
    { cle: "avancer", titre: "Ce qui ferait avancer", es: enoncesAvancer(ct) },
  ].filter((s) => s.es.length);
}

// La lecture d'accueil : une ou deux phrases, tirées des mêmes énoncés, jamais un autre texte.
function accroche(ct) {
  const sections = lecture(ct);
  const tous = sections.flatMap((s) => s.es);
  const prem = tous.find((e) => e.k === "jeu");
  const limite = tous.find((e) => e.k.startsWith("bloq-")) ?? tous.find((e) => e.k === "horscadre") ?? tous.find((e) => e.k === "aucune-paire") ?? tous.find((e) => e.k.startsWith("apercu-")) ?? tous.find((e) => e.k === "separe" || e.k === "ensemble" || e.k === "seul");
  return [prem, limite].filter(Boolean);
}


// ═══════════════════════════════════════════════════════════════════════════════════════════
// LE LANGAGE COURANT. Ce que l'écran dit au premier niveau. Les versions du Projet, le moteur et
// les dates d'analyse ne sont écrits qu'au troisième niveau (« Voir les détails de cette analyse »).
// ═══════════════════════════════════════════════════════════════════════════════════════════
const notesToutes = () => [...(S.obs ? OBS : []), ...S.notes];
const bloquants = (p) => CRITERES.filter((c) => c.sans).filter((c) => { const r = lire(p, c.cle, "territoire"); return r.issue === "incompatible" && !r.libre; });
const horsCadreP = (p) => versionsDe(p).some((v) => v.rev !== REV_COURANTE);
const nomLieu = (p) => (p.type === "bien" ? p.court : p.nom);
const typeBien = (p) => (p.type === "bien" ? p.nom.split(",")[0] : "Commune");
const OU_COURT = { territoire: "à la commune", autour: "aux abords", logement: "dans le logement" };
const CONCERNE = { territoire: "Ce résultat concerne la commune.", autour: "Ce résultat concerne les abords de l'adresse.", logement: "Ce résultat concerne le logement lui-même." };
const IMPORTANCE = { 3: "compte beaucoup", 2: "compte", 1: "compte un peu" };
const CONCLUT = {
  favorable: (c) => `Cela correspond à votre condition « ${c.lab()} ».`,
  reserve: (c) => `C'est un compromis sur votre condition « ${c.lab()} ».`,
  mismatch: (c) => `C'est moins bien que votre condition « ${c.lab()} ».`,
  incompatible: (c) => `Votre condition sans compromis « ${c.lab()} » n'est pas tenue. Rien ne la compense.`,
  to_confirm: (c) => `futur•e ne peut pas établir si votre condition « ${c.lab()} » est tenue.`,
  indeterminate: (c) => `Les données ne permettent pas de conclure sur « ${c.lab()} ».`,
};
function evenementsDepuis() {
  return JOURNAL.filter((j) => (j.qui === null || S.ids.includes(j.qui)) && j.date > S.derniere && j.date <= AUJ);
}

// V3.2 · CE QUI EST CONNU D'UN LIEU, avec ses mots. La forme est celle de l'emblème du Relevé ;
// elle ne prend jamais de teinte (la V3.1 colorait les formes sous une lentille : retiré).
const MOTS_CONNU = (p) => ({ analyse: p.type === "bien" ? "Commune, abords et logement analysés" : "Commune analysée", sans_adresse: "Commune analysée · adresse inconnue", adresse_enregistree: "Commune analysée · adresse enregistrée, pas encore analysée", apercu: "Aperçu gratuit de la commune", enregistre: "Enregistré · rien n'est encore lu" });
function profondeur(p) {
  return `<span class="t-prof">${MOTS_CONNU(p)[etatConnu(p)]}</span>`;
}
// Une ligne d'attention, au plus deux, seulement quand elles comptent.
function attentions(p) {
  if (S.lentille) {
    const r = lirePlusFin(p, S.lentille);
    if (r.a && r.a.rev !== REV_COURANTE) return [{ t: "Votre Projet a changé depuis cette analyse", neutre: true }];
    if (NON_EXAMINE.has(r.issue)) return [{ t: `${cap(CRIT[S.lentille].court())} : ${motDe(r)}`, neutre: true }];
    return [{ t: `${cap(CRIT[S.lentille].court())} : ${motDe(r)}${ETAB.has(r.issue) || r.issue === "to_confirm" ? `, ${OU_COURT[r.ech]}` : ""}`, reg: REG[r.issue].reg && !r.libre ? REG[r.issue].reg : null }];
  }
  const out = [];
  const bq = bloquants(p);
  if (bq.length) out.push({ t: `Ne tient pas : ${bq.map((c) => c.lab()).join(", ")}`, reg: "incompatibilite" });
  if (p.etat === "ecarte") {
    const change = p.ecart.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare";
    out.push({ t: change ? "Écarté pour une raison qui a changé depuis" : `Écarté le ${dc(p.ecart.date)}`, reg: change ? "controle" : null, neutre: !change });
    return out;
  }
  if (horsCadreP(p)) out.push({ t: "Votre Projet a changé depuis cette analyse", neutre: true });
  const n = CRITERES.filter((c) => !S.cote.has(c.cle) && lirePlusFin(p, c.cle).issue === "to_confirm" && !cLibre(p)).length;
  if (n && out.length < 2) out.push({ t: `${n} ${pl(n, "point")} à vérifier`, reg: "controle" });
  const nn = notesToutes().filter((o) => o.pid === p.id).length;
  if (nn && out.length < 2) out.push({ t: `${nn} ${pl(nn, "note")} de visite`, neutre: true });
  return out;
}
function htmlTuile(p) {
  const choix = Array.isArray(S.choix);
  const choisie = choix && S.choix.includes(p.id);
  const course = p.etat === "en_course";
  const sous = [typeBien(p) === "Commune" ? null : typeBien(p), p.visite && p.etat !== "ecarte" ? `visite le ${dc(p.visite)}` : null].filter(Boolean).join(" · ");
  const att = attentions(p);
  const lib = choix ? `${choisie ? "Retirer" : "Choisir"} ${nomLieu(p)}` : `Ouvrir ${nomLieu(p)}`;
  return `<li class="tuile ${choisie ? "choisie" : ""} ${S.nouveau === p.id ? "nouveau" : ""} ${choix ? "en-choix" : ""}">
    <button class="tuile-b" data-act="${choix ? "choisir" : "ouvrir"}" data-arg="${p.id}" data-fk="tuile-${p.id}" ${choix ? `aria-pressed="${choisie}"` : ""} aria-label="${esc(lib)}">
      <span class="t-emb">${emblemeLieu(p, 46)}</span><span class="t-txt">
      <span class="t-haut"><span class="t-commune">${p.type === "bien" ? COMMUNES[p.commune].nom : "Commune"}</span><span class="t-etat ${course ? "course" : ""}">${S.nouveau === p.id ? `<span class="nouveau-mot">nouveau</span>` : ""}${ETAT_LIB[p.etat]}</span></span>
      <span class="t-nom">${esc(nomLieu(p))}</span>
      ${sous ? `<span class="t-type">${sous}</span>` : ""}
      <span class="t-bas">${profondeur(p)}${S.depuis === p.id ? `<span class="t-prof">Vient de votre dossier du ${dc(cAnalyse(p) ? ANALYSES[cAnalyse(p)].date : AUJ)}</span>` : ""}${att.map((a) => `<span class="t-att ${a.neutre ? "neutre" : ""}" style="--t:${a.reg ? `var(--reg-${a.reg})` : "var(--r-meta)"}">${a.t}</span>`).join("")}</span></span>
    </button>${choix ? `<span class="coche" aria-hidden="true">${choisie ? "Choisi" : "Choisir"}</span>` : ""}
  </li>`;
}
const tuileAjout = () => `<li class="tuile tuile-ajout"><button class="tuile-b" data-act="ajout" data-fk="ajout" aria-expanded="${S.menus.ajout}"><span class="t-emb" aria-hidden="true"></span><span class="t-txt"><span class="t-commune">Une commune, une adresse, une annonce</span><span class="t-nom">+ Ajouter un lieu</span><span class="t-prof">L'ajouter l'enregistre ; rien n'est analysé ni acheté.</span></span></button></li>`;

// ═══════════════════════════════════════════════════════════════════════════════════════════
// LA SOURCE UNIQUE DES PROCHAINES ACTIONS. L'accueil en montre trois, le point les reprend.
// Aucune n'est un achat ; une inconnue n'est jamais un bouton de paiement.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function actions() {
  const ct = contrat();
  const out = [];
  for (const c of ct.cands.filter((c) => c.p.visite && c.p.visite >= AUJ)) {
    out.push({ k: "visite-" + c.p.id, t: `Préparer la visite du ${dc(c.p.visite)} au ${c.p.court}`, pq: c.aVerifier.length ? `${c.aVerifier.length} ${pl(c.aVerifier.length, "point")} à vérifier sur place` : "Ce que la visite peut vous apprendre", act: `verif:${c.p.id}:${c.aVerifier[0]?.c.cle ?? ""}`, lib: "Préparer" });
  }
  const comp = ct.comparables.map((c) => c.p).filter((p) => p.type === "bien" ? adrLue(p) : true);
  // V3.2 : un lieu enregistré ou connu par l'aperçu dit ce qui peut en être lu. Jamais un bouton d'achat.
  for (const c of ct.cands.filter((c) => c.lecture === "piste" || c.lecture === "adresse_non_examinee" && S.connu[c.p.id] || c.lecture === "apercu" && S.connu[c.p.id])) {
    out.push({ k: "connu-" + c.p.id, t: `Voir ce qui peut être lu de ${nomLieu(c.p)}`, pq: c.lecture === "apercu" ? "L'aperçu gratuit lit une partie de vos conditions, à la commune" : c.lecture === "piste" ? "Enregistré : rien n'est encore lu" : "La commune est lue ; l'adresse ne l'est pas encore", act: `fiche:${c.p.id}`, lib: "Voir" });
  }
  if (ct.cands.length === 2 && comp.length === 2) out.push({ k: "comparer", t: `Comparer ${nomLieu(comp[0])} et ${nomLieu(comp[1])}`, pq: "Voir ce qui les distingue au regard de votre Projet", act: `paire:${comp[0].id},${comp[1].id}`, lib: "Comparer" });
  const hcs = ct.cands.filter((c) => c.horsCadre);
  if (hcs.length && ct.cands.length > 1) out.push({ k: "maj", t: `Mettre à jour l'analyse ${hcs.length > 1 ? "de " + liste(hcs.map((c) => nomLieu(c.p))) : `du ${nomLieu(hcs[0].p)}`}`, pq: "Votre Projet a changé depuis : sans mise à jour, la comparaison n'est pas fiable", act: "cadre", lib: "Mettre à jour", sim: true });
  const vus = new Set();
  for (const c of ct.cands) for (const x of c.aVerifier) {
    if (c.p.visite && c.p.visite >= AUJ) continue;
    const cle = x.r.ech === "territoire" ? `${x.c.cle}@${c.p.commune}` : `${x.c.cle}@${c.p.id}`;
    if (vus.has(cle)) continue; vus.add(cle);
    out.push({ k: "v-" + cle, t: VERIF[x.c.cle] ?? `Vérifier : ${x.c.lab()}`, pq: `${cap(x.c.lab())} · ${x.r.ech === "territoire" ? COMMUNES[c.p.commune].nom : c.p.court}`, act: `verif:${c.p.id}:${x.c.cle}`, lib: "Voir" });
  }
  for (const p of ct.ecartees.filter((p) => p.ecart?.rev && p.ecart.rev !== REV_COURANTE && p.ecart.critere === "gare")) {
    out.push({ k: "revoir-" + p.id, t: `Revoir ${p.nom}`, pq: `Écartée pour la gare quand votre limite était de ${REV[p.ecart.rev].gare} min ; elle est aujourd'hui de ${gareMax()} min`, act: `fiche:${p.id}`, lib: "Revoir" });
  }
  for (const c of ct.cands.filter((c) => c.lecture === "sans_adresse")) out.push({ k: "adr-" + c.p.id, t: `Préciser l'adresse de ${nomLieu(c.p)}`, pq: "Sans adresse, seule la commune peut être lue", act: `fiche:${c.p.id}`, lib: "Voir" });
  return out;
}
function htmlActions(xs) {
  return `<ol class="a-faire">${xs.map((a) => `<li><div><p>${esc(a.t)}${a.sim ? ` <span class="sim">simulation</span>` : ""}</p><p class="pourquoi">${a.pq}</p></div><button class="lien" data-act="go" data-arg="${a.act}" data-fk="af-${a.k}">${a.lib}</button></li>`).join("")}</ol>`;
}

// ═══════════════════════════════════════════════════════════════════════════════════════════
// L'ACCUEIL. Le même écran à tous les moments de la recherche ; il révèle sa profondeur à mesure
// que la recherche s'enrichit. Un seul geste principal, choisi selon le moment.
// ═══════════════════════════════════════════════════════════════════════════════════════════
function geste(ct) {
  const n = ct.cands.length;
  if (n === 0) return { t: "Ajouter un premier lieu", act: "ajout" };
  if (n === 1) return { t: "Voir ce que dit ce lieu", act: `fiche:${ct.cands[0].p.id}` };
  // Un lieu qui vient d'être enregistré : le geste est de voir ce qui peut en être lu, pas de comparer.
  const neuf = ct.cands.find((c) => c.p.id === S.nouveau && S.connu[c.p.id]);
  if (neuf) return { t: `Voir ce qui peut être lu de ${nomLieu(neuf.p)}`, act: `fiche:${neuf.p.id}` };
  if (n === 2) return { t: "Comparer ces deux lieux", act: `paire:${ct.cands[0].p.id},${ct.cands[1].p.id}` };
  return { t: "Faire le point", act: "point" };
}
function phrasesAccueil(ct) {
  const n = ct.cands.length, out = [];
  const ec = ct.ecartees.length;
  const bloq = ct.cands.filter((c) => c.bloq.length);
  if (n === 0) return [{ t: "Aucun lieu n'est encore analysé. Ajoutez une commune ou une adresse : futur•e la lira au regard de ce que vous cherchez." }];
  if (n === 1) {
    out.push({ t: `Vous avez analysé un premier lieu, ${esc(nomLieu(ct.cands[0].p))}. Voici ce qu'il faut en retenir.` });
    return out;
  }
  out.push({ t: n === 2 ? `Deux lieux sont dans votre recherche${ec ? `, et ${ec > 1 ? `${nb(ec, false)} ont été écartés` : "un a été écarté"}` : ""}.` : `${cap(nb(n, false))} lieux sont dans votre recherche${ec ? `, et ${ec > 1 ? `${nb(ec, false)} ont été écartés` : "un a été écarté"}` : ""}.` });
  for (const c of bloq) out.push({ t: `${esc(nomLieu(c.p))} ne tient pas votre condition « ${c.bloq[0].lab()} » : rien ne compense ce point.`, reg: "incompatibilite" });
  if (bloq.length) return out;
  const hcs = ct.cands.filter((c) => c.horsCadre);
  if (n === 2) {
    const [a, b] = ct.cands.map((c) => c.p);
    const neuf = ct.cands.find((c) => S.connu[c.p.id]);
    if (neuf) out.push({ t: neuf.lecture === "piste" ? `${esc(nomLieu(neuf.p))} est enregistré : rien n'en est encore lu, il ne se compare pas encore.` : neuf.lecture === "apercu" ? `${esc(nomLieu(neuf.p))} n'est connue que par l'aperçu gratuit : trop peu pour les comparer.` : `${esc(nomLieu(neuf.p))} est enregistré : sa commune est déjà lue, son adresse pas encore.` });
    else if (hcs.length) out.push({ t: "Ils ne peuvent pas encore être comparés de façon fiable : votre Projet a changé depuis l'une des analyses." });
    else if (ct.cands.some((c) => c.lecture === "apercu")) out.push({ t: `${esc(nomLieu(ct.cands.find((c) => c.lecture === "apercu").p))} n'est connue que par l'aperçu gratuit : trop peu pour les comparer.` });
    else { const sep = [...new Set(rangsPaire(a, b).filter((r) => r.cl === "separe").map((r) => r.c.cle))]; out.push({ t: sep.length ? `${cap(nb(sep.length))} ${pl(sep.length, "condition")} les ${sep.length > 1 ? "distinguent" : "distingue"}. Comparez-les pour voir dans quel sens.` : "Rien d'établi ne les distingue encore." }); }
  } else if (hcs.length) out.push({ t: `${hcs.length > 1 ? `${cap(nb(hcs.length, false))} d'entre eux ne peuvent` : `${esc(nomLieu(hcs[0].p))} ne peut`} pas encore être comparé${hcs.length > 1 ? "s" : ""} de façon fiable aux autres : votre Projet a changé depuis ${hcs.length > 1 ? "leur" : "son"} analyse.` });
  return out;
}
function htmlRetenir(p) {
  const G = [["favorable", "Correspond", "alignement"], ["reserve", "Avec un compromis", "compromis"], ["mismatch", "Moins bien que demandé", "ecart"], ["incompatible", "Ne tient pas", "incompatibilite"], ["to_confirm", "À vérifier", "controle"]];
  const par = {};
  for (const c of CRITERES) { const r = lirePlusFin(p, c.cle); (par[r.issue] ??= []).push({ c, r }); }
  return `<div class="retenir-cols">${G.filter(([i]) => par[i]).map(([i, t, reg]) => `<div><h3 style="--t:var(--reg-${reg})">${t}</h3><ul>${par[i].map((x) => `<li>${cap(x.c.lab())}<span>${glyphe(x.r.ech, 10)} ${OU_COURT[x.r.ech]}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
}
// V3.2 · ce que veut dire « Votre Projet », pour quelqu'un qui découvre futur•e.
const DEF_PROJET = "Votre Projet, c'est ce que vous avez dit chercher : vos conditions et vos préférences. futur•e lit chaque lieu à partir de lui.";
function htmlProjetPanneau() {
  const sans = CRITERES.filter((c) => c.sans), prio = CRITERES.filter((c) => !c.sans).sort(ordreCrit);
  return `<div class="projet-panneau arrive" id="projet-panneau">
    <p class="projet-def">${DEF_PROJET}</p>
    <div><h3>Sans compromis</h3><ul>${sans.map((c) => `<li>${cap(c.lab())}</li>`).join("")}</ul></div>
    <div><h3>Ce qui compte pour vous</h3><ul>${prio.map((c) => `<li>${cap(c.lab())}<span>${IMPORTANCE[c.poids]}</span></li>`).join("")}</ul></div>
    <div><h3>Ce que futur•e ne mesure pas</h3><ul><li>Votre budget de 320 000 €</li></ul>
      <h3 style="margin-top:22px">Dernier changement</h3><p class="dense">Le ${dc(REV.r2.date)} : une gare à moins de 30 min au lieu de 20, après votre visite du 4 oct.</p>
      <p class="marge" style="margin-top:8px">Projet · révision 2 du 8 oct. · révision 1 du 8 sept.</p></div>
  </div>`;
}
function htmlAjout() {
  const s = S.situation;
  // V3.2 : ajouter ENREGISTRE le lieu. Rien n'est analysé ni acheté ; la fiche dit ensuite ce qui peut être lu.
  const propositions = s === "vide" ? [["ajouter:sternes", "T3, 12 rue des Sternes, Port-Anvel"]] : s === "premier" ? [["ajouter:goelands", "Appartement, 5 allée des Goélands, Port-Anvel"]] : s === "rapport-commune" || S.ids.includes("portanvel") ? [["ajouter:ploubrec", "Ploubrec, une commune"]] : [["ajouter:kerlavan", "Kerlavan, une commune"], ["ajouter:ecluse", "Maison, 4 rue de l'Écluse, Saint-Aurec"]];
